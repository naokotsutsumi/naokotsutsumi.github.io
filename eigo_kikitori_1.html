<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>えいごききとり 第1回</title>
<style>
:root{--g:#58cc02;--gd:#46a302;--b:#1cb0f6;--bd:#1899d6;--r:#ff4b4b;--rd:#ea2b2b;--y:#ffc800;--line:#e5e5e5;--txt:#3c3c3c;--sub:#777}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Hiragino Maru Gothic ProN","BIZ UDPGothic","Meiryo","Noto Sans JP",sans-serif;color:var(--txt);background:#fff;min-height:100vh}
button{font-family:inherit;cursor:pointer}
.screen{display:none;max-width:980px;margin:0 auto;padding:16px;min-height:100vh;flex-direction:column}
.screen.on{display:flex}
.btn{border:none;border-radius:16px;font-size:20px;font-weight:800;padding:14px 22px;color:#fff;background:var(--g);box-shadow:0 5px 0 var(--gd);transition:transform .05s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--gd)}
.btn.blue{background:var(--b);box-shadow:0 5px 0 var(--bd)}
.btn.white{background:#fff;color:var(--b);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn:disabled{background:var(--line);box-shadow:0 5px 0 #ccc;color:#afafaf;cursor:default}
/* home */
.home h1{text-align:center;font-size:34px;margin:24px 0 4px}
.home .sub{text-align:center;color:var(--sub);margin-bottom:24px}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.card{border:2px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 4px 0 var(--line);text-align:center;background:#fff}
.card h2{margin:6px 0 8px;font-size:24px}
.card p{color:var(--sub);margin:0 0 16px;font-size:15px;line-height:1.6}
.card .icon{font-size:52px}
.opts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
.chip{border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 12px;font-size:15px;font-weight:700;color:var(--sub)}
.chip.on{border-color:var(--b);color:var(--b);background:#ddf4ff}
/* top bar */
.top{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.x{background:none;border:none;font-size:30px;color:#afafaf;padding:4px 8px}
.bar{flex:1;height:18px;background:var(--line);border-radius:10px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--g);border-radius:10px;transition:width .3s}
.streak{font-weight:800;color:#ff9600;font-size:20px;min-width:56px;text-align:right}
/* picture */
.pic{position:relative;background:#fff;border-radius:14px;overflow:hidden;display:flex;align-items:center;justify-content:center;aspect-ratio:1/1;width:100%}
.pic img,.pic svg{width:100%;height:100%;object-fit:contain}
.ph{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;border:3px dashed #ccc;border-radius:14px;color:#999;padding:8px;text-align:center}
.ph b{font-size:30px;color:#666}
.ph small{font-size:12px;margin-top:6px}
/* flashcard */
.fc-wrap{flex:1;padding-bottom:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.fc{width:min(60vh,92vw,560px);border:3px solid var(--line);border-radius:24px;padding:18px;box-shadow:0 6px 0 var(--line);background:#fff;cursor:pointer}
.fc .word{font-size:clamp(30px,5.5vh,56px);font-weight:800;text-align:center;margin-top:8px;min-height:1.3em;letter-spacing:.02em;font-family:"Century Gothic","Arial Rounded MT Bold",Arial,sans-serif}
.fc .ja{text-align:center;color:var(--sub);font-size:20px;min-height:1.4em}
.hide{visibility:hidden}
.fc-ctrl{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center}
.count{font-weight:800;color:var(--sub);font-size:18px;min-width:80px;text-align:center}
.auto-on{background:var(--y)!important;box-shadow:0 5px 0 #e0a800!important;color:#3c3c3c!important}
/* speaker buttons */
.spk{width:96px;height:96px;border-radius:22px;border:none;background:var(--b);box-shadow:0 6px 0 var(--bd);display:flex;align-items:center;justify-content:center}
.spk.small{width:64px;height:64px;border-radius:16px}
.spk svg{width:56%;height:56%;fill:#fff}
/* game (matching) */
.q-title{font-size:24px;font-weight:800;margin:4px 0 12px}
.slowbtn{border:2px solid var(--line);background:#fff;border-radius:12px;padding:6px 12px;font-weight:800;color:var(--sub);font-size:15px;box-shadow:0 3px 0 var(--line)}
.slowbtn.on{border-color:var(--b);color:var(--b);background:#ddf4ff}
.match{display:grid;grid-template-columns:1fr 210px;gap:16px 24px;align-items:start}
.col-p{grid-column:1;grid-row:1;display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.col-a{grid-column:2;grid-row:1;display:grid;grid-template-rows:repeat(var(--n,4),1fr);gap:12px;height:100%}
.col-p .tile.p{height:calc((100vh - 290px)/2);min-height:150px;max-height:300px;aspect-ratio:auto;padding:6px}
.col-a .tile.a{height:auto;min-height:70px}
@media(max-width:700px){.match{grid-template-columns:1fr 110px}.col-a .tile.a .w{display:none}}
.tile{min-width:0;overflow:hidden;border:2px solid var(--line);border-radius:18px;background:#fff;box-shadow:0 4px 0 var(--line);display:flex;align-items:center;justify-content:center;transition:transform .08s,opacity .3s}
.tile.a{gap:10px;font-weight:800;font-size:20px;color:var(--b)}
.tile.a .ic{width:52px;height:52px;border-radius:50%;background:var(--b);display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 var(--bd)}
.tile.a .ic svg{width:58%;fill:#fff}
.tile.p{padding:8px;aspect-ratio:1/1}
.tile.p .pic{height:100%}
.tile.sel{border-color:var(--b);background:#ddf4ff;box-shadow:0 4px 0 var(--b)}
.tile.ok{border-color:var(--g);background:#d7ffb8;box-shadow:0 4px 0 var(--g)}
.tile.ng{border-color:var(--r);background:#ffdfe0;box-shadow:0 4px 0 var(--r);animation:shake .3s}
.tile.done{opacity:.35;pointer-events:none;box-shadow:none}
.tile.done.a .ic{background:var(--g);box-shadow:none}
.tile .w{font-family:Arial,sans-serif;color:var(--gd)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.howto{font-size:18px;font-weight:700;color:var(--sub);margin:0 0 12px}
.setinfo{color:var(--sub);font-weight:800}
.foot{position:sticky;bottom:0;margin-top:auto;padding:16px;border-top:2px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:space-between;gap:12px;border-radius:16px 16px 0 0}
.foot.good{background:#d7ffb8;border-color:#d7ffb8}
.fb{font-size:22px;font-weight:800;color:var(--gd)}
/* label overlay for crayon / day calendar */
.labwrap{position:relative;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}
.labwrap img{width:100%;height:auto;max-height:70%;object-fit:contain}
.labwrap .lab{white-space:nowrap;font-weight:800;color:#222;font-size:clamp(18px,4.2vw,40px);line-height:1.1;margin-top:4px;font-family:"BIZ UDPGothic","Hiragino Maru Gothic ProN","Meiryo",sans-serif}
.labwrap.day img{max-height:100%;height:100%}
.labwrap.day .lab{position:absolute;top:50%;left:50%;transform:translate(-50%,-38%);margin:0;font-size:clamp(14px,2.4vw,34px)}
.fc .labwrap .lab{font-size:clamp(30px,6vh,56px)}
.fc .labwrap.day .lab{font-size:clamp(28px,5.5vh,52px)}
/* result */
.result{align-items:center;text-align:center}
.result h1{font-size:36px;margin:30px 0 8px;color:#ff9600}
.stats{display:flex;gap:14px;justify-content:center;margin:16px 0 24px;flex-wrap:wrap}
.stat{border:2px solid var(--y);border-radius:16px;min-width:130px;overflow:hidden}
.stat div:first-child{background:var(--y);color:#fff;font-weight:800;padding:4px}
.stat div:last-child{font-size:28px;font-weight:800;padding:10px;color:#ff9600}
.miss{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;width:100%;margin:10px 0 24px}
.ch{border:2px solid var(--line);border-radius:18px;padding:10px;background:#fff;box-shadow:0 4px 0 var(--line);display:flex;flex-direction:column;align-items:center;gap:6px}
.miss .ch{cursor:pointer}
.miss .w{font-weight:800;font-family:Arial,sans-serif}
.note{font-size:13px;color:#999;text-align:center;margin-top:20px}
</style>
</head>
<body>

<!-- HOME -->
<section id="home" class="screen home on">
  <h1>えいご ききとり <span style="color:var(--g)">第1回</span></h1>
  <div class="sub">Let's Try! 1・2 の ことば 30</div>
  <div class="menu">
    <div class="card">
      <div class="icon">🃏</div>
      <h2>フラッシュカード</h2>
      <p>絵を見て、音をよく聞こう。<br>みんなで しずかに聞く ときは「じどう」。</p>
      <div class="opts" id="fcOpts">
        <button class="chip on" data-k="word" data-v="hide">英語：かくす</button>
        <button class="chip" data-k="word" data-v="show">英語：見せる</button>
      </div>
      <div class="opts" id="fcOpts2">
        <button class="chip on" data-k="rep" data-v="2">音 2回</button>
        <button class="chip" data-k="rep" data-v="1">音 1回</button>
        <button class="chip" data-k="rep" data-v="3">音 3回</button>
      </div>
      <button class="btn blue" onclick="startFC(false)">ひとりで めくる</button>
      <div style="height:10px"></div>
      <button class="btn" onclick="startFC(true)" style="background:var(--y);box-shadow:0 5px 0 #e0a800;color:#3c3c3c">じどう（みんなで）</button>
    </div>
    <div class="card">
      <div class="icon">🦉</div>
      <h2>ききとり ゲーム</h2>
      <p>🔊を おして 音を聞き、あう絵を タップ！<br>4つずつ ぜんぶ むすべたら クリア。</p>
      <div class="opts" id="gmOpts">
        <button class="chip on" data-k="n" data-v="12">12もん</button>
        <button class="chip" data-k="n" data-v="20">20もん</button>
        <button class="chip" data-k="n" data-v="30">30もん（ぜんぶ）</button>
      </div>
      <button class="btn" onclick="startGame()">はじめる</button>
    </div>
  </div>
  <div class="note" id="assetNote"></div>
</section>

<!-- FLASHCARD -->
<section id="flash" class="screen">
  <div class="top"><button class="x" onclick="stopAuto();show('home')">✕</button><div class="bar"><i id="fcBar"></i></div><div class="count" id="fcCount"></div></div>
  <div class="fc-wrap">
    <div class="fc" id="fcCard" onclick="fcToggle()">
      <div class="pic" id="fcPic"></div>
      <div class="word" id="fcWord"></div>
      <div class="ja" id="fcJa"></div>
    </div>
    <div class="fc-ctrl">
      <button class="btn white" onclick="fcMove(-1)">◀ まえ</button>
      <button class="spk small" onclick="fcPlay()" title="もう一度"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1A9 9 0 0 0 14 3.2z"/></svg></button>
      <button class="btn white" onclick="fcMove(1)">つぎ ▶</button>
      <button class="btn blue" id="autoBtn" onclick="toggleAuto()">▶ じどう</button>
      <button class="btn white" onclick="shuffleFC()">🔀 まぜる</button>
    </div>
  </div>
</section>

<!-- GAME -->
<section id="game" class="screen">
  <div class="top"><button class="x" onclick="show('home')">✕</button><div class="bar"><i id="gmBar"></i></div><div class="streak" id="streak"></div></div>
  <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">
    <div class="q-title">音と絵を むすぼう</div>
    <div style="display:flex;gap:10px;align-items:center"><span class="setinfo" id="setInfo"></span><button class="slowbtn" id="slowBtn" onclick="toggleSlow()">🐢 ゆっくり</button></div>
  </div>
  <div class="howto">右の 🔊 をおして音を聞き、あう絵を 左の4まいから えらんでタップしよう。</div>
  <div class="match"><div class="col-a" id="colA"></div><div class="col-p" id="colP"></div></div>
  <div class="foot" id="foot"><div class="fb" id="fb"></div><button class="btn" id="mainBtn" style="visibility:hidden" onclick="nextSet()">つぎへ</button></div>
</section>

<!-- RESULT -->
<section id="result" class="screen result">
  <h1 id="rTitle">レッスン クリア！</h1>
  <div class="stats">
    <div class="stat"><div>1回で正解</div><div id="rScore"></div></div>
    <div class="stat"><div>れんぞく最高</div><div id="rBest"></div></div>
  </div>
  <div id="rMissWrap"><div style="font-weight:800;margin-bottom:6px">まちがえた ことば（タップで音）</div><div class="miss" id="rMiss"></div></div>
  <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center">
    <button class="btn white" onclick="show('home')">メニュー</button>
    <button class="btn" onclick="startGame()">もう一度</button>
  </div>
</section>

function crayonSVG(label){

  <path d="M60 175 L200 105 L235 150 L95 220 Z" fill="#fff"/><path d="M200 105 L262 112 L235 150"/><path d="M248 110 L262 112 L254 125" fill="#222"/>
  <path d="M85 162 L215 98"/><path d="M110 208 L240 144"/></g>
  <text x="150" y="275" text-anchor="middle" font-size="44" font-weight="800" fill="#222" font-family="sans-serif">${label}</text></svg>`;
}
function daySVG(label){
  return `<svg viewBox="0 0 300 300"><g fill="#fff" stroke="#222" stroke-width="5"><rect x="55" y="40" width="190" height="210" rx="14"/><line x1="55" y1="95" x2="245" y2="95"/></g>
  <circle cx="100" cy="40" r="9" fill="#222"/><circle cx="200" cy="40" r="9" fill="#222"/>
  <text x="150" y="190" text-anchor="middle" font-size="58" font-weight="800" fill="#222" font-family="sans-serif">${label}</text></svg>`;
}
function picHTML(w){
  if(w.cat==='色') return IMG.__crayon?`<div class="labwrap"><img alt="" src="${IMG.__crayon}"><div class="lab">${w.lab}</div></div>`:crayonSVG(w.lab);
  if(w.cat==='曜日') return IMG.__day?`<div class="labwrap day"><img alt="" src="${IMG.__day}"><div class="lab">${w.lab}</div></div>`:daySVG(w.lab);
  const src=IMG[w.img];
  if(src) return `<img alt="" src="${src}">`;
  return `<img alt="" src="images/${w.img}.png" onerror="this.outerHTML='<div class=ph><b>${w.ja}</b><small>（イラスト準備中）</small></div>'">`;
}

/* ---------- audio ---------- */
let curAudio=null;
function stopSound(){ if(curAudio){curAudio.pause();curAudio=null} if(window.speechSynthesis)speechSynthesis.cancel() }
function tts(text,rate){return new Promise(res=>{ if(!window.speechSynthesis){res();return}
  const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=rate;
  const v=speechSynthesis.getVoices().find(v=>/en[-_]US/i.test(v.lang))||speechSynthesis.getVoices().find(v=>/^en/i.test(v.lang)); if(v)u.voice=v;
  u.onend=res;u.onerror=res;speechSynthesis.speak(u);})}
function say(w,slow){ stopSound(); return new Promise(res=>{
  const src=AUD[w.audio]||`audio/${w.audio}.mp3`;
  const a=new Audio(src); a.playbackRate=slow?0.7:1; curAudio=a;
  a.onended=()=>res(); a.onerror=()=>{curAudio=null;tts(w.en,slow?0.55:0.85).then(res)};
  a.play().catch(()=>{ if(curAudio===a){curAudio=null;tts(w.en,slow?0.55:0.85).then(res)} });
});}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
let AC; function beep(ok){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime;
  (ok?[[660,0],[880,.09]]:[[220,0],[180,.12]]).forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=ok?'sine':'square';o.frequency.value=f;g.gain.setValueAtTime(.0001,t+d);g.gain.exponentialRampToValueAtTime(ok?.25:.08,t+d+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d+.18);o.connect(g).connect(AC.destination);o.start(t+d);o.stop(t+d+.2)})}catch(e){}}

document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{c.parentNode.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');OPT[c.dataset.k]=isNaN(c.dataset.v)?c.dataset.v:+c.dataset.v});

/* ---------- flashcards ---------- */
let fcList=[],fcI=0,fcShown=false,autoOn=false,autoTok=0;
function startFC(auto){fcList=WORDS.slice();fcI=0;show('flash');fcRender();if(auto)toggleAuto();else fcPlay()}
function shuffleFC(){fcList=shuffle(fcList);fcI=0;fcRender();if(!autoOn)fcPlay()}
function fcRender(){const w=fcList[fcI];$('fcPic').innerHTML=picHTML(w);fcShown=OPT.word==='show';
  $('fcWord').textContent=w.en;$('fcJa').textContent=w.ja;$('fcWord').classList.toggle('hide',!fcShown);$('fcJa').classList.toggle('hide',!fcShown);
  $('fcCount').textContent=`${fcI+1} / ${fcList.length}`;$('fcBar').style.width=((fcI+1)/fcList.length*100)+'%'}
function fcToggle(){fcShown=!fcShown;$('fcWord').classList.toggle('hide',!fcShown);$('fcJa').classList.toggle('hide',!fcShown);fcPlay()}
function fcMove(d){stopAuto();fcI=(fcI+d+fcList.length)%fcList.length;fcRender();fcPlay()}
function fcPlay(){return say(fcList[fcI])}
async function toggleAuto(){ if(autoOn){stopAuto();return}
  autoOn=true;const tok=++autoTok;$('autoBtn').classList.add('auto-on');$('autoBtn').textContent='⏸ とめる';
  while(autoOn&&tok===autoTok){
    await wait(700);
    for(let r=0;r<OPT.rep&&autoOn&&tok===autoTok;r++){await say(fcList[fcI]);await wait(1300)}
    if(!autoOn||tok!==autoTok)break;
    if(OPT.word==='hide'){fcShown=true;$('fcWord').classList.remove('hide');$('fcJa').classList.remove('hide');await wait(1600)}
    if(!autoOn||tok!==autoTok)break;
    if(fcI===fcList.length-1){stopAuto();break}
    fcI++;fcRender();
  }}
function stopAuto(){autoOn=false;autoTok++;stopSound();$('autoBtn').classList.remove('auto-on');$('autoBtn').textContent='▶ じどう'}

/* ---------- game (matching) ---------- */
let sets=[],si=0,total=0,firstOK=0,streak=0,best=0,missed=[],selA=null,selP=null,doneN=0,slow=false,busy=false,missedSet=new Set();
function toggleSlow(){slow=!slow;$('slowBtn').classList.toggle('on',slow)}
function conflict(a,b){return a.audio===b.audio||avoidSet(a).has(b.en)||avoidSet(b).has(a.en)}
function avoidSet(w){return new Set([w.en,...(w.avoid||'').split(/[,、]/).map(s=>s.replace(/（.*/,'').trim()).filter(Boolean)])}
function sizes(n){const k=Math.ceil(n/4);const base=Math.floor(n/k),r=n%k;return Array.from({length:k},(_,i)=>base+(i<r?1:0))}
function makeSets(n){
  for(let t=0;t<300;t++){const pool=shuffle(WORDS).slice(0,n);const out=[];let i=0,ok=true;
    for(const sz of sizes(n)){const g=pool.slice(i,i+sz);i+=sz;
      for(let x=0;x<g.length&&ok;x++)for(let y=x+1;y<g.length;y++)if(conflict(g[x],g[y])){ok=false;break}
      out.push(g)}
    if(ok)return out}
  const pool=shuffle(WORDS).slice(0,n),out=[];let i=0;for(const sz of sizes(n)){out.push(pool.slice(i,i+sz));i+=sz}return out}
function startGame(){stopAuto();total=OPT.n;sets=makeSets(total);si=0;firstOK=0;streak=0;best=0;missed=[];missedSet=new Set();doneN=0;show('game');renderSet()}
function renderSet(){const g=sets[si];selA=selP=null;busy=false;
  $('setInfo').textContent=`${si+1} / ${sets.length} セット`;$('foot').className='foot';$('fb').textContent='';$('mainBtn').style.visibility='hidden';
  const A=shuffle(g),P=shuffle(g);
  $('colA').style.setProperty('--n',g.length);$('colP').style.setProperty('--n',g.length);
  $('colA').innerHTML=A.map(w=>`<button class="tile a" data-en="${w.en}" onclick="tapA(this)"><span class="ic">${SPK}</span><span class="w"></span></button>`).join('');
  $('colP').innerHTML=P.map(w=>`<button class="tile p" data-en="${w.en}" onclick="tapP(this)"><div class="pic">${picHTML(w)}</div></button>`).join('');
  updBar()}
function W(en){return WORDS.find(w=>w.en===en)}
function updBar(){$('gmBar').style.width=(doneN/total*100)+'%';$('streak').textContent=streak>=2?`🔥${streak}`:''}
function tapA(el){if(busy||el.classList.contains('done'))return;document.querySelectorAll('.tile.a').forEach(t=>t.classList.remove('sel'));el.classList.add('sel');selA=el;say(W(el.dataset.en),slow);if(selP)judge()}
function tapP(el){if(busy||el.classList.contains('done'))return;document.querySelectorAll('.tile.p').forEach(t=>t.classList.remove('sel'));el.classList.add('sel');selP=el;if(selA)judge()}
function judge(){const a=selA,p=selP;selA=selP=null;
  if(a.dataset.en===p.dataset.en){
    a.classList.remove('sel');p.classList.remove('sel');a.classList.add('ok');p.classList.add('ok');beep(true);
    const en=a.dataset.en; if(!missedSet.has(en))firstOK++; streak++;best=Math.max(best,streak);doneN++;
    setTimeout(()=>{a.classList.remove('ok');p.classList.remove('ok');a.classList.add('done');p.classList.add('done');a.querySelector('.w').textContent=en;updBar();
      if(sets[si].every(w=>document.querySelector(`.tile.a[data-en="${CSS.escape(w.en)}"]`).classList.contains('done'))){
        $('foot').className='foot good';$('fb').textContent=['すばらしい！','ぜんぶ むすべた！','いいね！','やったね！'][Math.random()*4|0];
        $('mainBtn').textContent=si<sets.length-1?'つぎへ':'けっかを見る';$('mainBtn').style.visibility='visible'}},450);
  }else{
    busy=true;a.classList.remove('sel');p.classList.remove('sel');a.classList.add('ng');p.classList.add('ng');beep(false);streak=0;
    const en=a.dataset.en;if(!missedSet.has(en)){missedSet.add(en);missed.push(W(en))}
    setTimeout(()=>{a.classList.remove('ng');p.classList.remove('ng');busy=false;updBar()},650)}
}
function nextSet(){stopSound();si++;if(si<sets.length)renderSet();else finish()}
function finish(){$('gmBar').style.width='100%';show('result');
  $('rScore').textContent=`${firstOK} / ${total}`;$('rBest').textContent=best;
  $('rTitle').textContent=firstOK===total?'パーフェクト！🎉':'レッスン クリア！';
  $('rMissWrap').style.display=missed.length?'':'none';
  $('rMiss').innerHTML=missed.map((w,i)=>`<div class="ch" onclick="say(missed[${i}])"><div class="pic">${picHTML(w)}</div><div class="w">${w.en}</div></div>`).join('');
  if(firstOK===total)beep(true);}
document.addEventListener('keydown',e=>{if($('game').classList.contains('on')&&e.key==='Enter'&&$('mainBtn').style.visibility==='visible')nextSet()});

/* asset note */
(function(){const noImg=WORDS.filter(w=>w.cat!=='色'&&w.cat!=='曜日'&&!IMG[w.img]).length,noAud=WORDS.filter(w=>!AUD[w.audio]).length;
 const m=[];if(noAud)m.push(`音声 ${noAud}語：ファイルがないときは ブラウザの読み上げ`);if(noImg)m.push(`イラスト ${noImg}語：準備中`);$('assetNote').textContent=m.join(' ／ ');})();
if(window.speechSynthesis)speechSynthesis.getVoices();
</script>
