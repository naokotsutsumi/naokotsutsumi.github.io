<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>食べ物たんごミニテスト3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Yusei+Magic&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFF8ED;
    --ink:#3A3530;
    --teal:#2A9D8F;
    --teal-dark:#1F7A6F;
    --coral:#E76F51;
    --coral-dark:#C1543A;
    --gold:#E9C46A;
    --gold-dark:#C79A3E;
    --card:#FFFFFF;
    --border:#EFE6D4;
    --wrong:#E15B4C;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 10% 6%, #FDEBD3 0%, transparent 42%),
      radial-gradient(circle at 92% 94%, #E4F3EE 0%, transparent 46%),
      var(--bg);
    font-family:'Noto Sans JP', sans-serif;
    color:var(--ink);
    padding:24px 14px 70px;
  }
  h1{
    font-family:'Yusei Magic', sans-serif;
    text-align:center;
    font-size:clamp(20px,5vw,28px);
    margin:0 0 6px;
  }
  .subtitle{
    text-align:center;
    color:#8A8074;
    font-size:14px;
    margin-bottom:18px;
  }
  #scoreResult{
    max-width:640px;
    margin:0 auto 20px;
    text-align:center;
    font-family:'Yusei Magic', sans-serif;
    font-size:17px;
    min-height:24px;
    color:var(--teal-dark);
  }
  .quiz-list{
    max-width:640px;
    margin:0 auto;
    display:flex;
    flex-direction:column;
    gap:22px;
  }
  .question{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    padding:18px 16px 20px;
    box-shadow:0 6px 18px rgba(58,53,48,0.06);
  }
  .q-head{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:14px;
  }
  .q-num{
    font-family:'Yusei Magic', sans-serif;
    background:var(--gold);
    color:#3A3530;
    width:30px;height:30px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:14px;
    flex-shrink:0;
  }
  .play-btn{
    background:var(--teal);
    color:#fff;
    border:none;
    border-radius:12px;
    padding:10px 18px;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:6px;
    box-shadow:0 3px 0 rgba(0,0,0,0.12);
  }
  .play-btn:active{transform:translateY(2px); box-shadow:0 1px 0 rgba(0,0,0,0.12);}
  .play-btn svg{width:16px;height:16px;}

  .choices{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(96px, 1fr));
    gap:10px;
  }
  .choice{
    border:3px solid var(--border);
    border-radius:14px;
    background:#FFFDF8;
    padding:8px;
    cursor:pointer;
    transition:border-color .12s ease, transform .08s ease;
  }
  .choice:active{transform:scale(0.97);}
  .choice img{
    width:100%;
    height:auto;
    display:block;
    pointer-events:none;
  }
  .choice.selected{
    border-color:var(--teal);
    background:#EAF6F3;
  }
  .choice.wrong{
    border-color:var(--wrong);
    background:#FDEDEB;
  }

  .grade-row{
    max-width:640px;
    margin:26px auto 0;
    display:flex;
    justify-content:center;
  }
  #gradeBtn{
    background:var(--coral);
    color:#fff;
    border:none;
    border-radius:16px;
    padding:16px 40px;
    font-size:17px;
    font-weight:700;
    font-family:'Noto Sans JP', sans-serif;
    cursor:pointer;
    box-shadow:0 4px 0 rgba(0,0,0,0.15);
  }
  #gradeBtn:active{transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,0.15);}
</style>
</head>

  <div id="scoreResult"></div>

  <div class="quiz-list" id="quizList"></div>

  const quizList = document.getElementById('quizList');
  const scoreResult = document.getElementById('scoreResult');
  const gradeBtn = document.getElementById('gradeBtn');

  const selections = {};
  const audioEls = {};
  let activeAudioTimeouts = [];

  function stopAllAudio(){
    activeAudioTimeouts.forEach(t => clearTimeout(t));
    activeAudioTimeouts = [];
    Object.values(audioEls).forEach(a => { a.pause(); a.currentTime = 0; a.onended = null; });
  }

  function playTwice(key){
    stopAllAudio();
    const a = audioEls[key];
    a.currentTime = 0;
    a.play();
    a.onended = () => {
      a.onended = null;
      const t = setTimeout(() => {
        a.currentTime = 0;
        a.play();
      }, 500);
      activeAudioTimeouts.push(t);
    };
  }

  QUESTIONS.forEach((q, qi) => {
    const qDiv = document.createElement('div');
    qDiv.className = 'question';

    const head = document.createElement('div');
    head.className = 'q-head';

    const num = document.createElement('div');
    num.className = 'q-num';
    num.textContent = (qi + 1);
    head.appendChild(num);

    const playBtn = document.createElement('button');
    playBtn.className = 'play-btn';
    playBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8.5a6.5 6.5 0 1 1 13 0c0 6-6 6-6 10a3.5 3.5 0 1 1-7 0"/><path d="M15 8.5a2.5 2.5 0 0 0-5 0v1a2 2 0 1 1 0 4"/></svg> きく';
    playBtn.onclick = () => playLine(q.key);
    head.appendChild(playBtn);

    qDiv.appendChild(head);

    const choicesDiv = document.createElement('div');
    choicesDiv.className = 'choices';

    q.choices.forEach(choiceKey => {
      const cDiv = document.createElement('div');
      cDiv.className = 'choice';
      const img = document.createElement('img');
      img.src = IMG_SRC[choiceKey];
      img.alt = '';
      cDiv.appendChild(img);
      cDiv.onclick = () => selectChoice(qi, choiceKey, cDiv);
      choicesDiv.appendChild(cDiv);
    });

    qDiv.appendChild(choicesDiv);
    quizList.appendChild(qDiv);

    const audioEl = document.createElement('audio');
    audioEl.src = AUD_SRC[q.key];
    audioEls[q.key] = audioEl;
    qDiv.appendChild(audioEl);
  });

  function playLine(key){
    playTwice(key);
  }

  function selectChoice(qIndex, choiceKey, el){
    selections[qIndex] = choiceKey;
    const parent = el.parentElement;
    Array.from(parent.children).forEach(c => c.classList.remove('selected', 'wrong'));
    el.classList.add('selected');
  }

  gradeBtn.addEventListener('click', () => {
    stopAllAudio();
    let correctCount = 0;
    QUESTIONS.forEach((q, qi) => {
      const qDiv = quizList.children[qi];
      const choicesDiv = qDiv.querySelector('.choices');
      const selected = selections[qi];
      Array.from(choicesDiv.children).forEach(c => c.classList.remove('wrong'));
      if (selected === q.key) {
        correctCount++;
      } else {
        Array.from(choicesDiv.children).forEach((c, ci) => {
          if (q.choices[ci] === selected) {
            c.classList.add('wrong');
          }
        });
      }
    });

    const total = QUESTIONS.length;
    if (correctCount === total) {
      scoreResult.textContent = `${correctCount} / ${total}問正解！ 全問正解だよ。正しくおぼえたね`;
    } else {
      scoreResult.textContent = `${correctCount} / ${total}問正解。まちがえた問題をもう一度聞き直し、とき直そう`;
    }
    gradeBtn.textContent = 'もう一度 採点する';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
</script>
