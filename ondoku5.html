<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>音読練習アプリ(5年生)</title>
<style>
  :root{
    --green:#7cb342;
    --green-dark:#5a8f2d;
    --green-light:#c5e1a5;
    --red:#e53935;
    --red-dark:#c62828;
    --accent:#33691e;
    --ink:#2b2b2b;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:"Hiragino Maru Gothic ProN","Yu Gothic",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:linear-gradient(160deg,#9ccc65 0%, #7cb342 55%, #689f38 100%);
    min-height:100vh;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .app{
    max-width:900px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding:24px 20px 40px;
  }

  /* ---------- Opening page ---------- */
  .opening h1{
    color:#fff;
    text-align:center;
    font-size:clamp(24px,5vw,34px);
    margin:12px 0 4px;
    text-shadow:0 2px 0 rgba(0,0,0,0.15);
  }
  .opening p.sub{
    color:#f3fbe7;
    text-align:center;
    margin:0 0 28px;
    font-size:15px;
  }
  .unit-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
    gap:18px;
  }
  .unit-card{
    background:#fff;
    border-radius:18px;
    padding:20px 18px;
    text-align:left;
    cursor:pointer;
    border:none;
    box-shadow:0 6px 0 rgba(0,0,0,0.15);
    transition:transform .08s ease;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .unit-card:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,0.15);}
  .unit-card .num{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:40px;height:40px;
    border-radius:50%;
    background:var(--green);
    color:#fff;
    font-weight:bold;
    font-size:18px;
  }
  .unit-card .name{font-size:19px;font-weight:bold;color:var(--ink);}
  .unit-card .topic{font-size:13px;color:#666;}

  /* ---------- Unit practice page ---------- */
  .unit-page{display:none;}
  .unit-page.active{display:block;}
  .opening{display:none;}
  .opening.first{display:block;}

  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:14px;
  }
  .back-btn{
    background:rgba(255,255,255,0.92);
    border:none;
    border-radius:12px;
    padding:8px 16px;
    font-size:14px;
    font-weight:bold;
    color:var(--green-dark);
    cursor:pointer;
  }
  .unit-pill{
    background:#fff;
    border-radius:20px;
    padding:6px 18px;
    font-weight:bold;
    color:var(--green-dark);
    font-size:14px;
  }

  .card-title-row{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:10px;
    margin:6px 0 16px;
  }
  .card-title-row h2{
    color:#fff;
    font-size:clamp(18px,4vw,24px);
    margin:0;
    line-height:1.4;
    text-shadow:0 2px 0 rgba(0,0,0,0.15);
  }
  .unit-topic{
    font-size:clamp(13px,2.6vw,16px);
    font-weight:normal;
    color:#f3fbe7;
  }
  .step-badge{
    display:inline-flex;
    align-items:center;
    gap:5px;
    background:rgba(255,255,255,0.2);
    border-radius:16px;
    padding:4px 10px 4px 4px;
    color:#fff;
    font-size:13px;
    font-weight:bold;
  }
  .step-badge .circ{
    width:20px;height:20px;
    border-radius:50%;
    background:var(--accent);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
  }

  .practice-card{
    background:#fff;
    border-radius:14px;
    padding:8px 4px;
    box-shadow:0 8px 0 rgba(0,0,0,0.15);
  }
  .line-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px 18px;
    border-bottom:2px solid #eef7e4;
  }
  .line-row:last-child{border-bottom:none;}
  .avatar{
    width:38px;height:38px;
    border-radius:50%;
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  .avatar.spacer{visibility:hidden;}
  .play-btn{
    width:42px;height:42px;
    border-radius:50%;
    background:var(--red);
    border:none;
    flex:0 0 auto;
    color:#fff;
    font-size:16px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 3px 0 var(--red-dark);
    transition:transform .06s;
  }
  .play-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--red-dark);}
  .play-btn.playing{background:var(--green-dark);box-shadow:0 3px 0 #33691e;}
  .line-text{
    font-size:clamp(17px,3.4vw,23px);
    line-height:1.3;
    color:#333;
  }

  .record-section{
    margin-top:22px;
    background:rgba(255,255,255,0.16);
    border-radius:16px;
    padding:18px 16px;
    text-align:center;
  }
  .record-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:16px;
    flex-wrap:wrap;
  }
  .rec-btn{
    width:56px;height:56px;
    border-radius:50%;
    background:var(--red);
    border:4px solid #fff;
    cursor:pointer;
    box-shadow:0 4px 0 var(--red-dark);
  }
  .rec-btn.recording{
    background:#b71c1c;
    animation:pulse 1.1s infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(255,255,255,0.5);}
    70%{box-shadow:0 0 0 14px rgba(255,255,255,0);}
    100%{box-shadow:0 0 0 0 rgba(255,255,255,0);}
  }
  .rec-status{color:#fff;font-weight:bold;font-size:14px;min-width:110px;}
  .rec-timer{color:#fff;font-variant-numeric:tabular-nums;font-size:14px;}
  .rec-result{margin-top:14px;display:none;}
  .rec-result.show{display:block;}
  .rec-result audio{width:100%;max-width:420px;}
  .dl-btn{
    display:inline-block;
    margin-top:10px;
    background:#fff;
    color:var(--green-dark);
    font-weight:bold;
    text-decoration:none;
    padding:10px 20px;
    border-radius:20px;
    font-size:14px;
  }
  .submit-note{
    color:#fff;
    font-size:13px;
    margin-top:12px;
    line-height:1.6;
  }
  .rec-error{
    color:#fff2f2;
    background:rgba(0,0,0,0.25);
    border-radius:10px;
    padding:8px 12px;
    font-size:12px;
    margin-top:10px;
    display:none;
  }
  .rec-error.show{display:block;}

  .unit-nav{
    display:flex;
    justify-content:space-between;
    margin-top:18px;
    gap:10px;
  }
  .nav-btn{
    background:rgba(255,255,255,0.92);
    border:none;
    border-radius:12px;
    padding:10px 18px;
    font-weight:bold;
    color:var(--green-dark);
    cursor:pointer;
    font-size:14px;
  }
  .nav-btn:disabled{opacity:0.4;cursor:default;}
</style>
</head>
<body>
<div class="app" id="app">

  <section class="opening first" id="opening-page">
    <h1>音読練習アプリ(5年生)</h1>
    <p class="sub">Unitをえらんで「①聞く → ②読む → ③録音する」の順に練習しよう</p>
    <div class="unit-grid" id="unit-grid"></div>
  </section>

  <!-- ================= Unit Pages (generated by JS) ================= -->
  <div id="unit-pages"></div>

</div>

/* ============ 2. Avatar SVGs (generic, not copyrighted photos) ============ */
const AVATAR_TEACHER = `<svg viewBox="0 0 40 40" width="38" height="38"><circle cx="20" cy="20" r="20" fill="#4a6fa5"/><circle cx="20" cy="15" r="7" fill="#f2c9a0"/><path d="M6 36c1-8 7-12 14-12s13 4 14 12" fill="#2e4a73"/></svg>`;
const AVATAR_GIRL = `<svg viewBox="0 0 40 40" width="38" height="38"><circle cx="20" cy="20" r="20" fill="#e86ea0"/><circle cx="20" cy="15" r="7" fill="#f7d9b8"/><path d="M6 36c1-8 7-12 14-12s13 4 14 12" fill="#c14d80"/></svg>`;
const AVATAR_BOY = `<svg viewBox="0 0 40 40" width="38" height="38"><circle cx="20" cy="20" r="20" fill="#3d9970"/><circle cx="20" cy="15" r="7" fill="#f2c9a0"/><path d="M6 36c1-8 7-12 14-12s13 4 14 12" fill="#276749"/></svg>`;

function avatarFor(speaker){
  if(speaker==='teacher') return AVATAR_TEACHER;
  if(speaker==='boy') return AVATAR_BOY;
  if(speaker==='girl') return AVATAR_GIRL;
  return '';
}

/* ============ 3. Build opening page ============ */
const unitGrid = document.getElementById('unit-grid');
UNITS.forEach(u=>{
  const btn = document.createElement('button');
  btn.className = 'unit-card';
  btn.innerHTML = `
    <span class="num">${u.id}</span>
    <span class="name">Unit ${u.id}</span>
    <span class="topic">${u.topic}</span>
  `;
  btn.addEventListener('click', ()=>showUnit(u.id));
  unitGrid.appendChild(btn);
});

/* ============ 4. Build unit pages ============ */
function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

const unitPagesRoot = document.getElementById('unit-pages');
UNITS.forEach(u=>{
  const page = document.createElement('section');
  page.className = 'unit-page';
  page.id = 'unit-page-'+u.id;

  const linesHtml = u.lines.map((line, idx)=>{
    let avatarHtml = '<span class="avatar spacer"></span>';
    if(line.speaker && !line.hideIcon){
      avatarHtml = `<span class="avatar">${avatarFor(line.speaker)}</span>`;
    }
    return `
      <div class="line-row">
        ${avatarHtml}
        <button class="play-btn" data-unit="${u.id}" data-idx="${idx}" aria-label="再生">▶</button>
        <span class="line-text">${escapeHtml(line.text)}</span>
      </div>
    `;
  }).join('');

  page.innerHTML = `
    <div class="topbar">
      <button class="back-btn" onclick="showOpening()">← Unit一覧へ</button>
      <span class="unit-pill">Unit ${u.id} / 8</span>
    </div>
    <div class="card-title-row">
      <h2>音読練習カード Unit ${u.id}<br><span class="unit-topic">${escapeHtml(u.topic)}</span></h2>
      <span class="step-badge"><span class="circ">1</span>聞く</span>
      <span class="step-badge"><span class="circ">2</span>読む</span>
      <span class="step-badge"><span class="circ">3</span>録音する</span>
    </div>
    <div class="practice-card">
      ${linesHtml}
    </div>

    <div class="record-section">
      <div class="record-row">
        <button class="rec-btn" id="rec-btn-${u.id}" aria-label="録音"></button>
        <span class="rec-status" id="rec-status-${u.id}">タップして録音開始</span>
        <span class="rec-timer" id="rec-timer-${u.id}">00:00</span>
      </div>
      <div class="rec-error" id="rec-error-${u.id}"></div>
      <div class="rec-result" id="rec-result-${u.id}">
        <audio controls id="rec-audio-${u.id}"></audio><br>
        <a class="dl-btn" id="rec-dl-${u.id}" download>録音ファイルをダウンロード</a>
      </div>
      <div class="submit-note">録音したファイルをダウンロードして、ロイロノートで提出しよう</div>
    </div>

    <div class="unit-nav">
      <button class="nav-btn" id="prev-btn-${u.id}" onclick="gotoUnit(${u.id-1})" ${u.id===1?'disabled':''}>← Unit ${u.id-1}</button>
      <button class="nav-btn" id="next-btn-${u.id}" onclick="gotoUnit(${u.id+1})" ${u.id===8?'disabled':''}>Unit ${u.id+1} →</button>
    </div>
  `;
  unitPagesRoot.appendChild(page);
});

/* ============ 5. Navigation ============ */
function showOpening(){
  document.getElementById('opening-page').style.display='block';
  document.querySelectorAll('.unit-page').forEach(p=>p.classList.remove('active'));
  window.scrollTo(0,0);
}
function showUnit(id){
  document.getElementById('opening-page').style.display='none';
  document.querySelectorAll('.unit-page').forEach(p=>p.classList.remove('active'));
  document.getElementById('unit-page-'+id).classList.add('active');
  window.scrollTo(0,0);
}
function gotoUnit(id){
  if(id<1||id>8) return;
  showUnit(id);
}
document.getElementById('opening-page').style.display='block';

/* ============ 6. Audio playback (mac audio if available, else speech synthesis) ============ */
let currentAudioEl = null;
let currentUtterance = null;

function stopAllAudio(){
  if(currentAudioEl){ currentAudioEl.pause(); currentAudioEl.currentTime=0; currentAudioEl=null; }
  if(window.speechSynthesis){ window.speechSynthesis.cancel(); }
  document.querySelectorAll('.play-btn.playing').forEach(b=>b.classList.remove('playing'));
}

function pickEnglishVoice(){
  const voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
  return voices.find(v=>v.lang && v.lang.toLowerCase().startsWith('en')) || voices[0] || null;
}

let isPlayingAudio = false;

if(!window.__onyokuPlayClickBound){
  window.__onyokuPlayClickBound = true;
  document.addEventListener('click', (e)=>{
    const btn = e.target.closest('.play-btn');
    if(!btn) return;
    if(isPlayingAudio) return; // ignore rapid double-fire / double clicks
    isPlayingAudio = true;

    const unitId = btn.dataset.unit;
    const idx = btn.dataset.idx;
    const key = unitId+'_'+idx;
    const unit = UNITS.find(u=>String(u.id)===String(unitId));
    const line = unit.lines[idx];

    stopAllAudio();
    btn.classList.add('playing');

    const finish = ()=>{ btn.classList.remove('playing'); isPlayingAudio = false; };

    if(AUDIO_SRC[key]){
      const audio = new Audio(AUDIO_SRC[key]);
      currentAudioEl = audio;
      let started = false;
      let fallbackDone = false;
      const doFallback = ()=>{
        if(started || fallbackDone) return;
        fallbackDone = true;
        speakFallback(line.text, btn, finish);
      };
      audio.addEventListener('playing', ()=>{ started = true; });
      audio.onended = ()=>{ if(!fallbackDone) finish(); };
      audio.onerror = doFallback;
      audio.play().catch(doFallback);
    } else {
      speakFallback(line.text, btn, finish);
    }
  });
}

function speakFallback(text, btn, finish){
  const done = finish || (()=>{ btn.classList.remove('playing'); isPlayingAudio = false; });
  if(!window.speechSynthesis){
    done();
    alert('この端末は音声読み上げに対応していません。');
    return;
  }
  const utt = new SpeechSynthesisUtterance(text);
  utt.lang = 'en-US';
  utt.rate = 0.88;
  const v = pickEnglishVoice();
  if(v) utt.voice = v;
  utt.onend = done;
  utt.onerror = done;
  currentUtterance = utt;
  window.speechSynthesis.speak(utt);
}
if(window.speechSynthesis){
  window.speechSynthesis.onvoiceschanged = ()=>{};
}

/* ============ 7. Recording ============ */
const recorders = {}; // unitId -> {mediaRecorder, chunks, stream, timerInterval, startTime}

async function toggleRecording(unitId){
  const btn = document.getElementById('rec-btn-'+unitId);
  const status = document.getElementById('rec-status-'+unitId);
  const errorBox = document.getElementById('rec-error-'+unitId);
  errorBox.classList.remove('show');

  if(btn.classList.contains('recording')){
    const rec = recorders[unitId];
    if(rec && rec.mediaRecorder && rec.mediaRecorder.state !== 'inactive'){
      rec.mediaRecorder.stop();
    }
    return;
  }

  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    let mimeType = '';
    const candidates = ['audio/mp4','audio/webm;codecs=opus','audio/webm','audio/ogg'];
    for(const c of candidates){
      if(window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(c)){ mimeType = c; break; }
    }
    const mediaRecorder = mimeType ? new MediaRecorder(stream,{mimeType}) : new MediaRecorder(stream);
    const chunks = [];
    mediaRecorder.ondataavailable = e=>{ if(e.data.size>0) chunks.push(e.data); };
    mediaRecorder.onstop = ()=>{
      const blob = new Blob(chunks, {type: mimeType || 'audio/webm'});
      const url = URL.createObjectURL(blob);
      const audioEl = document.getElementById('rec-audio-'+unitId);
      audioEl.src = url;
      const ext = mimeType.includes('mp4') ? 'm4a' : (mimeType.includes('ogg') ? 'ogg' : 'webm');
      const dl = document.getElementById('rec-dl-'+unitId);
      dl.href = url;
      dl.download = `Unit${unitId}_onyoku.${ext}`;
      document.getElementById('rec-result-'+unitId).classList.add('show');
      stream.getTracks().forEach(t=>t.stop());
      clearInterval(recorders[unitId].timerInterval);
      btn.classList.remove('recording');
      status.textContent = '録音完了!下のボタンから保存しよう';
    };
    mediaRecorder.start();
    const startTime = Date.now();
    const timerEl = document.getElementById('rec-timer-'+unitId);
    const timerInterval = setInterval(()=>{
      const sec = Math.floor((Date.now()-startTime)/1000);
      const mm = String(Math.floor(sec/60)).padStart(2,'0');
      const ss = String(sec%60).padStart(2,'0');
      timerEl.textContent = `${mm}:${ss}`;
    },250);

    recorders[unitId] = {mediaRecorder, chunks, stream, timerInterval, startTime};
    btn.classList.add('recording');
    status.textContent = '録音中… もう一度タップで停止';
  }catch(err){
    errorBox.textContent = 'マイクを使用できませんでした。ブラウザのマイク許可設定をご確認ください。('+(err && err.message ? err.message : err)+')';
    errorBox.classList.add('show');
  }
}

document.addEventListener('click', (e)=>{
  const btn = e.target.closest('.rec-btn');
  if(!btn) return;
  const unitId = btn.id.replace('rec-btn-','');
  toggleRecording(unitId);
});
</script>
