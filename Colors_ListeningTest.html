<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>色（いろ）単語ミニテスト</title>
<style>
:root {
  --blue:#4a90d9; --blue-dark:#2f6bb0; --yellow:#ffcb3d; --green:#5cb85c;
  --red:#e05c5c; --bg:#fef8ec; --card:#ffffff; --gray:#888;
}
* { box-sizing: border-box; }
body {
  font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
  background: var(--bg);
  margin: 0;
  color: #333;
}
header {
  background: linear-gradient(135deg, var(--blue), var(--blue-dark));
  color: white;
  text-align: center;
  padding: 24px 12px 20px;
}
header h1 { margin: 0 0 6px; font-size: 1.6em; }
header p { margin: 0; opacity: 0.9; font-size: 0.95em; }
#score-summary {
  position: sticky; top: 0; z-index: 10;
  background: var(--yellow);
  text-align: center;
  padding: 10px;
  font-weight: bold;
  font-size: 1.1em;
  box-shadow: 0 2px 6px rgba(0,0,0,0.15);
}
.container { max-width: 640px; margin: 0 auto; padding: 16px; }
.question {
  background: var(--card);
  border-radius: 14px;
  padding: 18px;
  margin-bottom: 18px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}
.qnum {
  display: inline-block;
  background: var(--blue);
  color: white;
  padding: 6px 16px;
  border-radius: 999px;
  font-weight: bold;
  font-size: 0.95em;
}
h2 { margin: 0 0 12px; }
.play-btn {
  display: block;
  width: 100%;
  background: var(--green);
  color: white;
  border: none;
  border-radius: 10px;
  padding: 12px;
  font-size: 1.05em;
  font-weight: bold;
  cursor: pointer;
  margin-bottom: 14px;
}
.play-btn:active { opacity: 0.8; }
.choices {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 10px;
}
.choice-btn {
  border: 3px solid #ddd;
  background: white;
  border-radius: 12px;
  padding: 8px;
  cursor: pointer;
  transition: border-color 0.15s;
}
.img-wrap { position: relative; }
.img-wrap img { width: 100%; height: auto; border-radius: 8px; display: block; }
.jp-label {
  position: absolute;
  top: 2px;
  right: 4px;
  font-weight: bold;
  font-size: 1.1em;
  color: #222;
  background: rgba(255,255,255,0.75);
  padding: 0 4px;
  border-radius: 4px;
  line-height: 1.3;
}
.choice-btn.selected { border-color: var(--blue); background: #eaf2fc; }
.choice-btn.correct { border-color: var(--green); background: #eafaea; }
.choice-btn.wrong { border-color: var(--red); background: #fbeaea; }
#grade-area { text-align: center; margin: 24px 0; }
#grade-btn {
  background: var(--blue-dark);
  color: white;
  border: none;
  border-radius: 999px;
  padding: 16px 40px;
  font-size: 1.15em;
  font-weight: bold;
  cursor: pointer;
}
#results { display: none; text-align: center; padding: 16px; font-size: 1.2em; font-weight: bold; }
</style>
</head>

document.querySelectorAll("img[data-imgkey]").forEach(img => {
  const key = img.getAttribute("data-imgkey");
  img.src = IMG[key];
});

document.querySelectorAll(".choices").forEach(group => {
  group.querySelectorAll(".choice-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      group.querySelectorAll(".choice-btn").forEach(b => {
        b.classList.remove("selected","correct","wrong");
      });
      btn.classList.add("selected");
      group.setAttribute("data-selected", btn.getAttribute("data-value"));
    });
  });
});

document.querySelectorAll(".play-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    const word = btn.getAttribute("data-word");
    const src = AUDIO[word];
    if (!src) return;
    const audio = new Audio(src);
    audio.play();
    audio.addEventListener("ended", () => {
      setTimeout(() => { audio.currentTime = 0; audio.play(); }, 500);
    }, { once: true });
  });
});

function gradeTest() {
  let correct = 0;
  let total = 0;
  document.querySelectorAll(".choices").forEach(group => {
    total++;
    const answer = group.getAttribute("data-answer");
    const sel = group.getAttribute("data-selected");
    group.querySelectorAll(".choice-btn").forEach(b => {
      b.classList.remove("correct","wrong");
      const val = b.getAttribute("data-value");
      if (val === answer) b.classList.add("correct");
      else if (val === sel && sel !== answer) b.classList.add("wrong");
    });
    if (sel === answer) correct++;
  });
  const pct = Math.round((correct/total)*100);
  document.getElementById("results").style.display = "block";
  document.getElementById("result-score").textContent = correct + " / " + total + " 問正解 (" + pct + "点)";
  document.getElementById("score-summary").textContent = correct + " / " + total + " 問正解 (" + pct + "点)";
  document.getElementById("grade-btn").textContent = "もう一度 採点する";
  window.scrollTo({top:0, behavior:"smooth"});
}
</script>
