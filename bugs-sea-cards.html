<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>虫と海の生き物カード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
/* Layout: one big card in the middle (picture over word), controls under it, a strip of all 22 animals to jump to. */
:root{
  --bg:#e9efe6;        /* pale grass */
  --panel:#ffffff;
  --ink:#1d2a24;
  --muted:#5d6e66;
  --line:#cfd9cf;
  --leaf:#2f7a5d;      /* accent: leaf green */
  --leaf-ink:#ffffff;
  --sun:#f3b52f;       /* speaker button */
  --sun-ink:#3a2a00;
  --chip:#dde7dc;
  --word:"Andika", "Comic Sans MS", "Segoe Print", system-ui, sans-serif;
  --ui:"M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Meiryo", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141c18;--panel:#1f2a25;--ink:#eef4ef;--muted:#a7b8af;--line:#33443c;
  --leaf:#5fbf97;--leaf-ink:#0c1a14;--sun:#f3b52f;--sun-ink:#2b1f00;--chip:#27352f;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141c18;--panel:#1f2a25;--ink:#eef4ef;--muted:#a7b8af;--line:#33443c;
  --leaf:#5fbf97;--leaf-ink:#0c1a14;--sun:#f3b52f;--sun-ink:#2b1f00;--chip:#27352f;color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 28px}
.wrap{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
h1{font-size:1.35rem;font-weight:800;margin:0;letter-spacing:.02em}
h1 small{font-size:.8rem;color:var(--muted);font-weight:500;margin-left:.4em}
.modes{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-weight:500;font-size:.9rem;border:2px solid transparent;background:var(--chip);color:var(--ink);
  padding:7px 13px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--leaf);color:var(--leaf-ink)}
.chip:focus-visible,.btn:focus-visible,.thumb:focus-visible,.card:focus-visible{outline:3px solid var(--sun);outline-offset:3px}

.card{background:var(--panel);border-radius:22px;box-shadow:0 2px 0 var(--line),0 10px 30px rgba(20,50,35,.10);
  display:flex;flex-direction:column;align-items:center;gap:4px;padding:18px 16px 10px;cursor:pointer;user-select:none;
  touch-action:pan-y;position:relative;min-height:0}
.pic{width:min(52vh,100%,470px);aspect-ratio:1;max-width:100%;border-radius:14px;background:#fff;overflow:hidden;position:relative}
.pic img{width:100%;height:100%;display:block;object-fit:contain}
.word{font-family:var(--word);font-weight:400;line-height:1.15;font-size:clamp(3.6rem,15vw,9.5rem);
  letter-spacing:.01em;white-space:nowrap;text-align:center;max-width:100%;padding-bottom:.08em}
.cover{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;border-radius:inherit;
  background:repeating-linear-gradient(135deg,var(--chip) 0 14px,var(--panel) 14px 28px);color:var(--muted);
  font-size:1.05rem;font-weight:800;text-align:center;padding:10px}
.wordbox{position:relative;width:100%;display:flex;justify-content:center;min-height:1.2em;font-size:clamp(3.6rem,15vw,9.5rem)}
.wordbox .cover{font-family:var(--ui);font-size:1.05rem;border-radius:14px}
.hint{font-size:.8rem;color:var(--muted);min-height:1.2em}

.controls{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px}
.btn{font:inherit;border:0;cursor:pointer;border-radius:16px;font-weight:800}
.nav{background:var(--panel);color:var(--ink);width:72px;height:64px;font-size:1.8rem;box-shadow:0 2px 0 var(--line)}
.mid{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap}
.speak{background:var(--sun);color:var(--sun-ink);height:64px;padding:0 26px;font-size:1.15rem;display:flex;align-items:center;gap:10px;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.speak svg{width:28px;height:28px}
.count{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:800;min-width:4.5em;text-align:center}

.opts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
.opts .chip{font-size:.85rem}

.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.thumb{background:var(--panel);border:2px solid transparent;border-radius:12px;padding:4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink);font:inherit}
.thumb img{width:100%;aspect-ratio:1;object-fit:contain;background:#fff;border-radius:8px}
.thumb span{font-family:var(--word);font-size:.95rem}
.thumb[aria-current="true"]{border-color:var(--leaf)}
.note{font-size:.78rem;color:var(--muted);text-align:center}
@media (max-width:520px){.nav{width:56px;height:56px}.speak{height:56px;padding:0 18px}.speak span{display:none}}
@media (prefers-reduced-motion:no-preference){.card.flip{animation:pop .22s ease-out}@keyframes pop{from{transform:scale(.97);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>虫と海の生き物カード<small>bugs &amp; sea animals</small></h1>
    <div class="modes" role="group" aria-label="カードの見せ方">
      <button class="chip" id="m-both" aria-pressed="true" data-mode="both">絵と文字</button>
      <button class="chip" id="m-pic" aria-pressed="false" data-mode="pic">絵だけ</button>
      <button class="chip" id="m-word" aria-pressed="false" data-mode="word">文字だけ</button>
    </div>
  </header>

  <div class="card" id="card" tabindex="0" aria-live="polite">
    <div class="pic" id="pic"><img id="img" alt=""><div class="cover" id="picCover" hidden>タップで絵を見る</div></div>
    <div class="wordbox"><div class="word" id="word"></div><div class="cover" id="wordCover" hidden>タップでこたえ</div></div>
    <div class="hint" id="hint">カードをタップすると、もういちど聞けます</div>
  </div>

  <div class="controls">
    <button class="btn nav" id="prev" aria-label="前のカード">◀</button>
    <div class="mid">
      <button class="btn speak" id="speak" aria-label="発音を聞く">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M19 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>きく</span></button>
      <div class="count" id="count">1 / 22</div>
    </div>
    <button class="btn nav" id="next" aria-label="次のカード">▶</button>
  </div>

  <div class="opts">
    <button class="chip" id="o-auto" aria-pressed="true">めくったら読む</button>
    <button class="chip" id="o-slow" aria-pressed="false">ゆっくり</button>
    <button class="chip" id="o-shuffle" aria-pressed="false">シャッフル</button>
    <button class="chip" id="o-play" aria-pressed="false">じどうでめくる</button>
  </div>

  <div class="strip" id="strip" aria-label="ぜんぶのカード"></div>
  <p class="note" id="note">音声はブラウザの読み上げを使っています。←→キーでめくる、スペースで聞く。</p>
</div>

let order = DATA.map((_, i) => i), pos = 0, mode = "both", revealed = false;
let autoSpeak = true, slow = false, timer = null;
const $ = id => document.getElementById(id);
const store = {get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

let voice = null;
function pickVoice(){
  if(!("speechSynthesis" in window)) return;
  const vs = speechSynthesis.getVoices();
  voice = vs.find(v=>/en-US/i.test(v.lang)&&/Google|Samantha|Aria|Jenny/i.test(v.name)) || vs.find(v=>/en-US/i.test(v.lang)) || vs.find(v=>/^en/i.test(v.lang)) || null;
}
if("speechSynthesis" in window){pickVoice(); speechSynthesis.onvoiceschanged = pickVoice;}
else { $("note").textContent = "このブラウザは読み上げに対応していません。ChromeやSafariで開いてください。"; }

function say(){
  if(!("speechSynthesis" in window)) return;
  const u = new SpeechSynthesisUtterance(DATA[order[pos]].w);
  u.lang = "en-US"; if(voice) u.voice = voice; u.rate = slow ? 0.6 : 0.9;
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}

function render(withVoice){
  const d = DATA[order[pos]];
  $("img").src = d.img; $("img").alt = d.w; $("word").textContent = d.w;
  $("count").textContent = (pos+1) + " / " + DATA.length;
  revealed = false; applyMode();
  const c = $("card"); c.classList.remove("flip"); void c.offsetWidth; c.classList.add("flip");
  document.querySelectorAll(".thumb").forEach(t=>t.setAttribute("aria-current", +t.dataset.i===order[pos] ? "true":"false"));
  if(withVoice && autoSpeak && mode!=="pic") say();
  if(withVoice && mode==="pic") speechSynthesis && speechSynthesis.cancel();
}
function applyMode(){
  $("picCover").hidden = !(mode==="word" && !revealed);
  $("wordCover").hidden = !(mode==="pic" && !revealed);
  $("word").style.visibility = (mode==="pic" && !revealed) ? "hidden" : "visible";
  $("hint").textContent = (mode==="both"||revealed) ? "カードをタップすると、もういちど聞けます" : (mode==="pic" ? "英語で言ってみよう！タップでこたえ" : "読んでみよう！タップで絵とおと");
}
function go(n){ pos = (pos + n + DATA.length) % DATA.length; render(true); }

$("prev").onclick = ()=>{stopPlay(); go(-1)};
$("next").onclick = ()=>{stopPlay(); go(1)};
$("speak").onclick = say;
$("card").onclick = ()=>{ if(mode!=="both" && !revealed){ revealed = true; applyMode(); } say(); };

document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{
  mode = b.dataset.mode; store.set("bsmode",mode);
  document.querySelectorAll("[data-mode]").forEach(x=>x.setAttribute("aria-pressed", x===b));
  render(false);
});
function toggle(id, fn){ const b=$(id); b.onclick=()=>{ const on = b.getAttribute("aria-pressed")!=="true"; b.setAttribute("aria-pressed", on); fn(on); }; }
toggle("o-auto", on=>autoSpeak=on);
toggle("o-slow", on=>{slow=on; say();});
toggle("o-shuffle", on=>{
  const cur = order[pos];
  if(on){ for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];} }
  else order = DATA.map((_,i)=>i);
  pos = 0; if(!on) pos = cur; render(true);
});
function stopPlay(){ if(timer){clearInterval(timer); timer=null; $("o-play").setAttribute("aria-pressed","false");} }
$("o-play").onclick = ()=>{
  if(timer){ stopPlay(); return; }
  $("o-play").setAttribute("aria-pressed","true"); say();
  timer = setInterval(()=>go(1), slow ? 5000 : 3500);
};

const strip = $("strip");
DATA.forEach((d,i)=>{
  const t = document.createElement("button"); t.className="thumb"; t.dataset.i=i; t.setAttribute("aria-label", d.w);
  t.innerHTML = '<img alt="" src="'+d.img+'"><span>'+d.w+'</span>';
  t.onclick = ()=>{ stopPlay(); pos = order.indexOf(i); render(true); window.scrollTo({top:0,behavior:"smooth"}); };
  strip.appendChild(t);
});

document.addEventListener("keydown", e=>{
  if(e.target.closest && e.target.closest(".chip,.thumb")) return;
  if(e.key==="ArrowRight"){stopPlay();go(1)} else if(e.key==="ArrowLeft"){stopPlay();go(-1)}
  else if(e.key===" "){e.preventDefault(); $("card").click();}
});
let sx=null;
$("card").addEventListener("touchstart",e=>{sx=e.touches[0].clientX},{passive:true});
$("card").addEventListener("touchend",e=>{ if(sx===null) return; const dx=e.changedTouches[0].clientX-sx; sx=null;
  if(Math.abs(dx)>50){ e.preventDefault(); stopPlay(); go(dx<0?1:-1); } });

const saved = store.get("bsmode");
if(saved && document.querySelector('[data-mode="'+saved+'"]')) document.querySelector('[data-mode="'+saved+'"]').click();
else render(false);
</script>

</body>
</html>
