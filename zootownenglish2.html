<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>道案内ペア活動 理想の町編</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --mint:#CFF0E4; --mint-2:#DFF5EC; --ink:#111814; --line:#0F1712;
  --green:#4FAE5E; --green-dark:#3C8C49;
  --white:#FFFFFF;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Nunito',sans-serif;
  background:var(--mint);
  color:var(--ink); min-height:100vh;
}
.header-bar{background:#fff;border-bottom:3px solid var(--ink);padding:9px 20px 6px;
  display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:6px;}
.header-bar h1{font-family:'Baloo 2',cursive;font-size:clamp(18px,3.2vw,26px);font-weight:800;margin:0;color:var(--ink);}
.header-bar .edition{font-family:'Baloo 2',cursive;font-size:clamp(13px,2.2vw,18px);font-weight:800;color:var(--ink);}
.header-sub{background:#fff;padding:0 20px 7px;font-size:13px;font-weight:700;color:#333;}
.step-bar{background:var(--mint-2);border-bottom:2px solid rgba(17,24,20,.12);padding:7px 20px;
  display:flex;flex-wrap:wrap;gap:16px;}
.step-bar .step{font-size:13px;font-weight:800;color:var(--ink);}
.main-wrap{max-width:1180px;margin:0 auto;padding:10px 16px 12px;}
.main-layout{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;}
.candidate-col{flex:0 0 118px;display:flex;flex-direction:column;gap:6px;}
.candidate-card{background:var(--mint-2);border-radius:10px;padding:5px;text-align:center;}
.candidate-card img{width:100%;border-radius:6px;display:block;}
.candidate-card select{width:100%;margin-top:4px;font-family:'Nunito',sans-serif;font-weight:800;font-size:10.5px;
  padding:4px 3px;border-radius:7px;border:1.5px solid rgba(17,24,20,.25);background:#fff;color:var(--ink);cursor:pointer;}
.map-col{flex:1 1 420px;min-width:260px;}
.map-wrap{position:relative;width:fit-content;max-width:100%;margin:0 auto;line-height:0;border-radius:10px;overflow:hidden;}
.map-wrap img.map-bg{display:block;max-width:100%;height:auto;}
.map-overlay{position:absolute;inset:0;}
.blank-slot{position:absolute;display:flex;align-items:center;justify-content:center;
  background:#fff;border:2px solid rgba(17,24,20,.15);border-radius:6px;cursor:pointer;padding:2px;overflow:hidden;}
.blank-slot img{width:100%;height:100%;object-fit:contain;}
.blank-slot.target-highlight{border-color:#E8874A;box-shadow:0 0 0 3px rgba(232,135,74,.4);animation:pulse 1.1s infinite ease-in-out;}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.045);}}
.hotspot{position:absolute;transform:translate(-50%,-50%);width:8%;aspect-ratio:1;border-radius:999px;
  cursor:pointer;background:rgba(255,255,255,0);transition:background .15s;}
.hotspot:hover{background:rgba(255,255,255,.35);box-shadow:0 0 0 3px rgba(255,255,255,.6) inset;}
.hotspot.target-highlight{background:rgba(232,135,74,.22);box-shadow:0 0 0 3px #E8874A;animation:pulse 1.1s infinite ease-in-out;}
.avatar{position:absolute;font-size:24px;transform:translate(-50%,-60%);transition:left .3s ease,top .3s ease;
  filter:drop-shadow(0 2px 2px rgba(0,0,0,.35));z-index:5;pointer-events:none;}
.avatar .facer{position:absolute;top:50%;left:50%;width:0;height:0;margin-top:-22px;margin-left:-6px;
  border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:12px solid #E8874A;
  transform-origin:6px 22px;transition:transform .3s ease;}
.avatar.bump{animation:bump .3s ease;}
@keyframes bump{0%,100%{transform:translate(-50%,-60%) scale(1);}50%{transform:translate(-50%,-60%) scale(1.3);}}
.status-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;
  margin-top:8px;padding:6px 2px;}
.target-select-top{font-family:'Nunito',sans-serif;font-weight:800;font-size:13.5px;padding:7px 10px;
  border-radius:9px;border:2px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer;}
.feedback{font-family:'Nunito',sans-serif;font-weight:800;font-size:13px;color:#333;flex:1;text-align:center;min-height:18px;}
.success-banner{display:none;text-align:center;background:#fff;border:2px solid var(--green);border-radius:10px;
  padding:6px 12px;font-family:'Baloo 2',cursive;font-weight:700;font-size:13.5px;color:var(--green-dark);}
.success-banner.show{display:block;}
.button-row{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;}
.button-row button{flex:1 1 100px;font-family:'Baloo 2',cursive;font-weight:700;font-size:13.5px;line-height:1.2;
  padding:11px 6px;border-radius:12px;border:none;cursor:pointer;color:#fff;background:var(--green);
  transition:transform .1s, background .15s;}
.button-row button:hover{background:var(--green-dark);}
.button-row button:active{transform:scale(.97);}
.button-row button.shake{animation:shake .35s;}
.button-row button:disabled{background:#c3d3cb;color:#eef5f1;cursor:not-allowed;}
.button-row button:disabled:hover{background:#c3d3cb;}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}
.step3-bar{background:var(--mint-2);border-radius:10px;text-align:center;padding:8px;margin-top:8px;
  font-size:13px;font-weight:800;color:var(--ink);}
.hint-row{text-align:center;margin-top:6px;}
#hintBtn{font-family:'Nunito',sans-serif;font-weight:800;font-size:12px;background:none;color:var(--green-dark);
  border:none;text-decoration:underline;cursor:pointer;padding:3px;}
#hintText{margin-top:4px;font-family:'Nunito',sans-serif;font-weight:700;font-size:12.5px;color:var(--ink);
  display:none;background:#fff;border-radius:8px;padding:6px 10px;}
#hintText.show{display:inline-block;}
footer{text-align:center;font-size:10.5px;color:#5b7a6c;margin-top:8px;padding-bottom:6px;}
@media (max-width:760px){
  .main-layout{flex-direction:column;}
  .candidate-col{flex-direction:row;flex-wrap:wrap;width:100%;}
  .candidate-card{flex:1 1 110px;}
}
</style>
</head>

<script>

// Chromebooks / Chrome sometimes need voices to be explicitly (re-)loaded before
// speechSynthesis will actually produce audio, and the built-in queue can get stuck
// silently if left idle -- both are known Chrome quirks, not just a lang="en-US"
// guess. We keep a live voice list and nudge/rebuild the queue on every call so
// speech reliably plays instead of silently doing nothing.
let __voices = [];
function __refreshVoices(){
  if('speechSynthesis' in window) __voices = window.speechSynthesis.getVoices();
}
if('speechSynthesis' in window){
  __refreshVoices();
  window.speechSynthesis.onvoiceschanged = __refreshVoices;
  // some ChromeOS builds never fire onvoiceschanged reliably -- poll a few times too
  [300,800,1500,3000].forEach(ms=> setTimeout(__refreshVoices, ms));
}
function speak(text, rate, queue){
  if(!('speechSynthesis' in window)) return;
  const synth = window.speechSynthesis;
  if(!queue) synth.cancel();
  synth.resume(); // clears the "stuck paused" state Chrome can get into after idling
  if(!__voices.length) __refreshVoices();
  const u = new SpeechSynthesisUtterance(text);
  u.lang='en-US'; u.rate=rate||0.9; u.pitch=1.05;
  const enVoice = __voices.find(v=>/^en(-|_|$)/i.test(v.lang));
  if(enVoice) u.voice = enVoice;
  synth.speak(u);
}

function initGame(CFG){
  const FACINGS=['N','E','S','W'];
  const rightOf=f=>FACINGS[(FACINGS.indexOf(f)+1)%4];
  const leftOf=f=>FACINGS[(FACINGS.indexOf(f)+3)%4];
  const lerp=(a,b,t)=>a+(b-a)*t;

  const overlay = document.getElementById('mapOverlay');
  const avatar = document.createElement('div');
  avatar.className='avatar';
  avatar.innerHTML = '<span class="facer" id="avatarFacer"></span><span>🧑</span>';
  overlay.appendChild(avatar);

  CFG.blanks.forEach(b=>{ b.assigned = null; });

  function usedCandidateKeys(){
    return new Set(CFG.blanks.filter(b=>b.assigned).map(b=>b.assigned.key));
  }

  function renderBlankOverlay(b){
    let el = document.getElementById('slot-'+b.letter);
    if(!el){
      el = document.createElement('div');
      el.id = 'slot-'+b.letter;
      el.className = 'blank-slot';
      el.style.left = b.box.left+'%';
      el.style.top = b.box.top+'%';
      el.style.width = b.box.width+'%';
      el.style.height = b.box.height+'%';
      overlay.appendChild(el);
    }
    if(b.assigned){
      el.innerHTML = `<img src="${b.assigned.img}" alt="${b.assigned.en}">`;
      el.onclick = ()=> speak(b.assigned.en);
    } else {
      el.innerHTML = '';
      el.onclick = null;
    }
  }
  CFG.blanks.forEach(renderBlankOverlay);

  // ---- candidate cards (left column) ----
  const candList = document.getElementById('candidateList');
  CFG.candidates.forEach(c=>{
    const card = document.createElement('div');
    card.className = 'candidate-card';
    const img = document.createElement('img');
    img.src = c.img; img.alt = c.en;
    img.addEventListener('click', ()=> speak(c.en));
    img.style.cursor = 'pointer';
    const select = document.createElement('select');
    select.dataset.candidateKey = c.key;
    const emptyOpt = document.createElement('option');
    emptyOpt.value=''; emptyOpt.textContent='ばしょ';
    select.appendChild(emptyOpt);
    CFG.blanks.forEach(b=>{
      const opt = document.createElement('option');
      opt.value = b.letter; opt.textContent = b.letter;
      select.appendChild(opt);
    });
    select.addEventListener('change', ()=>{
      const letter = select.value;
      // clear this candidate from any other blank first
      CFG.blanks.forEach(b=>{ if(b.assigned && b.assigned.key===c.key) { b.assigned=null; renderBlankOverlay(b);} });
      if(letter){
        const b = CFG.blanks.find(x=>x.letter===letter);
        // if that blank already had a different candidate, clear other selects pointing to it
        document.querySelectorAll('#candidateList select').forEach(s=>{
          if(s!==select && s.value===letter) s.value='';
        });
        b.assigned = c;
        renderBlankOverlay(b);
      }
      refreshTargetSelect();
    });
    card.appendChild(img); card.appendChild(select);
    candList.appendChild(card);
  });

  (CFG.fixed||[]).forEach(item=>{
    const el = document.createElement('div');
    el.className='hotspot';
    el.style.left = item.pos.x+'%';
    el.style.top = item.pos.y+'%';
    el.dataset.key = item.key;
    el.title = item.en;
    el.addEventListener('click', ()=> speak(item.en));
    overlay.appendChild(el);
    item._el = el;
  });

  const targetSelect = document.getElementById('targetSelect');
  function refreshTargetSelect(){
    const prev = targetSelect.value;
    targetSelect.innerHTML='';
    if(CFG.fixed && CFG.fixed.length){
      const og = document.createElement('optgroup');
      og.label = CFG.fixedGroupLabel || '見つけよう';
      let any=false;
      CFG.fixed.forEach(item=>{
        if(item.noRoute) return;
        any=true;
        const opt=document.createElement('option');
        opt.value='fixed:'+item.key; opt.textContent=`${item.emoji||''} ${item.en}`.trim();
        og.appendChild(opt);
      });
      if(any) targetSelect.appendChild(og);
    }
    const assignedBlanks = CFG.blanks.filter(b=>b.assigned);
    if(assignedBlanks.length){
      const og2 = document.createElement('optgroup');
      og2.label = CFG.blankGroupLabel || 'ひみつの場所';
      assignedBlanks.forEach(b=>{
        const opt=document.createElement('option');
        opt.value='blank:'+b.letter; opt.textContent=`${b.letter}  (${b.assigned.en})`;
        og2.appendChild(opt);
      });
      targetSelect.appendChild(og2);
    }
    const allValues = Array.from(targetSelect.options).map(o=>o.value);
    if(allValues.includes(prev)){
      targetSelect.value = prev;
    } else if(allValues.length){
      targetSelect.value = allValues[0];
      startRoundFor(allValues[0]);
    } else {
      currentTarget = null;
      document.getElementById('targetPill').textContent = '🎯 -';
    }
  }

  function resolveTarget(value){
    if(!value) return null;
    if(value.startsWith('fixed:')){
      const key = value.slice(6);
      return CFG.fixed.find(i=>i.key===key);
    } else if(value.startsWith('blank:')){
      const letter = value.slice(6);
      const b = CFG.blanks.find(x=>x.letter===letter);
      if(!b || !b.assigned) return null;
      return Object.assign({}, b, {en:b.assigned.en, ja:b.assigned.ja});
    }
    return null;
  }

  targetSelect.addEventListener('change', ()=> startRoundFor(targetSelect.value));

  let currentTarget=null, legIndex=0, progress=0, facing='N', arrived=false;

  function updateFacer(){
    const ang = {N:0,E:90,S:180,W:270}[facing];
    document.getElementById('avatarFacer').style.transform = `rotate(${ang}deg)`;
  }

  function cumulativeBlockIndex(){
    const t = currentTarget; if(!t) return 0;
    let idx = 0;
    for(let i=0;i<legIndex;i++) idx += t.legs[i][1];
    return idx + progress;
  }

  // Each route is stored as one point per block boundary (start + after every
  // block, in order), walked directly out of the real road pixels -- so jumping
  // straight to block_waypoints_pct[n] always lands exactly on the road/intersection
  // for "n blocks from start", in any direction, instead of guessing a straight-line
  // fraction between two far-apart points (which could cut across a cage/building).
  function updatePos(){
    const t = currentTarget; if(!t) return;
    const idx = Math.max(0, Math.min(t.block_waypoints_pct.length-1, cumulativeBlockIndex()));
    const p = t.block_waypoints_pct[idx];
    avatar.style.left = p[0]+'%'; avatar.style.top = p[1]+'%';
  }

  function clearHighlight(){
    document.querySelectorAll('.target-highlight').forEach(e=>e.classList.remove('target-highlight'));
  }
  function highlight(t){
    clearHighlight();
    if(!t) return;
    let el = null;
    if(t.letter) el = document.getElementById('slot-'+t.letter);
    else if(t.key) el = (CFG.fixed.find(i=>i.key===t.key)||{})._el;
    if(el) el.classList.add('target-highlight');
  }

  const feedbackEl = document.getElementById('gameFeedback');
  const successEl = document.getElementById('successBanner');
  const hintTextEl = document.getElementById('hintText');

  function feedback(msg){ feedbackEl.textContent = msg; }
  function shakeBtn(id){
    const el = document.getElementById(id);
    el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake');
  }

  function turnBetween(prevDir, curDir){
    if(rightOf(prevDir)===curDir) return 'right';
    if(leftOf(prevDir)===curDir) return 'left';
    return 'left';
  }

  function buildSentence(t){
    let parts = [];
    t.legs.forEach((leg,i)=>{
      const [dir, blocks] = leg;
      const prevDir = i>0 ? t.legs[i-1][0] : 'N';
      if(dir !== prevDir){
        parts.push(`Turn ${turnBetween(prevDir, dir)}.`);
      }
      parts.push(`Go straight for ${blocks} block${blocks>1?'s':''}.`);
    });
    parts.push(`You can see it on your ${t.side}.`);
    return parts.join(' ');
  }

  function startRoundFor(value){
    const t = resolveTarget(value);
    if(!t){ return; }
    currentTarget = t; legIndex=0; progress=0; facing='N'; arrived=false;
    updatePos(); updateFacer(); highlight(t); updateButtonStates();
    successEl.classList.remove('show'); successEl.textContent=''; feedback('');
    hintTextEl.classList.remove('show'); hintTextEl.textContent='';
    document.getElementById('targetPill').textContent = `🎯 ${t.emoji?t.emoji+' ':''}${t.en}`;
  }

  function arrive(){
    arrived = true;
    const t = currentTarget;
    successEl.textContent = `⭐ You found the ${t.en}! It's on your ${t.side}!`;
    successEl.classList.add('show');
    feedback('');
    updateButtonStates();
    // queue (don't cancel) so this plays right after the "Go straight..." phrase
    // from the click that triggered arrival, instead of cutting it off mid-sentence
    speak(`You can see it on your ${t.side}.`, 0.9, true);
  }

  function bump(){ avatar.classList.remove('bump'); void avatar.offsetWidth; avatar.classList.add('bump'); }

  function updateButtonStates(){
    const straightBtns = [1,2,3].map(n=>document.getElementById('btnStraight'+n));
    if(!currentTarget || arrived){
      straightBtns.forEach(b=>{ b.disabled = true; });
      return;
    }
    const [,blocks] = currentTarget.legs[legIndex];
    const remaining = blocks - progress;
    straightBtns.forEach((b,i)=>{ b.disabled = (i+1) > remaining; });
  }

  function goStraightBy(n){
    speak(`Go straight for ${n} block${n>1?'s':''}.`);
    if(!currentTarget || arrived) return;
    const t = currentTarget;
    const [reqDir, blocks] = t.legs[legIndex];
    if(facing !== reqDir){
      shakeBtn('btnStraight'+n);
      feedback('🤔 その向きだと道からはずれちゃうよ。');
      return;
    }
    const remaining = blocks - progress;
    if(n > remaining){
      shakeBtn('btnStraight'+n);
      feedback('🤔 そんなに進むと交差点を通り過ぎちゃうよ。');
      return;
    }
    progress += n; updatePos(); bump();
    if(progress === blocks){
      if(legIndex === t.legs.length - 1){
        arrive();
      } else {
        legIndex++; progress=0;
        feedback('✅ ここで曲がろう!');
      }
    } else {
      feedback('✅ Good! つぎは?');
    }
    updateButtonStates();
  }

  function turn(dir){
    speak(dir==='right' ? 'Turn right.' : 'Turn left.');
    if(!currentTarget || arrived) return;
    facing = dir==='right' ? rightOf(facing) : leftOf(facing);
    updateFacer(); feedback('');
  }

  document.getElementById('btnStraight1').addEventListener('click', ()=> goStraightBy(1));
  document.getElementById('btnStraight2').addEventListener('click', ()=> goStraightBy(2));
  document.getElementById('btnStraight3').addEventListener('click', ()=> goStraightBy(3));
  document.getElementById('btnLeft').addEventListener('click', ()=> turn('left'));
  document.getElementById('btnRight').addEventListener('click', ()=> turn('right'));

  document.getElementById('hintBtn').addEventListener('click', ()=>{
    if(!currentTarget) return;
    const s = buildSentence(currentTarget);
    hintTextEl.textContent = s;
    hintTextEl.classList.add('show');
    speak(s);
  });

  refreshTargetSelect();
  updateButtonStates();
  fitMapHeight();
}

function fitMapHeight(){
  const mapImg = document.querySelector('.map-wrap img.map-bg');
  if(!mapImg) return;
  mapImg.style.maxHeight = 'none';
  const totalH = document.documentElement.scrollHeight;
  const avail = window.innerHeight;
  const overflow = totalH - avail;
  if(overflow > 4){
    const curH = mapImg.getBoundingClientRect().height;
    const newH = Math.max(160, Math.round(curH - overflow - 6));
    mapImg.style.maxHeight = newH + 'px';
  } else {
    mapImg.style.maxHeight = '';
  }
}
window.addEventListener('load', ()=>{ fitMapHeight(); setTimeout(fitMapHeight, 250); });
window.addEventListener('resize', fitMapHeight);
