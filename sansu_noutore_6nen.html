<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>算数のうトレ 6年</title>
<!--
  先生用メモ：ステージのパスコード
  ステージ2：7416　ステージ3：3058　ステージ4：9273　ステージ5：1684
  （変えたいときは、下のスクリプトの CODES の数字を書きかえてください）
-->
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Hiragino Maru Gothic ProN","BIZ UDPGothic","Meiryo",sans-serif;background:#fff8e7;color:#333;min-height:100vh;-webkit-user-select:none;user-select:none}
.wrap{max-width:960px;margin:0 auto;padding:14px}
.screen{display:none}.screen.on{display:block}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px;flex-wrap:wrap}
h1{font-size:28px;color:#e8692c;letter-spacing:2px}
h1 small{font-size:16px;color:#888;margin-left:6px}
.pill{background:#fff;border-radius:999px;padding:6px 14px;font-weight:bold;box-shadow:0 2px 0 #e6d8b8;font-size:18px}
.btn{border:none;border-radius:14px;padding:10px 18px;font-size:18px;font-weight:bold;cursor:pointer;font-family:inherit;box-shadow:0 4px 0 rgba(0,0,0,.18);transition:transform .05s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.btn.main{background:#ff8c42;color:#fff}.btn.sub{background:#fff;color:#555}
/* ホーム */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.stage{background:#fff;border-radius:18px;padding:10px;text-align:center;cursor:pointer;box-shadow:0 4px 0 #e6d8b8;position:relative;border:4px solid var(--c)}
.stage img{width:100%;aspect-ratio:1;border-radius:12px;object-fit:cover}
.stage .no{font-weight:bold;color:var(--c);margin-top:6px}
.stage .nm{font-size:18px;font-weight:bold}
.stage .best{font-size:15px;color:#666;margin-top:2px}
.stage.lock img{filter:grayscale(1) brightness(.75)}
.stage .lk{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);font-size:54px;display:none}
.stage.lock .lk{display:block}
.sec{margin:20px 0 8px;font-size:20px;font-weight:bold;color:#e8692c}
.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.card{background:#eee;border-radius:12px;padding:6px;text-align:center;font-size:13px;color:#999;min-height:90px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.card img{width:100%;border-radius:8px}
.card.r1{background:#e0a36a;color:#fff}.card.r2{background:#b8c0cc;color:#fff}.card.r3{background:#f2c230;color:#fff}
.card.r4{background:linear-gradient(135deg,#ff6b6b,#ffd93d,#6bcB77,#4d96ff,#c77dff);color:#fff}
.card b{display:block;margin-top:4px;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.comp{margin-top:10px;text-align:center;font-size:22px;font-weight:bold;color:#e8692c;display:none}
/* プレイ */
.top{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.chara{width:110px;height:110px;border-radius:16px;object-fit:cover;border:4px solid var(--c);background:#fff;flex-shrink:0}
.chara.jump{animation:jump .4s}
@keyframes jump{40%{transform:translateY(-12px)}}
.bubble{background:#fff;border-radius:16px;padding:12px 16px;font-size:20px;font-weight:bold;position:relative;flex:1;min-height:56px;display:flex;align-items:center}
.bubble:before{content:"";position:absolute;left:-14px;top:22px;border:8px solid transparent;border-right:12px solid #fff;border-left:0}
.stat{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .12em;line-height:1.05;font-size:.82em}
.frac>span:first-child{border-bottom:.08em solid currentColor;padding:0 .15em}
.frac>span{display:block}
.bar{height:12px;background:#eee;border-radius:6px;overflow:hidden;margin-bottom:12px}
.bar div{height:100%;background:var(--c);transition:width .3s}
.qbox{background:#fff;border-radius:20px;padding:22px 10px;text-align:center;font-size:44px;font-weight:bold;margin-bottom:14px;box-shadow:0 4px 0 #e6d8b8;letter-spacing:1px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ch{background:#fff;border:4px solid #ddd;border-radius:18px;padding:18px 6px;font-size:34px;font-weight:bold;cursor:pointer;font-family:inherit;color:#333;box-shadow:0 4px 0 #ddd}
.ch:disabled{cursor:default}
.ch.good{background:#d8f5dc;border-color:#3fae5a}
.ch.bad{background:#ffe0e0;border-color:#e05555}
.pop{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);font-size:90px;font-weight:bold;pointer-events:none;opacity:0}
.pop.show{animation:pop .7s}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-70%) scale(1)}}
/* 解説 */
.exp{display:none;background:#fffdf3;border:4px dashed var(--c);border-radius:18px;padding:16px;margin-top:14px;font-size:20px;line-height:1.7}
.exp.on{display:block}
.exp .head{font-size:22px;font-weight:bold;color:#e05555;margin-bottom:6px}
.exp .tip{background:#fff;border-radius:10px;padding:8px 12px;margin:8px 0}
.exp .next{display:block;margin:12px auto 0;font-size:22px;padding:12px 40px}
.shift{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;margin:8px 0}
.num{font-size:40px;font-weight:bold;background:#fff;border-radius:10px;padding:4px 16px;font-family:"Courier New",monospace}
.num.small{font-size:26px;padding:2px 10px}
.dot{color:#e05555;font-size:1.3em;display:inline-block;animation:hopdot 1.2s infinite}
.dot.ghost{opacity:.35}
@keyframes hopdot{50%{transform:translateY(-8px)}}
.hop{text-align:center;color:#555;font-size:18px}
.hop b{color:#3fae5a}
.steps div{margin:4px 0}
.list .row{display:grid;grid-template-columns:90px 1fr 40px;align-items:center;background:#fff;border-radius:10px;padding:4px 10px;margin:4px 0}
.list .row.ok{background:#d8f5dc}
.list .n{font-size:26px;font-weight:bold}
.list .mark{font-size:26px;font-weight:bold;text-align:center}
.mrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}
.mrow b{width:110px}
.mrow span{background:#fff;border-radius:8px;padding:2px 10px;font-weight:bold}
.mrow span.com{background:#ffe9a8}
.mrow span.hit{background:#ff8c42;color:#fff}
.tape{display:flex;height:46px;border:3px solid #555;border-radius:8px;overflow:hidden;background:#fff;position:relative;margin-top:8px}
.tape .fill{background:#ffb37a;display:flex;align-items:center;justify-content:center;font-weight:bold;white-space:nowrap;overflow:visible}
.tape .whole{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-weight:bold;color:#555}
.scale{display:flex;justify-content:space-between;font-size:14px;color:#888}
/* 結果 */
.result{text-align:center;background:#fff;border-radius:20px;padding:20px;box-shadow:0 4px 0 #e6d8b8}
.result img{width:180px;border-radius:16px;border:4px solid var(--c)}
.big{font-size:72px;font-weight:bold;color:#e8692c}
.rmsg{font-size:24px;font-weight:bold;margin:8px 0}
.rinfo{font-size:19px;margin:6px 0}
.newcard{display:inline-block;min-height:0;margin:10px;padding:10px 20px;border-radius:14px;font-weight:bold;font-size:20px}
.rbtns{display:flex;gap:12px;justify-content:center;margin-top:14px;flex-wrap:wrap}
/* パスコード */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:10}
.modal.on{display:flex}
.mbox{background:#fff;border-radius:20px;padding:20px;width:320px;text-align:center}
.mbox h2{font-size:20px;margin-bottom:8px}
.codebox{display:flex;justify-content:center;gap:8px;margin:10px 0}
.codebox div{width:48px;height:56px;border:3px solid #ccc;border-radius:10px;font-size:32px;font-weight:bold;display:flex;align-items:center;justify-content:center}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keys button{font-size:26px;padding:10px 0}
.err{color:#e05555;font-weight:bold;height:24px}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@media(max-width:600px){.qbox{font-size:32px}.ch{font-size:26px}.cards{grid-template-columns:repeat(3,1fr)}.chara{width:80px;height:80px}}
</style>
</head>
<body>
<div class="wrap">

<!-- ホーム -->
<div id="home" class="screen on">
  <header><h1>算数のうトレ<small>6年</small></h1><span class="pill" id="coinPill">🪙 0</span></header>
  <div class="grid" id="stageGrid"></div>
  <div class="sec">🃏 カードずかん</div>
  <div class="cards" id="cardGrid"></div>
  <div class="comp" id="comp">🎉 5まいコンプリート！ きみは算数マスターだ！ 🎉</div>
</div>

<!-- プレイ -->
<div id="play" class="screen">
  <div class="top"><img class="chara" id="pChara" alt=""><div class="bubble" id="pBubble"></div></div>
  <div class="stat"><span class="pill" id="pNo">1 / 20</span><span class="pill" id="pScore">0 点</span><span class="pill" id="pCombo">🔥 0</span><span class="pill" id="pCoin">🪙 0</span><button class="btn sub" id="quitBtn" style="margin-left:auto;font-size:15px;padding:6px 12px">やめる</button></div>
  <div class="bar"><div id="pBar" style="width:0"></div></div>
  <div class="qbox" id="pQ"></div><div id="pFig" style="background:#fff;border-radius:16px;margin:-6px 0 12px;display:none"></div>
  <div class="choices" id="pChoices"></div>
  <div class="exp" id="pExp"><div class="head">おしい！ 正しい答えは <span id="pAns"></span></div><div id="pExpBody"></div><button class="btn main next" id="nextBtn">つぎへ ▶</button></div>
</div>

<!-- 結果 -->
<div id="result" class="screen">
  <div class="result">
    <img id="rChara" alt="">
    <div class="rmsg" id="rMsg"></div>
    <div class="big" id="rScore">0</div>
    <div class="rinfo" id="rBest"></div>
    <div class="rinfo" id="rCoin"></div>
    <div id="rCard"></div>
    <div class="rbtns"><button class="btn main" id="retryBtn">もう一回チャレンジ！</button><button class="btn sub" id="homeBtn">ステージえらびへ</button></div>
  </div>
</div>
</div>

<div class="pop" id="pop"></div>

<!-- パスコード -->
<div class="modal" id="modal"><div class="mbox" id="mbox">
  <h2 id="mTitle">パスコードを入れてね</h2>
  <div style="font-size:15px;color:#777">先生から聞いた4けたの数字</div>
  <div class="codebox" id="codeBox"><div></div><div></div><div></div><div></div></div>
  <div class="err" id="mErr"></div>
  <div class="keys" id="keys"></div>
  <button class="btn sub" id="mClose" style="margin-top:10px">とじる</button>
</div></div>

<script>
// ===== 問題づくり =====
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function fmt(x){return String(parseFloat(Number(x).toFixed(6)));}
function hl(s){s=String(s);if(s.indexOf('.')<0)return s+'<span class="dot ghost">.</span>';return s.replace('.','<span class="dot">.</span>');}
let CHK=null;
function makeChoices(correct,cands,fallback){fallback=fallback||(()=>String(rnd(1,99)));
  const out=[];
  for(const c of shuffle(cands)){const s=String(c);if(CHK&&!CHK(s))continue;if(!/\.\d{5,}/.test(s)&&s!==correct&&!out.includes(s)&&s!=='NaN'&&s!=='0'&&s.indexOf('-')<0)out.push(s);if(out.length===3)break;}
  let guard=0;
  while(out.length<3&&guard<200){guard++;const s=String(fallback());if(CHK&&!CHK(s))continue;if(!/\.\d{5,}/.test(s)&&s!==correct&&!out.includes(s)&&s.indexOf('-')<0&&s!=='0')out.push(s);}
  return shuffle([correct,...out]);
}
function shiftBox(from,to,dir,k,sign,n){
  return `<div class="shift"><div class="num">${hl(from)}</div>`+
    `<div class="hop">${sign} ${n}<br><b>小数点が${dir}へ ${k}けた ぴょん！</b></div>`+
    `<div class="num">${hl(to)}</div></div>`;
}

// ===== 6年 =====
function gcd(a,b){return b?gcd(b,a%b):a;}
function F(n,d){const g=gcd(n,d);n/=g;d/=g;return d===1?String(n):`${d}分の${n}`;}
function Fr(n,d){return d===1?String(n):`${d}分の${n}`;} // 約分しない
// ステージ1：分数のかけ算・わり算
function tapeH(rows){ // rows:[{name,w,text,color}]
  const mx=Math.max(...rows.map(r=>r.w));
  return '<div style="margin:8px 0">'+rows.map(r=>`<div style="display:flex;align-items:center;gap:8px;margin:6px 0"><b style="width:56px">${r.name}</b><div style="width:${Math.round(r.w/mx*70)}%;background:${r.color};border:2px solid #555;border-radius:6px;padding:4px 8px;font-weight:bold;white-space:nowrap">${r.text}</div></div>`).join('')+'</div>';
}
const pickF=()=>{let n,dd;do{dd=rnd(2,9);n=rnd(1,dd-1);}while(gcd(n,dd)!==1);return [n,dd];};
function genStage1Raw(){
  const t=Math.random();
  let [a,b]=pickF(),[c,d]=pickF();
  if(t<0.2){
    const k=Math.random();
    if(k<0.45){
      let w,n,dd,top;do{w=rnd(1,2);[n,dd]=pickF();top=w*dd+n;}while(top>9);
      const A=Fr(dd,top);
      return {q:`${w}と${dd}分の${n} の 逆数は？`,ans:A,
        choices:makeChoices(A,[Fr(top,dd),Fr(top+1,dd),Fr(dd,n),Fr(n,dd)],()=>Fr(dd,top+rnd(1,5))),
        exp:`<p class="tip">逆数 ＝ 分子と分母を <b>入れかえた数</b><br>帯分数は、先に <b>仮分数</b> になおしてから入れかえる</p><p>${w}と${dd}分の${n} ＝ ${Fr(top,dd)} → 逆数は <b>${A}</b></p>`};
    }else if(k<0.8){
      const A=Fr(b,a);
      return {q:`${Fr(a,b)} の 逆数は？`,ans:A,
        choices:makeChoices(A,[Fr(a,b),Fr(1,a*b),Fr(b,a+b),Fr(a+b,b)],()=>Fr(rnd(1,9),rnd(2,9))),
        exp:`<p class="tip">逆数 ＝ 分子と分母を <b>入れかえた数</b>（かけると 1 になる数）</p><p>${Fr(a,b)} → <b>${A}</b></p>`};
    }else{
      const n=rnd(2,9);const A=Fr(1,n);
      return {q:`${n} の 逆数は？`,ans:A,
        choices:makeChoices(A,[String(n),'1',Fr(n,10),Fr(2,n)].filter(x=>x!==A),()=>Fr(1,rnd(2,12))),
        exp:`<p class="tip">整数は <b>${n} ＝ ${Fr(n,1).replace(/^(\d+)$/,'1分の$1')}</b> と考えて、分子と分母を入れかえる</p><p>${n} の逆数は <b>${A}</b></p>`};
    }
  }else if(t<0.32){
    const A=`${Fr(a,b)} × ${Fr(d,c)}`;
    return {q:`${Fr(a,b)} ÷ ${Fr(c,d)} と同じ答えになる式は？`,ans:A,
      choices:makeChoices(A,[`${Fr(b,a)} × ${Fr(c,d)}`,`${Fr(a,b)} × ${Fr(c,d)}`,`${Fr(b,a)} × ${Fr(d,c)}`,`${Fr(a,b)} ÷ ${Fr(d,c)}`],()=>`${Fr(a,b)} × ${Fr(rnd(1,9),d)}`),
      exp:`<p class="tip">分数でわるときは、<b>わる数をひっくり返して かける</b></p><p>${Fr(c,d)} → ひっくり返すと <b>${Fr(d,c)}</b></p><p>${Fr(a,b)} ÷ ${Fr(c,d)} ＝ <b>${A}</b></p>`};
  }else if(t<0.5){
    const A=F(a*c,b*d);
    return {q:`${Fr(a,b)} × ${Fr(c,d)} = ?`,ans:A,
      choices:makeChoices(A,[F(a*d,b*c),F(a+c,b+d),F(a*c,b+d),F(a+c,b*d),F(b*d,a*c)],()=>F(rnd(1,20),b*d)),
      exp:`<p class="tip">分数×分数は <b>分母どうし、分子どうしをかける</b><br>（とちゅうで約分できたらする）</p><p>分子：${a} × ${c} ＝ ${a*c}　分母：${b} × ${d} ＝ ${b*d}</p><p>${Fr(a*c,b*d)}${gcd(a*c,b*d)>1?' → 約分して ':' → '}<b>${A}</b></p>`};
  }else if(t<0.65){
    const A=F(a*d,b*c);
    return {q:`${Fr(a,b)} ÷ ${Fr(c,d)} = ?`,ans:A,
      choices:makeChoices(A,[F(a*c,b*d),F(b*c,a*d),F(a*d+1,b*c),F(a+d,b+c)],()=>F(rnd(1,30),b*c)),
      exp:`<p class="tip">わる数をひっくり返して かける</p><p>${Fr(a,b)} × ${Fr(d,c)} ＝ ${Fr(a*d,b*c)}${gcd(a*d,b*c)>1?' → 約分して ':' → '}<b>${A}</b></p>`};
  }else if(t<0.82){
    // 赤 a/b m、白は赤の c/d 倍
    [a,b]=(()=>{let n,dd;do{dd=rnd(2,8);n=rnd(dd+1,9);}while(gcd(n,dd)!==1);return [n,dd];})();
    const A=F(a*c,b*d)+'m';
    return {q:`赤のリボンは ${Fr(a,b)}m。白のリボンは 赤の ${Fr(c,d)}倍。白のリボンは 何m？`,ans:A,
      choices:makeChoices(A,[F(a*d,b*c),F(a+c,b+d),F(a,b),F(b*c,a*d)].map(x=>x+'m'),()=>F(rnd(1,20),b*d)+'m'),
      exp:tapeH([{name:'赤',w:1,text:`${Fr(a,b)}m（1倍）`,color:'#ffb3b3'},{name:'白',w:c/d,text:`？m（${Fr(c,d)}倍）`,color:'#fff'}])+
        `<p class="tip"><b>もとにする量 × 倍 ＝ くらべる量</b></p><p>${Fr(a,b)} × ${Fr(c,d)} ＝ ${Fr(a*c,b*d)}${gcd(a*c,b*d)>1?' → 約分して ':' → '}<b>${A}</b></p>`};
  }else{
    // 青は赤の何倍？ 式を選ぶ
    let p1,p2,q1,q2;
    do{[p1,p2]=[rnd(2,9),rnd(2,9)];[q1,q2]=[rnd(2,9),rnd(2,9)];}while(gcd(p1,p2)!==1||gcd(q1,q2)!==1||p1*q2===q1*p2);
    const P=Fr(p1,p2),Q=Fr(q1,q2);
    const A=`${Q} ÷ ${P}`;
    return {q:`赤のリボンは ${P}m、青のリボンは ${Q}m。青は赤の何倍かを求める式は？`,ans:A,
      choices:shuffle([A,`${Q} − ${P}`,`${Q} + ${P}`,`${Q} × ${P}`]),
      exp:tapeH([{name:'赤',w:p1/p2,text:`${P}m（1倍）`,color:'#ffb3b3'},{name:'青',w:q1/q2,text:`${Q}m（□倍）`,color:'#b3d4ff'}])+
        `<p class="tip">何倍かを求めるときは <b>くらべる量 ÷ もとにする量</b><br>「赤の何倍」→ 赤が <b>もとにする量（1倍）</b></p><p>${A}</p>`};
  }
}
const small=s=>(String(s).match(/\d+/g)||[]).every(n=>Number(n)<=9);
const kind1=q=>/逆数/.test(q.q)?'r':/同じ答え/.test(q.q)?'s':/白/.test(q.q)?'w':/青/.test(q.q)?'b':/×/.test(q.q)?'m':'d';
function genStage1(){
  const x=Math.random();const want=x<0.15?'r':x<0.3?'s':x<0.55?'m':x<0.75?'d':x<0.88?'w':'b';
  CHK=small;
  for(let i=0;i<2000;i++){const q=genStage1Raw();
    if(kind1(q)===want&&small(q.q)&&small(q.ans)&&q.choices.length===4&&q.choices.every(small)&&new Set(q.choices).size===4){CHK=null;return q;}}
  CHK=null;return genStage1Raw();
}
// ステージ2：比と拡大図
function enlSvg(k,lab){ // lab: {AB,AC,BC,BD,CE,DE}
  const A=[40,200],D=[360,200],E=[180,30];
  const B=[A[0]+(D[0]-A[0])/k,A[1]+(D[1]-A[1])/k],C=[A[0]+(E[0]-A[0])/k,A[1]+(E[1]-A[1])/k];
  const mid=(p,q,dx,dy)=>[(p[0]+q[0])/2+dx,(p[1]+q[1])/2+dy];
  const T=(p,s,col)=>s?`<text x="${p[0]}" y="${p[1]}" text-anchor="middle" font-size="17" font-weight="bold" fill="${col||'#333'}">${s}</text>`:'';

function speedTape(v,h,dist,unk){

  s+=`<rect x="${L}" y="${y1-12}" width="${W}" height="24" fill="#ffe0c2" stroke="#555" stroke-width="2"/>`;
  s+=`<line x1="${L}" y1="${y2}" x2="${L+W}" y2="${y2}" stroke="#555" stroke-width="2"/>`;
  const seg=unk==='time'?W/3:W/h;
  const n=unk==='time'?1:h;
  for(let i=0;i<=n;i++){const x=L+seg*i;
    s+=`<line x1="${x}" y1="${y1-12}" x2="${x}" y2="${y1+12}" stroke="#555" stroke-width="2"/><line x1="${x}" y1="${y2-6}" x2="${x}" y2="${y2+6}" stroke="#555" stroke-width="2"/>`;
    s+=`<text x="${x}" y="${y2+22}" text-anchor="middle" font-size="14">${i===0?'0':i+'時間'}</text>`;
    if(i<n)s+=`<text x="${x+seg/2}" y="${y1+5}" text-anchor="middle" font-size="14" font-weight="bold" fill="${unk==='speed'&&i===0?'#e05555':'#333'}">${unk==='speed'?(i===0?'？km':''):v+'km'}</text>`;
  }
  if(unk==='time'){s+=`<line x1="${L+seg}" y1="${y1}" x2="${L+W}" y2="${y1}" stroke="#555" stroke-dasharray="5 5"/><line x1="${L+W}" y1="${y2-6}" x2="${L+W}" y2="${y2+6}" stroke="#555" stroke-width="2"/><text x="${L+W}" y="${y2+22}" text-anchor="middle" font-size="14" font-weight="bold" fill="#e05555">？時間</text>`;}
  if(unk==='time'){s+=`<line x1="${L+W}" y1="${y1-12}" x2="${L+W}" y2="${y1+12}" stroke="#555" stroke-width="2"/>`;}
  s+=`<path d="M${L} ${y1-16} Q${L+W/2} ${y1-40} ${L+W} ${y1-16}" fill="none" stroke="#888"/><text x="${L+W/2}" y="${y1-30}" text-anchor="middle" font-size="15" font-weight="bold" fill="${unk==='dist'?'#e05555':'#333'}">${unk==='dist'?'？km':dist+'km'}</text>`;
  return s+`</svg>`;
}

    if(type==='add'){x=rnd(5,60);a=rnd(5,60);q=`x ＋ ${a} ＝ ${x+a}`;expl=`x ＝ ${x+a} − ${a}`;}
    else if(type==='sub'){a=rnd(5,40);x=a+rnd(5,50);q=`x − ${a} ＝ ${x-a}`;expl=`x ＝ ${x-a} ＋ ${a}`;}
    else if(type==='mul'){x=rnd(2,12);a=rnd(2,9);q=`x × ${a} ＝ ${x*a}`;expl=`x ＝ ${x*a} ÷ ${a}`;}
    else{a=rnd(2,9);x=a*rnd(2,12);q=`x ÷ ${a} ＝ ${x/a}`;expl=`x ＝ ${x/a} × ${a}`;}
    const A=String(x);
    const rhs=Number(q.split('＝ ')[1]);
    return {q:`${q}　x は？`,ans:A,choices:makeChoices(A,[rhs,x+a,Math.abs(x-a)||x+2*a,x*2,rhs+a*2].map(String),()=>String(x+rnd(-9,9))),
      exp:`<p class="tip">x を求めるには <b>反対の計算</b>をする<br>＋ ↔ −　　× ↔ ÷</p><p>${expl} ＝ <b>${x}</b></p>`};
  }
  const N=pick([12,15,18,20,24,30,36,40,50,60]);
  const types=Object.keys(SCN);
  const tc=pick(types);const others=shuffle(types.filter(k=>k!==tc)).slice(0,3);
  const hint=`<p class="tip">場面を <b>ことばの式</b> にしてから、数と x をあてはめよう<br>のこり → −　全部で（同じ数のまとまり）→ ×　同じ数ずつ分ける・速さで時間 → ÷</p>`;
  if(t<0.72){
    const A=pick(SCN[tc](N));
    const ch=shuffle([A,...others.map(k=>pick(SCN[k](N)))]);
    const why=ch.map(s=>{const k=types.find(k=>SCN[k](N).includes(s));return `<div class="row ${s===A?'ok':''}" style="grid-template-columns:1fr 150px 40px"><span style="font-size:16px">${s}</span><b>${FORM[k](N)}</b><span class="mark">${s===A?'○':'×'}</span></div>`;}).join('');
    return {q:`${FORM[tc](N)} の式に あてはまる場面は？`,ans:A,choices:ch,exp:hint+`<div class="list">${why}</div>`};
  }else{
    const sc=pick(SCN[tc](N));const A=FORM[tc](N);
    return {q:sc+' x と y の関係を表す式は？',ans:A,choices:shuffle([A,...others.map(k=>FORM[k](N))]),exp:hint+`<p>答え：<b>${A}</b></p>`};
  }
}
const GENS=[genStage1,genStage2,genStage3,genStage4,genStage5];
function makeRound(si){
  const qs=[],seen=new Set();let guard=0;
  while(qs.length<20&&guard<500){guard++;const q=GENS[si]();const key=q.q+'|'+q.ans;if(seen.has(key))continue;seen.add(key);qs.push(q);}
  return qs;
}

  return s.replace(/(\d+)分の(\d+)/g,'<span class="frac"><span>$2</span><span>$1</span></span>');}

// ===== 保存 =====
const KEY='sansuNoutore6_v1';
let data={unlocked:[true,false,false,false,false],best:[null,null,null,null,null],coins:0};
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.unlocked)data=s;}catch(e){}

// ===== 音 =====
let ac=null;
function beep(freqs,dur){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();let t=ac.currentTime;for(const f of freqs){const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+dur);t+=dur*.7;}}catch(e){}}
const sGood=()=>beep([784,1047],.15),sBad=()=>beep([330,262],.22),sFan=()=>beep([523,659,784,1047,1319],.18);

// ===== 画面 =====
const $=id=>document.getElementById(id);
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));$(id).classList.add('on');window.scrollTo(0,0);}

function renderHome(){
  $('coinPill').textContent='🪙 '+data.coins;
  const g=$('stageGrid');g.innerHTML='';
  STAGES.forEach((st,i)=>{
    const d=document.createElement('div');
    d.className='stage'+(data.unlocked[i]?'':' lock');d.style.setProperty('--c',st.color);
    d.innerHTML=`<img src="${IMGS[i]}" alt=""><div class="lk">🔒</div><div class="no">ステージ${i+1}</div><div class="nm">${st.name}</div><div class="best">${data.unlocked[i]?(data.best[i]===null?'まだ挑戦していないよ':'最高 '+data.best[i]+'点'):'パスコードで開くよ'}</div>`;
    d.onclick=()=>data.unlocked[i]?start(i):openCode(i);
    g.appendChild(d);
  });
  const c=$('cardGrid');c.innerHTML='';let all=true;
  STAGES.forEach((st,i)=>{
    const b=data.best[i];const d=document.createElement('div');
    if(b===null){all=false;d.className='card';d.innerHTML='？<br>まだ<br>もっていない';}
    else{const r=RANKS[rankOf(b)];d.className='card '+r.c;d.innerHTML=`<img src="${IMGS[i]}" alt=""><b>${r.n}</b>`;}
    c.appendChild(d);
  });
  $('comp').style.display=all?'block':'none';
}

// ===== パスコード =====
let codeStage=0,codeIn='';
function openCode(i){codeStage=i;codeIn='';$('mTitle').textContent=`ステージ${i+1}のパスコード`;$('mErr').textContent='';drawCode();$('modal').classList.add('on');}
function drawCode(){[...$('codeBox').children].forEach((d,k)=>d.textContent=codeIn[k]?'●':'');}
(function(){const k=$('keys');['1','2','3','4','5','6','7','8','9','けす','0','OK'].forEach(v=>{const b=document.createElement('button');b.className='btn '+(v==='OK'?'main':'sub');b.textContent=v;b.onclick=()=>key(v);k.appendChild(b);});})();
function key(v){
  if(v==='けす'){codeIn=codeIn.slice(0,-1);}
  else if(v==='OK'){
    if(codeIn===CODES[codeStage+1]){data.unlocked[codeStage]=true;save();$('modal').classList.remove('on');sFan();renderHome();return;}
    $('mErr').textContent='ちがうみたい。もう一度！';codeIn='';sBad();const m=$('mbox');m.classList.remove('shake');void m.offsetWidth;m.classList.add('shake');
  }else if(codeIn.length<4){codeIn+=v;$('mErr').textContent='';}
  drawCode();
}
$('mClose').onclick=()=>$('modal').classList.remove('on');

// ===== プレイ =====
let cur=0,qs=[],qi=0,score=0,combo=0,maxCombo=0,gotCoin=0,locked=false;
function say(t){$('pBubble').textContent=t;const c=$('pChara');c.classList.remove('jump');void c.offsetWidth;c.classList.add('jump');}
function start(i){
  cur=i;qs=makeRound(i);qi=0;score=0;combo=0;maxCombo=0;gotCoin=0;
  const st=STAGES[i];
  document.querySelectorAll('#play,#result').forEach(e=>e.style.setProperty('--c',st.color));
  $('pChara').src=IMGS[i];
  show('play');say(st.catchy);showQ();
}
function showQ(){
  const q=qs[qi];
  $('pNo').textContent=`${qi+1} / 20`;$('pScore').textContent=`${score} 点`;$('pCombo').textContent=`🔥 ${combo}`;$('pCoin').textContent=`🪙 ${gotCoin}`;
  $('pBar').style.width=(qi/20*100)+'%';
  $('pQ').innerHTML=fx(q.q);$('pFig').innerHTML=q.fig||'';$('pFig').style.display=q.fig?'block':'none';$('pQ').style.fontSize=q.q.length>30?'24px':q.q.length>18?'32px':'';$('pExp').classList.remove('on');
  const box=$('pChoices');box.innerHTML='';
  q.choices.forEach(c=>{const b=document.createElement('button');b.className='ch';b.innerHTML=fx(c);b.dataset.v=c;if(c.length>16){b.style.fontSize='19px';b.style.textAlign='left';b.style.padding='12px 14px';b.style.lineHeight='1.5';}b.disabled=true;b.onclick=()=>answer(b,c);box.appendChild(b);});
  locked=true;setTimeout(()=>{locked=false;box.querySelectorAll('.ch').forEach(b=>b.disabled=false);},400);
  if(qi===10)say('あと半分！');
  if(qi===15)say('あと5問！');
}
function popup(t,col){const p=$('pop');p.textContent=t;p.style.color=col;p.classList.remove('show');void p.offsetWidth;p.classList.add('show');}
function answer(btn,c){
  if(locked)return;locked=true;
  const q=qs[qi];const st=STAGES[cur];
  $('pChoices').querySelectorAll('.ch').forEach(b=>{b.disabled=true;if(b.dataset.v===q.ans)b.classList.add('good');});
  if(c===q.ans){
    score+=5;combo++;maxCombo=Math.max(maxCombo,combo);
    let add=1;if(combo%5===0)add+=3;gotCoin+=add;
    sGood();popup(combo%5===0?`🔥${combo}コンボ！`:'⭕',combo%5===0?'#ff8c42':'#3fae5a');
    say(combo>=3?`${pick(st.good)} ${combo}コンボ！`:pick(st.good));
    $('pScore').textContent=`${score} 点`;$('pCombo').textContent=`🔥 ${combo}`;$('pCoin').textContent=`🪙 ${gotCoin}`;
    setTimeout(next,650);
  }else{
    btn.classList.add('bad');combo=0;$('pCombo').textContent='🔥 0';
    sBad();say('おしい！次はいける！');
    $('pAns').innerHTML=fx(q.ans);$('pExpBody').innerHTML=fx(q.exp);$('pExp').classList.add('on');
    setTimeout(()=>$('pExp').scrollIntoView({behavior:'smooth',block:'nearest'}),50);
  }
}
$('nextBtn').onclick=next;
function next(){qi++;if(qi>=20)finish();else showQ();}
$('quitBtn').onclick=()=>{renderHome();show('home');};

function finish(){
  const st=STAGES[cur];
  const prev=data.best[cur];
  const isNew=prev===null||score>prev;
  const prevRank=prev===null?0:rankOf(prev);
  if(isNew)data.best[cur]=score;
  data.coins+=gotCoin;save();
  $('rChara').src=IMGS[cur];
  $('rScore').textContent=score+'点';
  $('rMsg').textContent=score===100?'天才あらわる！ 満点だ！':score>=80?'すごい！ もう少しで満点！':score>=50?'いい感じ！ 最高点をねらおう！':'もう一回チャレンジして、点数アップだ！';
  $('rBest').innerHTML=isNew&&prev!==null?`🎊 最高点こうしん！（前は ${prev}点）`:`最高点：${data.best[cur]}点`;
  $('rCoin').textContent=`🪙 コイン ${gotCoin}まい ゲット！（さいだいコンボ ${maxCombo}）`;
  const nr=rankOf(data.best[cur]);
  if(nr>prevRank){const r=RANKS[nr];$('rCard').innerHTML=`<div class="newcard card ${r.c}">🃏 ${st.chara}の ${r.n}カード ゲット！</div>`;}
  else $('rCard').innerHTML=nr<4?`<div class="rinfo" style="color:#888">${nr===3?'100点でレインボーカード':nr===2?'90点でゴールドカード':'70点でシルバーカード'}に レベルアップ！</div>`:'';
  $('pBar').style.width='100%';
  if(score>=80)sFan();
  show('result');
}
$('retryBtn').onclick=()=>start(cur);
$('homeBtn').onclick=()=>{renderHome();show('home');};

renderHome();
</script>
</body>
</html>
