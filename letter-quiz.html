<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文字さがしクイズ - えだ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@400;500&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1:#eef4e6;
    --bg-2:#dcebe9;
    --card:#fbfdf8;
    --ink:#2c3a2a;
    --forest:#2f5233;
    --forest-deep:#1f3a24;
    --branch:#c98a4b;
    --branch-soft:#e3c39a;
    --blossom:#e88aa0;
    --blossom-soft:#f6d9df;
    --miss:#d97757;
    --line:#d9e3d0;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(circle at 15% 10%, #f4f9ee 0%, transparent 45%),
      radial-gradient(circle at 90% 85%, var(--bg-2) 0%, transparent 55%),
      linear-gradient(160deg, var(--bg-1), var(--bg-2));
    font-family:'Zen Maru Gothic', sans-serif;
    color:var(--ink);
    padding:32px 16px;
  }
  .stage{width:100%;max-width:480px;}
  .card{
    background:var(--card);
    border-radius:28px;
    padding:36px 30px 30px;
    box-shadow:0 20px 50px -20px rgba(31,58,36,0.35), 0 2px 0 rgba(255,255,255,0.6) inset;
    position:relative;
    overflow:hidden;
  }
  .card::before{
    content:"";
    position:absolute;
    top:-60px; right:-60px;
    width:160px;height:160px;
    background:radial-gradient(circle, var(--blossom-soft), transparent 70%);
    opacity:0.7;
  }
  .eyebrow{
    font-size:12px;
    letter-spacing:0.14em;
    color:var(--forest);
    font-weight:700;
    margin:0 0 6px;
    position:relative;
  }
  h1{
    font-family:'Kiwi Maru', serif;
    font-size:26px;
    margin:0 0 4px;
    color:var(--forest-deep);
    position:relative;
  }
  .hint{
    font-size:14px;
    color:#5a6b56;
    margin:0 0 20px;
    position:relative;
  }
  .tree-wrap{
    display:flex;
    justify-content:center;
    margin-bottom:14px;
  }
  #tree{width:150px;height:150px;overflow:visible;}
  .branch{
    stroke:var(--branch);
    stroke-width:5;
    stroke-linecap:round;
    fill:none;
    opacity:0;
    transform-origin:var(--ox) var(--oy);
    transition:opacity .35s ease, transform .5s cubic-bezier(.34,1.4,.64,1);
    transform:scale(0.3) rotate(var(--r0));
  }
  .branch.show{opacity:1; transform:scale(1) rotate(0deg);}
  .leaf{opacity:0; transition:opacity .4s ease .1s;}
  .leaf.show{opacity:1;}
  .blanks{
    display:flex;
    justify-content:center;
    gap:14px;
    margin:6px 0 22px;
  }
  .blank{
    width:34px;
    text-align:center;
    font-family:'Kiwi Maru', serif;
    font-size:26px;
    font-weight:500;
    color:var(--forest-deep);
    border-bottom:3px solid var(--line);
    padding-bottom:4px;
    transition:border-color .3s ease, transform .3s ease;
  }
  .blank.filled{
    border-color:var(--forest);
    animation:pop .35s ease;
  }
  @keyframes pop{
    0%{transform:scale(0.6);}
    60%{transform:scale(1.12);}
    100%{transform:scale(1);}
  }
  .letters{
    display:grid;
    grid-template-columns:repeat(7, 1fr);
    gap:8px;
    margin-bottom:18px;
  }
  .key{
    aspect-ratio:1/1;
    border-radius:14px;
    border:none;
    background:#fff;
    box-shadow:0 3px 0 var(--line), 0 6px 14px -8px rgba(31,58,36,0.3);
    font-family:'Zen Maru Gothic', sans-serif;
    font-weight:700;
    font-size:17px;
    color:var(--forest-deep);
    cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease, background .2s ease, color .2s ease;
  }
  .key:hover:not(:disabled){transform:translateY(-2px);}
  .key:active:not(:disabled){transform:translateY(1px); box-shadow:0 1px 0 var(--line);}
  .key:disabled{cursor:default;}
  .key.correct{
    background:var(--forest);
    color:#fff;
    box-shadow:0 3px 0 var(--forest-deep);
  }
  .key.wrong{
    background:var(--blossom-soft);
    color:var(--miss);
    box-shadow:0 3px 0 #e3b7a3;
    opacity:0.75;
  }
  .status{
    min-height:22px;
    text-align:center;
    font-size:14.5px;
    font-weight:700;
    color:var(--forest);
    margin:0 0 6px;
  }
  .status.lose{color:var(--miss);}
  .meta{
    text-align:center;
    font-size:12.5px;
    color:#7c8a78;
    margin:0 0 4px;
  }
  .retry{
    display:block;
    margin:14px auto 0;
    padding:10px 22px;
    border:none;
    border-radius:999px;
    background:var(--forest);
    color:#fff;
    font-family:'Zen Maru Gothic', sans-serif;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
    box-shadow:0 4px 0 var(--forest-deep);
  }
  .retry:active{transform:translateY(2px); box-shadow:0 2px 0 var(--forest-deep);}
  .hidden{display:none;}
  .answer-reveal{
    text-align:center;
    font-size:13px;
    color:#7c8a78;
    margin-top:2px;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="card">
      <p class="eyebrow">A〜G の7文字だけで挑戦</p>
      <h1>文字さがしクイズ</h1>
      <p class="hint">ヒント: 植物にあるもの／ローマ字3文字の日本語</p>

      <div class="tree-wrap">
        <svg id="tree" viewBox="0 0 150 150">
          <!-- trunk -->
          <line x1="75" y1="140" x2="75" y2="80" stroke="#7a5a3a" stroke-width="8" stroke-linecap="round"/>
          <!-- branches: added one per wrong guess -->
          <g id="branchGroup">
            <g class="branch-item" data-index="0">
              <line class="branch" style="--ox:75px;--oy:95px;--r0:-25deg" x1="75" y1="95" x2="45" y2="78"/>
              <circle class="leaf" cx="43" cy="75" r="9" fill="#f6d9df"/>
            </g>
            <g class="branch-item" data-index="1">
              <line class="branch" style="--ox:75px;--oy:95px;--r0:25deg" x1="75" y1="95" x2="105" y2="78"/>
              <circle class="leaf" cx="107" cy="75" r="9" fill="#f6d9df"/>
            </g>
            <g class="branch-item" data-index="2">
              <line class="branch" style="--ox:75px;--oy:110px;--r0:-20deg" x1="75" y1="110" x2="50" y2="98"/>
              <circle class="leaf" cx="48" cy="95" r="8" fill="#f6d9df"/>
            </g>
            <g class="branch-item" data-index="3">
              <line class="branch" style="--ox:75px;--oy:110px;--r0:20deg" x1="75" y1="110" x2="100" y2="98"/>
              <circle class="leaf" cx="102" cy="95" r="8" fill="#f6d9df"/>
            </g>
          </g>
        </svg>
      </div>

      <div class="blanks" id="blanks"></div>
      <div class="letters" id="letters"></div>
      <p class="status" id="status">&nbsp;</p>
      <p class="meta" id="meta"></p>
      <p class="answer-reveal hidden" id="answerReveal"></p>
      <button class="retry hidden" id="retry">もう一度あそぶ</button>
    </div>
  </div>

<script>
  const WORD = ['e','d','a'];       // 答え: eda (枝)
  const ANSWER_LABEL = '枝（えだ）＝ branch';
  const ALL_LETTERS = ['a','b','c','d','e','f','g'];
  const MAX_MISTAKES = ALL_LETTERS.length - WORD.length; // 4

  const blanksEl = document.getElementById('blanks');
  const lettersEl = document.getElementById('letters');
  const statusEl = document.getElementById('status');
  const metaEl = document.getElementById('meta');
  const retryEl = document.getElementById('retry');
  const answerRevealEl = document.getElementById('answerReveal');
  const branchItems = document.querySelectorAll('.branch-item');

  let correctSet, mistakes, over;

  function init(){
    correctSet = new Set();
    mistakes = 0;
    over = false;

    blanksEl.innerHTML = '';
    WORD.forEach((_, i) => {
      const d = document.createElement('div');
      d.className = 'blank';
      d.id = 'blank-' + i;
      blanksEl.appendChild(d);
    });

    lettersEl.innerHTML = '';
    ALL_LETTERS.forEach(letter => {
      const b = document.createElement('button');
      b.className = 'key';
      b.textContent = letter;
      b.addEventListener('click', () => guess(letter, b));
      lettersEl.appendChild(b);
    });

    branchItems.forEach(item => {
      item.querySelector('.branch').classList.remove('show');
      item.querySelector('.leaf').classList.remove('show');
    });

    statusEl.textContent = '\u00A0';
    statusEl.classList.remove('lose');
    metaEl.textContent = 'のこりミス回数: ' + MAX_MISTAKES;
    answerRevealEl.classList.add('hidden');
    retryEl.classList.add('hidden');
  }

  function guess(letter, btn){
    if (over) return;
    btn.disabled = true;

    if (WORD.includes(letter)){
      btn.classList.add('correct');
      WORD.forEach((l, i) => {
        if (l === letter){
          correctSet.add(i);
          const blank = document.getElementById('blank-' + i);
          blank.textContent = l;
          blank.classList.add('filled');
        }
      });
      if (correctSet.size === WORD.length){
        win();
      }
    } else {
      btn.classList.add('wrong');
      const item = branchItems[mistakes];
      if (item){
        item.querySelector('.branch').classList.add('show');
        setTimeout(() => item.querySelector('.leaf').classList.add('show'), 350);
      }
      mistakes++;
      metaEl.textContent = 'のこりミス回数: ' + (MAX_MISTAKES - mistakes);
      if (mistakes >= MAX_MISTAKES){
        lose();
      }
    }
  }

  function win(){
    over = true;
    statusEl.textContent = 'せいかい！ 🌸 「えだ」でした';
    metaEl.textContent = '';
    disableAll();
  }

  function lose(){
    over = true;
    statusEl.textContent = 'ミスが上限に達しました';
    statusEl.classList.add('lose');
    answerRevealEl.textContent = '答え: ' + ANSWER_LABEL;
    answerRevealEl.classList.remove('hidden');
    disableAll();
  }

  function disableAll(){
    document.querySelectorAll('.key').forEach(b => b.disabled = true);
    retryEl.classList.remove('hidden');
  }

  retryEl.addEventListener('click', init);

  init();
</script>
</body>
</html>
