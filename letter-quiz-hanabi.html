<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文字さがしクイズ - はなび</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@400;500&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1:#f2eee7;
    --bg-2:#e4dccb;
    --card:#fffcf6;
    --ink:#332c22;
    --night-1:#1c2340;
    --night-2:#0e1226;
    --fw1:#ff6b6b;
    --fw2:#ffd166;
    --fw3:#6bd3a3;
    --fw4:#7ea8ff;
    --fw5:#e08ae0;
    --cloud:#9aa4c2;
    --miss:#d97757;
    --line:#e7ddc8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(circle at 12% 8%, #fff9ee 0%, transparent 45%),
      radial-gradient(circle at 92% 88%, var(--bg-2) 0%, transparent 55%),
      linear-gradient(160deg, var(--bg-1), var(--bg-2));
    font-family:'Zen Maru Gothic', sans-serif;
    color:var(--ink);
    padding:32px 16px;
  }
  .stage{width:100%;max-width:520px;}
  .card{
    background:var(--card);
    border-radius:28px;
    padding:36px 30px 30px;
    box-shadow:0 20px 50px -20px rgba(30,20,10,0.3), 0 2px 0 rgba(255,255,255,0.7) inset;
    position:relative;
    overflow:hidden;
  }
  .eyebrow{
    font-size:12px;
    letter-spacing:0.14em;
    color:#a05a2c;
    font-weight:700;
    margin:0 0 6px;
  }
  h1{
    font-family:'Kiwi Maru', serif;
    font-size:26px;
    margin:0 0 4px;
    color:#3a2f1c;
  }
  .hint{
    font-size:14px;
    color:#7a6f57;
    margin:0 0 20px;
  }
  .scene-wrap{
    display:flex;
    justify-content:center;
    margin-bottom:14px;
  }
  #scene{
    width:100%;
    max-width:340px;
    height:190px;
    border-radius:20px;
    background:linear-gradient(180deg, var(--night-1), var(--night-2));
    overflow:hidden;
  }
  .star{fill:#fff; opacity:0.6;}
  .burst{opacity:0; transform:scale(0.4); transform-box:fill-box; transform-origin:center;
    transition:opacity .5s ease, transform .6s cubic-bezier(.2,1.4,.4,1);}
  .burst.show{opacity:1; transform:scale(1);}
  .burst-core{opacity:0; transition:opacity .5s ease .1s;}
  .burst.show .burst-core{opacity:1;}
  .cloud-piece{opacity:0; transition:opacity .4s ease, transform .5s ease;}
  .cloud-piece.show{opacity:0.9;}
  .rain-overlay{opacity:0; transition:opacity .6s ease;}
  .rain-overlay.show{opacity:0.5;}
  .drop2{opacity:0;}
  .rain-overlay.show .drop2{
    opacity:0.8;
    animation:fall2 1s linear infinite;
  }
  @keyframes fall2{
    0%{transform:translateY(-6px); opacity:0;}
    30%{opacity:0.8;}
    100%{transform:translateY(20px); opacity:0;}
  }
  .blanks{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;
    margin:16px 0 22px;
  }
  .blank{
    width:28px;
    text-align:center;
    font-family:'Kiwi Maru', serif;
    font-size:22px;
    font-weight:500;
    color:#3a2f1c;
    border-bottom:3px solid var(--line);
    padding-bottom:4px;
    transition:border-color .3s ease, transform .3s ease;
  }
  .blank.filled{
    border-color:#c9631f;
    animation:pop .35s ease;
  }
  @keyframes pop{
    0%{transform:scale(0.6);}
    60%{transform:scale(1.12);}
    100%{transform:scale(1);}
  }
  .letters{
    display:grid;
    grid-template-columns:repeat(7, 1fr);
    gap:8px;
    margin-bottom:18px;
  }
  .key{
    aspect-ratio:1/1;
    border-radius:14px;
    border:none;
    background:#fff;
    box-shadow:0 3px 0 var(--line), 0 6px 14px -8px rgba(60,40,10,0.25);
    font-family:'Zen Maru Gothic', sans-serif;
    font-weight:700;
    font-size:16px;
    color:#3a2f1c;
    cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease, background .2s ease, color .2s ease;
  }
  .key:hover:not(:disabled){transform:translateY(-2px);}
  .key:active:not(:disabled){transform:translateY(1px); box-shadow:0 1px 0 var(--line);}
  .key:disabled{cursor:default;}
  .key.correct{
    background:#c9631f;
    color:#fff;
    box-shadow:0 3px 0 #93461a;
  }
  .key.wrong{
    background:#e7e9f2;
    color:#6b729a;
    box-shadow:0 3px 0 #ccd0e2;
    opacity:0.75;
  }
  .status{
    min-height:22px;
    text-align:center;
    font-size:14.5px;
    font-weight:700;
    color:#a8501f;
    margin:0 0 6px;
  }
  .status.lose{color:var(--miss);}
  .meta{
    text-align:center;
    font-size:12.5px;
    color:#9a8b6a;
    margin:0 0 4px;
  }
  .retry{
    display:block;
    margin:14px auto 0;
    padding:10px 22px;
    border:none;
    border-radius:999px;
    background:#c9631f;
    color:#fff;
    font-family:'Zen Maru Gothic', sans-serif;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
    box-shadow:0 4px 0 #93461a;
  }
  .retry:active{transform:translateY(2px); box-shadow:0 2px 0 #93461a;}
  .hidden{display:none;}
  .answer-reveal{
    text-align:center;
    font-size:13px;
    color:#9a8b6a;
    margin-top:2px;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="card">
      <p class="eyebrow">A〜N の14文字だけで挑戦</p>
      <h1>文字さがしクイズ</h1>
      <p class="hint">ヒント: 夏祭りの夜空を彩るもの／ローマ字6文字の日本語</p>

      <div class="scene-wrap">
        <svg id="scene" viewBox="0 0 340 190">
          <circle class="star" cx="30" cy="20" r="1.4"/>
          <circle class="star" cx="60" cy="34" r="1"/>
          <circle class="star" cx="300" cy="150" r="1.2"/>
          <circle class="star" cx="20" cy="140" r="1"/>
          <circle class="star" cx="200" cy="18" r="1.2"/>
          <circle class="star" cx="150" cy="150" r="1"/>

          <!-- silhouette of town -->
          <rect x="0" y="168" width="340" height="22" fill="#0e1226"/>
          <rect x="20" y="150" width="18" height="20" fill="#0e1226"/>
          <rect x="45" y="158" width="14" height="12" fill="#0e1226"/>
          <rect x="280" y="152" width="16" height="18" fill="#0e1226"/>
          <rect x="300" y="160" width="12" height="10" fill="#0e1226"/>

          <!-- 5 fireworks, each unlocked by one distinct correct letter -->
          <g class="burst" id="burst0" transform="translate(70,70)">
            <circle class="burst-core" r="4" fill="#fff"/>
            <g stroke="#ff6b6b" stroke-width="3" stroke-linecap="round">
              <line x1="0" y1="0" x2="0" y2="-26"/><line x1="0" y1="0" x2="18" y2="-18"/>
              <line x1="0" y1="0" x2="26" y2="0"/><line x1="0" y1="0" x2="18" y2="18"/>
              <line x1="0" y1="0" x2="0" y2="26"/><line x1="0" y1="0" x2="-18" y2="18"/>
              <line x1="0" y1="0" x2="-26" y2="0"/><line x1="0" y1="0" x2="-18" y2="-18"/>
            </g>
          </g>
          <g class="burst" id="burst1" transform="translate(170,50)">
            <circle class="burst-core" r="4" fill="#fff"/>
            <g stroke="#ffd166" stroke-width="3" stroke-linecap="round">
              <line x1="0" y1="0" x2="0" y2="-24"/><line x1="0" y1="0" x2="17" y2="-17"/>
              <line x1="0" y1="0" x2="24" y2="0"/><line x1="0" y1="0" x2="17" y2="17"/>
              <line x1="0" y1="0" x2="0" y2="24"/><line x1="0" y1="0" x2="-17" y2="17"/>
              <line x1="0" y1="0" x2="-24" y2="0"/><line x1="0" y1="0" x2="-17" y2="-17"/>
            </g>
          </g>
          <g class="burst" id="burst2" transform="translate(260,75)">
            <circle class="burst-core" r="4" fill="#fff"/>
            <g stroke="#6bd3a3" stroke-width="3" stroke-linecap="round">
              <line x1="0" y1="0" x2="0" y2="-25"/><line x1="0" y1="0" x2="17" y2="-17"/>
              <line x1="0" y1="0" x2="25" y2="0"/><line x1="0" y1="0" x2="17" y2="17"/>
              <line x1="0" y1="0" x2="0" y2="25"/><line x1="0" y1="0" x2="-17" y2="17"/>
              <line x1="0" y1="0" x2="-25" y2="0"/><line x1="0" y1="0" x2="-17" y2="-17"/>
            </g>
          </g>
          <g class="burst" id="burst3" transform="translate(115,105)">
            <circle class="burst-core" r="3.5" fill="#fff"/>
            <g stroke="#7ea8ff" stroke-width="2.6" stroke-linecap="round">
              <line x1="0" y1="0" x2="0" y2="-20"/><line x1="0" y1="0" x2="14" y2="-14"/>
              <line x1="0" y1="0" x2="20" y2="0"/><line x1="0" y1="0" x2="14" y2="14"/>
              <line x1="0" y1="0" x2="0" y2="20"/><line x1="0" y1="0" x2="-14" y2="14"/>
              <line x1="0" y1="0" x2="-20" y2="0"/><line x1="0" y1="0" x2="-14" y2="-14"/>
            </g>
          </g>
          <g class="burst" id="burst4" transform="translate(215,100)">
            <circle class="burst-core" r="3.5" fill="#fff"/>
            <g stroke="#e08ae0" stroke-width="2.6" stroke-linecap="round">
              <line x1="0" y1="0" x2="0" y2="-20"/><line x1="0" y1="0" x2="14" y2="-14"/>
              <line x1="0" y1="0" x2="20" y2="0"/><line x1="0" y1="0" x2="14" y2="14"/>
              <line x1="0" y1="0" x2="0" y2="20"/><line x1="0" y1="0" x2="-14" y2="14"/>
              <line x1="0" y1="0" x2="-20" y2="0"/><line x1="0" y1="0" x2="-14" y2="-14"/>
            </g>
          </g>

          <!-- clouds, drift in per mistake -->
          <g id="clouds">
            <g class="cloud-piece" data-i="0" transform="translate(20,26)">
              <ellipse cx="0" cy="0" rx="20" ry="9" fill="#9aa4c2"/><ellipse cx="14" cy="-4" rx="12" ry="7" fill="#9aa4c2"/>
            </g>
            <g class="cloud-piece" data-i="1" transform="translate(300,22)">
              <ellipse cx="0" cy="0" rx="18" ry="8" fill="#9aa4c2"/><ellipse cx="-12" cy="-3" rx="10" ry="6" fill="#9aa4c2"/>
            </g>
            <g class="cloud-piece" data-i="2" transform="translate(90,20)">
              <ellipse cx="0" cy="0" rx="16" ry="7" fill="#9aa4c2"/>
            </g>
            <g class="cloud-piece" data-i="3" transform="translate(250,20)">
              <ellipse cx="0" cy="0" rx="16" ry="7" fill="#9aa4c2"/>
            </g>
            <g class="cloud-piece" data-i="4" transform="translate(170,14)">
              <ellipse cx="0" cy="0" rx="22" ry="9" fill="#838db0"/>
            </g>
            <g class="cloud-piece" data-i="5" transform="translate(50,40)">
              <ellipse cx="0" cy="0" rx="18" ry="8" fill="#838db0"/>
            </g>
            <g class="cloud-piece" data-i="6" transform="translate(270,42)">
              <ellipse cx="0" cy="0" rx="18" ry="8" fill="#838db0"/>
            </g>
            <g class="cloud-piece" data-i="7" transform="translate(150,30)">
              <ellipse cx="0" cy="0" rx="24" ry="10" fill="#6d76a0"/>
            </g>
            <g class="cloud-piece" data-i="8" transform="translate(170,55)">
              <ellipse cx="0" cy="0" rx="70" ry="20" fill="#565f8c"/>
            </g>
          </g>

          <!-- rain overlay on loss -->
          <g class="rain-overlay" id="rainOverlay">
            <rect x="0" y="0" width="340" height="190" fill="#3a4270"/>
            <line class="drop2" x1="40" y1="0" x2="36" y2="16" stroke="#bcd0ec" stroke-width="2"/>
            <line class="drop2" x1="90" y1="0" x2="86" y2="16" stroke="#bcd0ec" stroke-width="2" style="animation-delay:.2s"/>
            <line class="drop2" x1="140" y1="0" x2="136" y2="16" stroke="#bcd0ec" stroke-width="2" style="animation-delay:.4s"/>
            <line class="drop2" x1="190" y1="0" x2="186" y2="16" stroke="#bcd0ec" stroke-width="2" style="animation-delay:.1s"/>
            <line class="drop2" x1="240" y1="0" x2="236" y2="16" stroke="#bcd0ec" stroke-width="2" style="animation-delay:.3s"/>
            <line class="drop2" x1="290" y1="0" x2="286" y2="16" stroke="#bcd0ec" stroke-width="2" style="animation-delay:.5s"/>
          </g>
        </svg>
      </div>

      <div class="blanks" id="blanks"></div>
      <div class="letters" id="letters"></div>
      <p class="status" id="status">&nbsp;</p>
      <p class="meta" id="meta"></p>
      <p class="answer-reveal hidden" id="answerReveal"></p>
      <button class="retry hidden" id="retry">もう一度あそぶ</button>
    </div>
  </div>

<script>
  const WORD = ['h','a','n','a','b','i'];   // 答え: hanabi (はなび / 花火)
  const ANSWER_LABEL = '花火（はなび）＝ fireworks';
  const ALL_LETTERS = ['a','b','c','d','e','f','g','h','i','j','k','l','m','n'];
  const DISTINCT_CORRECT = [...new Set(WORD)];                 // h, a, n, b, i
  const MAX_MISTAKES = ALL_LETTERS.length - DISTINCT_CORRECT.length; // 9

  const blanksEl = document.getElementById('blanks');
  const lettersEl = document.getElementById('letters');
  const statusEl = document.getElementById('status');
  const metaEl = document.getElementById('meta');
  const retryEl = document.getElementById('retry');
  const answerRevealEl = document.getElementById('answerReveal');
  const rainOverlayEl = document.getElementById('rainOverlay');
  const burstEls = [0,1,2,3,4].map(i => document.getElementById('burst' + i));
  const cloudEls = document.querySelectorAll('.cloud-piece');

  let correctSet, mistakes, over, burstCount;

  function init(){
    correctSet = new Set();
    mistakes = 0;
    over = false;
    burstCount = 0;

    blanksEl.innerHTML = '';
    WORD.forEach((_, i) => {
      const d = document.createElement('div');
      d.className = 'blank';
      d.id = 'blank-' + i;
      blanksEl.appendChild(d);
    });

    lettersEl.innerHTML = '';
    ALL_LETTERS.forEach(letter => {
      const b = document.createElement('button');
      b.className = 'key';
      b.textContent = letter;
      b.addEventListener('click', () => guess(letter, b));
      lettersEl.appendChild(b);
    });

    burstEls.forEach(b => b.classList.remove('show'));
    cloudEls.forEach(c => c.classList.remove('show'));
    rainOverlayEl.classList.remove('show');

    statusEl.textContent = '\u00A0';
    statusEl.classList.remove('lose');
    metaEl.textContent = 'のこりミス回数: ' + MAX_MISTAKES;
    answerRevealEl.classList.add('hidden');
    retryEl.classList.add('hidden');
  }

  function launchNextBurst(){
    if (burstCount >= burstEls.length) return;
    burstEls[burstCount].classList.add('show');
    burstCount++;
  }

  function guess(letter, btn){
    if (over) return;
    btn.disabled = true;

    if (WORD.includes(letter)){
      btn.classList.add('correct');
      let firstTimeThisLetter = false;
      WORD.forEach((l, i) => {
        if (l === letter){
          if (!correctSet.has(i)) firstTimeThisLetter = true;
          correctSet.add(i);
          const blank = document.getElementById('blank-' + i);
          blank.textContent = l;
          blank.classList.add('filled');
        }
      });
      if (firstTimeThisLetter) launchNextBurst();
      if (correctSet.size === WORD.length){
        win();
      }
    } else {
      btn.classList.add('wrong');
      if (cloudEls[mistakes]) cloudEls[mistakes].classList.add('show');
      mistakes++;
      metaEl.textContent = 'のこりミス回数: ' + (MAX_MISTAKES - mistakes);
      if (mistakes >= MAX_MISTAKES){
        lose();
      }
    }
  }

  function win(){
    over = true;
    statusEl.textContent = 'せいかい！ 🎆 「はなび」でした';
    metaEl.textContent = '';
    disableAll();
  }

  function lose(){
    over = true;
    statusEl.textContent = '雨で花火大会は中止です';
    statusEl.classList.add('lose');
    rainOverlayEl.classList.add('show');
    answerRevealEl.textContent = '答え: ' + ANSWER_LABEL;
    answerRevealEl.classList.remove('hidden');
    disableAll();
  }

  function disableAll(){
    document.querySelectorAll('.key').forEach(b => b.disabled = true);
    retryEl.classList.remove('hidden');
  }

  retryEl.addEventListener('click', init);

  init();
</script>
</body>
</html>
