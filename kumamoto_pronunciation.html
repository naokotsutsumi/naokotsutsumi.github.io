<title>くまもと発音カード</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* Layout: sticky header with category tabs, then a grid of picture cards; tapping a card opens a large practice sheet. */
:root{
  --bg:#eef3f1; --surface:#ffffff; --ink:#1c2a2a; --muted:#5d6f6c; --line:#d5e0dc;
  --city:#2b74b0; --place:#2e8a55; --event:#d2602b; --accent:#2e8a55;
  --land:#dde5e1; --landline:#ffffff; --hl:#e86f35; --pin:#c4322b;
  --good:#2e8a55; --bad:#c4322b; --chip:#e3ebe8;
  --f-en:"Fredoka","Arial Rounded MT Bold","Segoe UI",system-ui,sans-serif;
  --f-ja:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Meiryo",system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141c1c; --surface:#1e2828; --ink:#e8efed; --muted:#9db0ac; --line:#304040;
  --city:#6aaee6; --place:#5cc28a; --event:#f08a57; --accent:#5cc28a;
  --land:#334242; --landline:#1e2828; --hl:#f08a57; --pin:#ff6b5f;
  --good:#5cc28a; --bad:#ff6b5f; --chip:#2a3636; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141c1c; --surface:#1e2828; --ink:#e8efed; --muted:#9db0ac; --line:#304040;
  --city:#6aaee6; --place:#5cc28a; --event:#f08a57; --accent:#5cc28a;
  --land:#334242; --landline:#1e2828; --hl:#f08a57; --pin:#ff6b5f;
  --good:#5cc28a; --bad:#ff6b5f; --chip:#2a3636; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ja);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1180px;margin:0 auto}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:12px 8px}
h1{margin:0;font-size:1.35rem;font-weight:700;text-wrap:balance}
.sub{margin:0;color:var(--muted);font-size:.82rem;font-family:var(--f-en);letter-spacing:.02em}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.tab{flex:none;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:700 .95rem var(--f-ja);padding:8px 14px;border-radius:999px;cursor:pointer}
.tab[aria-selected="true"]{border-color:var(--c);background:var(--c);color:var(--surface)}
.tab .n{font:600 .78rem var(--f-en);opacity:.75;margin-left:4px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-block:14px}
.sw{display:inline-flex;align-items:center;gap:6px;background:var(--chip);border-radius:999px;padding:6px 12px;font-size:.88rem;cursor:pointer;user-select:none}
.sw input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.seg{display:inline-flex;background:var(--chip);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:var(--ink);font:700 .85rem var(--f-ja);padding:5px 12px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgb(0 0 0 / .15)}
.btn{border:0;border-radius:999px;font:700 .95rem var(--f-ja);padding:9px 16px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;background:var(--c,var(--accent));color:var(--surface)}
.btn.ghost{background:var(--chip);color:var(--ink)}
.btn svg{width:18px;height:18px;fill:currentColor}
.spacer{flex:1}
:focus-visible{outline:3px solid var(--hl);outline-offset:2px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:14px;padding-bottom:40px}
.card{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:left;color:var(--ink);font:inherit;transition:transform .12s,border-color .12s}
.card:hover{border-color:var(--c)}
.card:active{transform:scale(.98)}
.card.playing{border-color:var(--hl);box-shadow:0 0 0 3px color-mix(in srgb,var(--hl) 35%,transparent)}
.pic{aspect-ratio:1;width:100%;max-width:100%;border-radius:10px;overflow:hidden;background:#fff;display:grid;place-items:center}
.pic img{width:100%;height:100%;object-fit:contain}
.pic.map{background:var(--surface)}
.pic svg{width:100%;height:100%}
.pic.txt{background:color-mix(in srgb,var(--c) 14%,var(--surface));border:2px dashed var(--c)}
.pic.txt span{font:700 1.35rem var(--f-ja);color:var(--ink);padding:10px;text-align:center;line-height:1.35}
.en{font:600 1.08rem/1.25 var(--f-en);overflow-wrap:anywhere}
.kana{font-size:.8rem;color:var(--muted);line-height:1.35}
.ja{font-size:.82rem;font-weight:700;color:var(--c)}
body.nokana .kana{display:none}
body.noja .ja{display:none}
.land{fill:var(--land);stroke:var(--landline);stroke-width:.8}
.hl{fill:var(--hl);stroke:var(--landline);stroke-width:.8}
.pinc{fill:var(--pin);stroke:#fff;stroke-width:2.2}

/* practice sheet */
.sheet{position:fixed;inset:0;z-index:20;background:rgb(10 20 20 / .55);display:grid;place-items:center;padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.panel{background:var(--surface);border-radius:20px;width:min(560px,100%);max-height:100%;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px;border-top:8px solid var(--c)}
.panel .pic{max-width:340px;margin:0 auto}
.panel .en{font-size:clamp(1.6rem,6vw,2.3rem);text-align:center}
.panel .kana{font-size:1rem;text-align:center}
.panel .ja{font-size:1rem;text-align:center}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.bigplay{font-size:1.15rem;padding:14px 26px}
.bigplay svg{width:24px;height:24px}
.close{align-self:flex-end;border:0;background:var(--chip);color:var(--ink);width:40px;height:40px;border-radius:50%;font:700 1.2rem var(--f-en);cursor:pointer}
.count{font:600 .85rem var(--f-en);color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}

/* quiz */
.quiz{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px;margin-bottom:40px}
.qhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.qhead h2{margin:0;font-size:1.15rem}
.score{font:600 1rem var(--f-en);font-variant-numeric:tabular-nums;color:var(--muted)}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:760px){.choices{grid-template-columns:repeat(4,minmax(0,1fr))}}
.choice{background:var(--surface);border:3px solid var(--line);border-radius:var(--r);padding:8px;cursor:pointer;display:flex;flex-direction:column;gap:6px;align-items:stretch;font:inherit;color:var(--ink)}
.choice .ja{font-size:1rem;text-align:center;color:var(--ink)}
.choice.textonly{min-height:96px;justify-content:center}
.choice.textonly .ja{font-size:1.4rem}
.choice.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.choice.wrong{border-color:var(--bad);opacity:.7}
.msg{min-height:1.6em;font-weight:700;text-align:center}
.msg.ok{color:var(--good)} .msg.ng{color:var(--bad)}
.catpick{display:flex;gap:6px;flex-wrap:wrap}
.note{color:var(--muted);font-size:.82rem;padding-bottom:24px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header>
  <div class="wrap">
    <div class="top">
      <div>
        <h1>くまもと発音カード</h1>
        <p class="sub">Unit 7 Welcome to Japan! ・ 新聞記事のことば</p>
      </div>
    </div>
    <div class="tabs" role="tablist" id="tabs"></div>
  </div>
</header>

<main class="wrap">
  <section id="cardsView">
    <div class="tools">

      <label class="sw" for="optJa"><input type="checkbox" id="optJa" checked>日本語</label>

      </div>
      <span class="spacer"></span>
      <button class="btn" id="playAll" type="button"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg><span>ぜんぶ聞いてまねする</span></button>
    </div>
    <div class="grid" id="grid"></div>
  </section>

  <section id="quizView" hidden>
    <div class="tools">
      <div class="catpick" id="quizCats"></div>
    </div>
    <div class="quiz">
      <div class="qhead">
        <h2>聞いて、えらぼう</h2>
        <span class="spacer"></span>
        <span class="score" id="qScore">0 / 0</span>
      </div>
      <div class="row">
        <button class="btn bigplay" id="qPlay" type="button"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"/></svg>もう一度聞く</button>
        <button class="btn ghost" id="qSlow" type="button">ゆっくり</button>
      </div>
      <div class="msg" id="qMsg">ボタンをおすと英語が流れます。</div>
      <div class="choices" id="qChoices"></div>
      <div class="row"><button class="btn ghost" id="qNext" type="button">つぎの問題</button></div>
    </div>
  </section>
  <p class="note">お手本の音声は端末の英語読み上げ機能を使っています。日本の地名は読み方が少しちがって聞こえることがあります。</p>
</main>

<div class="sheet" id="sheet" hidden>
  <div class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="pEn">
    <button class="close" id="pClose" type="button" aria-label="とじる">×</button>
    <div id="pPic"></div>
    <div class="en" id="pEn"></div>
    <div class="kana" id="pKana"></div>
    <div class="ja" id="pJa"></div>
    <div class="row">
      <button class="btn bigplay" id="pPlay" type="button"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"/></svg>聞く</button>
      <button class="btn ghost bigplay" id="pSlow" type="button">ゆっくり</button>
    </div>
    <div class="row">
      <button class="btn ghost" id="pPrev" type="button">← まえ</button>
      <span class="count" id="pCount"></span>
      <button class="btn ghost" id="pNext" type="button">つぎ →</button>
    </div>
  </div>
</div>

.1L273.1,317.0L273.7,318.3L273.3,322.0L274.9,323.1L271.8,325.5L269.1,328.6L267.8,328.6L266.7,330.8L267.6,337.0L267.3,338.0L270.0,340.9L271.0,343.6L270.5,344.8L272.3,348.6L268.8,352.7L271.5,354.4L274.5,354.0L276.0,357.2L275.8,359.3L277.0,361.6L279.1,363.3L284.4,369.6L282.9,372.7L280.9,374.4L280.6,376.2L282.8,378.2L284.3,377.9L286.0,380.3Z", "苓北町": "M51.7,235.8L45.6,239.2L44.1,240.9L41.2,242.8L38.1,243.8L36.4,245.5L29.8,245.8L27.0,243.5L26.6,241.9L28.1,238.5L24.5,237.9L20.7,240.8L25.0,244.0L27.4,245.0L27.5,247.2L28.8,247.8L30.3,251.4L30.9,254.2L28.9,254.7L27.3,259.3L28.3,259.9L28.2,262.8L25.3,266.6L22.3,272.3L23.0,273.3L27.8,273.7L29.1,274.3L33.4,272.3L39.8,272.3L41.7,273.4L43.7,275.9L44.9,275.8L45.1,272.2L44.6,268.3L41.3,265.2L43.0,261.2L45.7,257.4L48.2,257.5L51.7,253.1L52.0,249.8L50.9,249.1L51.3,246.6L52.8,245.2L52.4,243.7L54.2,239.8L51.8,237.2L51.7,235.8Z"}}};
/* 録音した音声に差し替えるとき：単語のid（c01, s01, e01 など）をキーにして、mp3 の data URI を入れます。
   例） "c07": "data:audio/mpeg;base64,...."   入っていない単語は端末の読み上げで再生します。 */
const RECORDED = {};

const CATS = [
  {key:"city",  label:"地名",               color:"var(--city)"},
  {key:"place", label:"場所・施設",          color:"var(--place)"},
  {key:"event", label:"イベント・体験・食べ物", color:"var(--event)"},
];
const words = DATA.words;
const byCat = k => words.filter(w => w.cat === k);
const catColor = k => (CATS.find(c => c.key === k) || CATS[0]).color;
let current = "city", rate = 1, playingAll = false;

function store(k, v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k, v);}catch(e){ return null; } }

/* ---------- map ---------- */
const svgNS = "http://www.w3.org/2000/svg";
(function buildMapSymbol(){
  const s = document.createElementNS(svgNS,"svg");
  s.setAttribute("width","0"); s.setAttribute("height","0"); s.style.position="absolute";
  let inner = `<defs><g id="kmap">`;
  for (const d of Object.values(DATA.map.paths)) inner += `<path class="land" d="${d}"/>`;
  inner += `</g></defs>`;
  s.innerHTML = inner; document.body.prepend(s);
})();
function mapSVG(w){
  const {w:W,h:H,paths} = DATA.map;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="熊本県の地図：${w.ja}"><use href="#kmap"/><path class="hl" d="${paths[w.muni]}"/><circle class="pinc" cx="${w.pin[0]}" cy="${w.pin[1]}" r="8"/></svg>`;
}
function picHTML(w){
  if (w.pic === "map") return `<div class="pic map">${mapSVG(w)}</div>`;
  if (w.pic === "text") return `<div class="pic txt"><span>${w.txt}</span></div>`;
  return `<div class="pic"><img src="${DATA.images[w.id]}" alt="${w.ja}"></div>`;
}

/* ---------- speech ---------- */
let voice = null;
function pickVoice(){
  const vs = speechSynthesis.getVoices();
  voice = vs.find(v => /Google US English/i.test(v.name))
       || vs.find(v => v.lang === "en-US" && /Samantha|Aria|Jenny|Zira/i.test(v.name))
       || vs.find(v => v.lang === "en-US") || vs.find(v => /^en/i.test(v.lang)) || null;
}
if ("speechSynthesis" in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
let audioEl = null;
function speak(w, r = rate){
  return new Promise(res => {
    try{ speechSynthesis.cancel(); }catch(e){}
    if (audioEl){ audioEl.pause(); audioEl = null; }
    if (RECORDED[w.id]){
      audioEl = new Audio(RECORDED[w.id]); audioEl.playbackRate = r;
      audioEl.onended = res; audioEl.onerror = res; audioEl.play().catch(res); return;
    }
    if (!("speechSynthesis" in window)){ res(); return; }
    const u = new SpeechSynthesisUtterance(w.say);
    u.lang = "en-US"; if (voice) u.voice = voice; u.rate = r * 0.9;
    u.onend = res; u.onerror = res;
    speechSynthesis.speak(u);
  });
}
const wait = ms => new Promise(r => setTimeout(r, ms));

/* ---------- tabs ---------- */
const tabsEl = document.getElementById("tabs");
const tabDefs = [...CATS.map(c => ({...c, n: byCat(c.key).length})), {key:"quiz", label:"聞いてえらぼう", color:"var(--ink)"}];
tabsEl.innerHTML = tabDefs.map(t => `<button class="tab" role="tab" id="tab-${t.key}" data-key="${t.key}" style="--c:${t.color}" aria-selected="false">${t.label}${t.n?`<span class="n">${t.n}</span>`:""}</button>`).join("");
tabsEl.addEventListener("click", e => { const b = e.target.closest(".tab"); if (b) show(b.dataset.key); });

function show(key){
  stopAll();
  current = key; store("kp_tab", key);
  for (const b of tabsEl.children) b.setAttribute("aria-selected", b.dataset.key === key);
  const isQuiz = key === "quiz";
  document.getElementById("cardsView").hidden = isQuiz;
  document.getElementById("quizView").hidden = !isQuiz;
  if (isQuiz) startQuiz(); else renderGrid();
}

/* ---------- grid ---------- */
const grid = document.getElementById("grid");
function renderGrid(){
  const list = byCat(current);
  grid.style.setProperty("--c", catColor(current));
  document.getElementById("playAll").style.setProperty("--c", catColor(current));
  grid.innerHTML = list.map((w,i) => `<button class="card" type="button" data-i="${i}" id="card-${w.id}">${picHTML(w)}<span class="en">${w.en}</span><span class="kana">${w.kana}</span><span class="ja">${w.ja}</span></button>`).join("");
}
grid.addEventListener("click", e => { const c = e.target.closest(".card"); if (c){ stopAll(); openSheet(+c.dataset.i); } });

/* ---------- options ---------- */
const optKana = document.getElementById("optKana"), optJa = document.getElementById("optJa");
function applyOpts(){ document.body.classList.toggle("nokana", !optKana.checked); document.body.classList.toggle("noja", !optJa.checked); store("kp_kana", optKana.checked?"1":"0"); store("kp_ja", optJa.checked?"1":"0"); }
optKana.addEventListener("change", applyOpts); optJa.addEventListener("change", applyOpts);
if (store("kp_kana") === "0") optKana.checked = false;
if (store("kp_ja") === "0") optJa.checked = false;
applyOpts();
document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => {
  rate = +b.dataset.rate;
  document.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-pressed", x === b));
}));

/* ---------- play all (listen & repeat) ---------- */
const playAllBtn = document.getElementById("playAll");
function stopAll(){
  playingAll = false;
  try{ speechSynthesis.cancel(); }catch(e){}
  if (audioEl){ audioEl.pause(); audioEl = null; }
  playAllBtn.querySelector("span").textContent = "ぜんぶ聞いてまねする";
  document.querySelectorAll(".card.playing").forEach(c => c.classList.remove("playing"));
}
playAllBtn.addEventListener("click", async () => {
  if (playingAll){ stopAll(); return; }
  playingAll = true; playAllBtn.querySelector("span").textContent = "とめる";
  const list = byCat(current);
  for (const w of list){
    if (!playingAll) break;
    const card = document.getElementById("card-"+w.id);
    document.querySelectorAll(".card.playing").forEach(c => c.classList.remove("playing"));
    card.classList.add("playing"); card.scrollIntoView({block:"center", behavior:"smooth"});
    const t0 = performance.now();
    await speak(w);
    const dur = performance.now() - t0;
    if (!playingAll) break;
    await wait(Math.max(1800, dur * 1.4 + 800)); /* まねして言う時間 */
  }
  stopAll();
});

/* ---------- practice sheet ---------- */
const sheet = document.getElementById("sheet");
let sIdx = 0;
function openSheet(i){
  sIdx = i; fillSheet(); sheet.hidden = false;
  document.getElementById("pPlay").focus();
  speak(byCat(current)[sIdx]);
}
function fillSheet(){
  const list = byCat(current), w = list[sIdx];
  document.getElementById("panel").style.setProperty("--c", catColor(current));
  document.getElementById("pPlay").style.setProperty("--c", catColor(current));
  document.getElementById("pPic").innerHTML = picHTML(w);
  document.getElementById("pEn").textContent = w.en;
  document.getElementById("pKana").textContent = w.kana;
  document.getElementById("pJa").textContent = w.ja;
  document.getElementById("pCount").textContent = `${sIdx+1} / ${list.length}`;
}
function step(d){ const n = byCat(current).length; sIdx = (sIdx + d + n) % n; fillSheet(); speak(byCat(current)[sIdx]); }
function closeSheet(){ sheet.hidden = true; stopAll(); }
document.getElementById("pPlay").onclick = () => speak(byCat(current)[sIdx]);
document.getElementById("pSlow").onclick = () => speak(byCat(current)[sIdx], 0.65);
document.getElementById("pPrev").onclick = () => step(-1);
document.getElementById("pNext").onclick = () => step(1);
document.getElementById("pClose").onclick = closeSheet;
sheet.addEventListener("click", e => { if (e.target === sheet) closeSheet(); });
document.addEventListener("keydown", e => {
  if (sheet.hidden) return;
  if (e.key === "Escape") closeSheet();
  if (e.key === "ArrowRight") step(1);
  if (e.key === "ArrowLeft") step(-1);
});

/* ---------- quiz ---------- */
let qCat = store("kp_qcat") || "city", qAns = null, qDone = false, qFirst = true, qRight = 0, qTotal = 0;
const qCatsEl = document.getElementById("quizCats");
function renderQuizCats(){
  qCatsEl.innerHTML = CATS.map(c => `<button class="tab" type="button" data-q="${c.key}" style="--c:${c.color}" aria-selected="${c.key===qCat}">${c.label}</button>`).join("");
}
qCatsEl.addEventListener("click", e => { const b = e.target.closest("[data-q]"); if (!b) return; qCat = b.dataset.q; store("kp_qcat", qCat); qRight = qTotal = 0; renderQuizCats(); nextQ(); });
function shuffle(a){ for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function startQuiz(){ renderQuizCats(); nextQ(false); }
function nextQ(autoPlay = true){
  const pool = byCat(qCat);
  const prev = qAns;
  do { qAns = pool[Math.floor(Math.random()*pool.length)]; } while (pool.length > 1 && prev && qAns.id === prev.id);
  const opts = shuffle([qAns, ...shuffle(pool.filter(w => w.id !== qAns.id)).slice(0,3)]);
  qDone = false; qFirst = true;
  const msg = document.getElementById("qMsg"); msg.className = "msg"; msg.textContent = autoPlay ? "聞こえたものをえらんでね。" : "「もう一度聞く」をおすと英語が流れます。";
  document.getElementById("qPlay").style.setProperty("--c", catColor(qCat));
  document.getElementById("qChoices").innerHTML = opts.map(w => {
    const textOnly = w.pic === "map";
    return `<button class="choice${textOnly?" textonly":""}" type="button" data-id="${w.id}">${textOnly?"":picHTML(w)}<span class="ja">${w.ja}</span></button>`;
  }).join("");
  document.getElementById("qScore").textContent = `${qRight} / ${qTotal}`;
  if (autoPlay) speak(qAns);
}
document.getElementById("qChoices").addEventListener("click", e => {
  const b = e.target.closest(".choice"); if (!b || qDone) return;
  const msg = document.getElementById("qMsg");
  const correct = b.dataset.id === qAns.id;
  if (qFirst){ qTotal++; if (correct) qRight++; qFirst = false; }  /* 1回目でせいかいした数を数える */
  if (correct){
    qDone = true;
    b.classList.add("right"); msg.className = "msg ok"; msg.textContent = `せいかい！ ${qAns.en}`;
  } else {
    b.classList.add("wrong"); msg.className = "msg ng"; msg.textContent = "もう一度聞いてみよう。";
    speak(qAns);
  }
  document.getElementById("qScore").textContent = `${qRight} / ${qTotal}`;
});
document.getElementById("qPlay").onclick = () => { if (qAns) speak(qAns); };
document.getElementById("qSlow").onclick = () => { if (qAns) speak(qAns, 0.65); };
document.getElementById("qNext").onclick = () => nextQ(true);

/* start */
let startTab = store("kp_tab");
if (!tabDefs.some(t => t.key === startTab)) startTab = "city";
show(startTab);
</script>
