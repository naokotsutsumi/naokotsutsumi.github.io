<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>動詞たんごミニテスト(6年生版)</title>
<style>
  body {
    font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
    background: #fef9f0;
    margin: 0;
    padding: 16px;
    color: #333;
  }
  h1 {
    text-align: center;
    color: #e67e22;
    font-size: 1.5em;
    margin-bottom: 4px;
  }
  .subtitle {
    text-align: center;
    color: #888;
    margin-bottom: 16px;
    font-size: 0.9em;
  }
  #scoreResult {
    text-align: center;
    font-size: 1.2em;
    font-weight: bold;
    min-height: 1.6em;
    margin-bottom: 12px;
    padding: 10px;
    border-radius: 12px;
  }
  #scoreResult.correct { background: #d4f4dd; color: #1e7d32; }
  #scoreResult.incorrect { background: #fde0e0; color: #c0392b; }
  .question {
    background: white;
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 16px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    border: 3px solid transparent;
  }
  .question.wrong {
    border-color: #e74c3c;
  }
  .qheader {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }
  .qnum {
    font-weight: bold;
    color: #e67e22;
    font-size: 1.1em;
  }
  .playBtn {
    background: #3498db;
    color: white;
    border: none;
    border-radius: 50%;
    width: 48px;
    height: 48px;
    font-size: 1.4em;
    cursor: pointer;
  }
  .playBtn:active { background: #2980b9; }
  .choices {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
  }
  .choice {
    cursor: pointer;
    border: 3px solid #ddd;
    border-radius: 10px;
    padding: 4px;
    text-align: center;
    transition: border-color 0.2s;
    position: relative;
  }
  .choice img {
    width: 100%;
    height: auto;
    border-radius: 6px;
    display: block;
  }
  .choice.selected {
    border-color: #3498db;
    background: #eaf5ff;
  }
  #gradeBtn {
    display: block;
    width: 100%;
    padding: 16px;
    font-size: 1.2em;
    font-weight: bold;
    background: #e67e22;
    color: white;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    margin-top: 8px;
  }
  #gradeBtn:active { background: #d35400; }
  @media (max-width: 600px) {
    .choices { grid-template-columns: repeat(3, 1fr); }
  }
</style>
</head>
<body>

const WORDS = ["enjoy", "stop", "save", "visit", "ride", "come", "get", "watch", "read", "talk", "wear", "help", "practice", "work", "join", "study", "clean", "speak", "make"];
const EXCLUDE_PAIRS = [["speak","talk"]];

function areExcluded(a, b) {
  return EXCLUDE_PAIRS.some(pair => pair.includes(a) && pair.includes(b));
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Build quiz order (shuffled) and answer choices per question
const quizOrder = shuffle(WORDS);
const questionData = quizOrder.map(correctWord => {
  const pool = WORDS.filter(w => w !== correctWord && !areExcluded(w, correctWord));
  const dummies = shuffle(pool).slice(0, 4);
  const choices = shuffle([correctWord, ...dummies]);
  return { correctWord, choices };
});

let currentAudio = null;
let currentTimeouts = [];

function stopAllAudio() {
  if (currentAudio) {
    currentAudio.pause();
    currentAudio.currentTime = 0;
    currentAudio.onended = null;
  }
  currentTimeouts.forEach(t => clearTimeout(t));
  currentTimeouts = [];
}

function playWord(word) {
  stopAllAudio();
  const audio = new Audio(DATA[word].audio);
  currentAudio = audio;
  audio.play();
  audio.onended = () => {
    const t = setTimeout(() => {
      audio.currentTime = 0;
      audio.play();
      audio.onended = null;
    }, 500);
    currentTimeouts.push(t);
  };
}

function selectChoice(qIndex, word) {
  const qDiv = document.getElementById('q' + qIndex);
  qDiv.querySelectorAll('.choice').forEach(c => c.classList.remove('selected'));
  const chosen = qDiv.querySelector('[data-word="' + word + '"]');
  chosen.classList.add('selected');
  qDiv.dataset.selected = word;
}

function renderQuiz() {
  const quizDiv = document.getElementById('quiz');
  questionData.forEach((q, i) => {
    const qDiv = document.createElement('div');
    qDiv.className = 'question';
    qDiv.id = 'q' + i;

    const header = document.createElement('div');
    header.className = 'qheader';
    const qnum = document.createElement('span');
    qnum.className = 'qnum';
    qnum.textContent = (i + 1) + '.';
    const playBtn = document.createElement('button');
    playBtn.className = 'playBtn';
    playBtn.textContent = '▶';
    playBtn.onclick = () => playWord(q.correctWord);
    header.appendChild(qnum);
    header.appendChild(playBtn);
    qDiv.appendChild(header);

    const choicesDiv = document.createElement('div');
    choicesDiv.className = 'choices';
    q.choices.forEach(word => {
      const choiceDiv = document.createElement('div');
      choiceDiv.className = 'choice';
      choiceDiv.dataset.word = word;
      choiceDiv.onclick = () => selectChoice(i, word);
      const img = document.createElement('img');
      img.src = DATA[word].img;
      choiceDiv.appendChild(img);
      choicesDiv.appendChild(choiceDiv);
    });
    qDiv.appendChild(choicesDiv);
    quizDiv.appendChild(qDiv);
  });
}

let graded = false;

function gradeQuiz() {
  let correctCount = 0;
  questionData.forEach((q, i) => {
    const qDiv = document.getElementById('q' + i);
    qDiv.classList.remove('wrong');
    const selected = qDiv.dataset.selected;
    if (selected === q.correctWord) {
      correctCount++;
    } else {
      qDiv.classList.add('wrong');
    }
  });

  const resultDiv = document.getElementById('scoreResult');
  const total = questionData.length;
  resultDiv.textContent = correctCount + ' / ' + total + '問正解';
  if (correctCount === total) {
    resultDiv.classList.add('correct');
    resultDiv.classList.remove('incorrect');
    resultDiv.textContent += ' — 全問正解だよ。正しくおぼえたね';
  } else {
    resultDiv.classList.add('incorrect');
    resultDiv.classList.remove('correct');
    resultDiv.textContent += ' — まちがえた問題をもう一度聞き直し、とき直そう';
  }

  document.getElementById('gradeBtn').textContent = 'もう一度 採点する';
  window.scrollTo({ top: 0, behavior: 'smooth' });
  graded = true;
}

renderQuiz();
</script>
