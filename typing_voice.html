<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>えいたんご タイピング（音声つき）</title>
<style>
  :root{
    --pink:#ff6fa5; --blue:#4fc3f7; --yellow:#ffd54f; --green:#66bb6a;
    --purple:#ba68c8; --bg1:#fff6e9; --bg2:#e3f6ff; --ink:#3a3a3a; --red:#e05c5c;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; width:100%; min-height:100%;
    font-family:"Hiragino Maru Gothic ProN","Comic Sans MS","Trebuchet MS",sans-serif;
    background:linear-gradient(160deg,var(--bg2),var(--bg1));
    color:var(--ink);
  }
  #app{ width:100%; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:24px 16px 60px; }

  h1.title{ font-size:1.8rem; color:var(--pink); text-shadow:2px 2px 0 #fff; margin:0 0 6px; text-align:center; }
  .subtitle{ color:#888; font-size:0.9rem; margin-bottom:22px; text-align:center; }

  .card{
    background:#fff; border-radius:26px; padding:32px 28px; width:100%; max-width:560px;
    box-shadow:0 8px 24px rgba(0,0,0,0.1);
  }

  /* ---- start screen ---- */
  .field-block{ margin-bottom:22px; }
  .field-block label.group-label{ display:block; font-weight:bold; color:#c98a2b; font-size:0.95rem; margin-bottom:10px; }
  .option-row{ display:flex; flex-wrap:wrap; gap:10px; }
  #countRow .option-btn{ flex:1 1 calc(50% - 10px); min-width:110px; }
  .option-btn{
    flex:1; min-width:140px; background:#fff; border:3px solid #ffe3b0; border-radius:16px;
    padding:14px 12px; font-size:0.95rem; font-weight:bold; color:var(--ink); cursor:pointer;
    font-family:inherit; transition:background .15s, border-color .15s; text-align:center;
  }
  .option-btn:hover{ background:#fff3e0; border-color:#ffcf7a; }
  .option-btn.selected{ background:var(--pink); border-color:var(--pink); color:#fff; }
  .option-btn .opt-sub{ display:block; font-size:0.75rem; font-weight:normal; opacity:0.85; margin-top:2px; }

  select#genreSelect{
    width:100%; font-size:1rem; padding:12px 14px; border-radius:14px; border:3px solid #ffe3b0;
    font-family:inherit; color:var(--ink); background:#fff; outline:none;
  }
  select#genreSelect:focus{ border-color:var(--pink); }

  .start-btn{
    width:100%; border:none; background:var(--pink); color:#fff; font-size:1.2rem; font-weight:bold;
    padding:18px; border-radius:20px; cursor:pointer; box-shadow:0 5px 0 #d94f86;
    font-family:inherit; margin-top:6px; transition:background .15s;
  }
  .start-btn:hover{ background:#ff85b3; }
  .start-btn:active{ transform:translateY(4px); box-shadow:0 1px 0 #d94f86; }
  .start-btn:disabled{ background:#ddd; box-shadow:0 5px 0 #bbb; cursor:default; }
  .word-count-note{ font-size:0.8rem; color:#999; margin-top:8px; text-align:center; }

  /* ---- play screen ---- */
  .play-top{ display:flex; justify-content:space-between; align-items:center; width:100%; max-width:560px; margin-bottom:14px; font-size:0.9rem; color:#888; }
  .progress-pill{ background:#fff; border-radius:14px; padding:6px 14px; font-weight:bold; color:var(--pink); box-shadow:0 2px 0 rgba(0,0,0,0.06); }
  .timer-pill{ background:#fff; border-radius:14px; padding:6px 14px; font-weight:bold; color:#4a90a4; box-shadow:0 2px 0 rgba(0,0,0,0.06); }

  .prompt-box{ text-align:center; margin-bottom:22px; }
  .prompt-genre{ font-size:0.78rem; color:#aaa; margin-bottom:8px; }
  .prompt-main{ font-size:2rem; font-weight:bold; color:var(--ink); line-height:1.4; word-break:break-word; }
  .prompt-main.word-mode{ color:var(--pink); font-size:2.4rem; letter-spacing:1px; }
  .prompt-kana{ font-size:1rem; color:#e07b3f; margin-top:6px; }

  .type-display{
    font-size:2.2rem; font-weight:bold; letter-spacing:2px; text-align:center;
    min-height:60px; padding:14px; border-radius:16px; background:#f7f7f7; margin-bottom:16px;
    word-break:break-all; font-family:"Trebuchet MS","Comic Sans MS",monospace,sans-serif;
  }
  .type-display .ch-correct{ color:var(--green); }
  .type-display .ch-wrong{ color:#fff; background:var(--red); border-radius:6px; padding:0 2px; }
  .type-display .ch-pending{ color:#ccc; }
  .type-display .cursor{ display:inline-block; width:2px; background:var(--pink); animation:blink 1s step-end infinite; }
  @keyframes blink{ 50%{ opacity:0; } }

  #hiddenInput{
    position:absolute; opacity:0; width:1px; height:1px; pointer-events:none;
  }
  .tap-hint{ text-align:center; color:#bbb; font-size:0.85rem; margin-bottom:10px; }

  .feedback-banner{
    text-align:center; font-size:1.3rem; font-weight:bold; border-radius:16px; padding:12px; margin-bottom:14px;
    display:none;
  }
  .feedback-banner.show-correct{ display:block; background:#e9f9ec; color:#3a9a52; }
  .feedback-banner.show-wrong{ display:block; background:#fdeaea; color:#c94b4b; }
  .feedback-banner .correct-answer{ font-size:1rem; font-weight:normal; margin-top:4px; }

  .play-btn-row{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  .mini-btn{
    border:none; border-radius:14px; padding:10px 18px; font-size:0.9rem; font-weight:bold; cursor:pointer;
    font-family:inherit; transition:background .15s;
  }
  .mini-btn.hint{ background:var(--yellow); color:#7a5b00; box-shadow:0 3px 0 #e0b93d; }
  .mini-btn.hint:hover{ background:#ffe082; }
  .mini-btn.skip{ background:#f2f2f2; color:#888; box-shadow:0 3px 0 #d8d8d8; }
  .mini-btn.skip:hover{ background:#e8e8e8; }
  .mini-btn.next{ background:var(--blue); color:#fff; box-shadow:0 3px 0 #2f9fd6; }
  .mini-btn.next:hover{ background:#3fb6ea; }
  .mini-btn:active{ transform:translateY(3px); box-shadow:0 0 0 transparent; }
  .mini-btn:disabled{ opacity:0.4; cursor:default; }

  .hint-text{ text-align:center; color:#c98a2b; font-size:1rem; margin-bottom:10px; min-height:1.4em; }

  /* ---- result screen ---- */
  .result-score-row{ display:flex; gap:14px; justify-content:center; margin-bottom:22px; flex-wrap:wrap; }
  .result-stat{ background:var(--bg1); border-radius:18px; padding:16px 22px; text-align:center; min-width:110px; }
  .result-stat .num{ font-size:1.8rem; font-weight:bold; color:var(--pink); }
  .result-stat .label{ font-size:0.78rem; color:#999; margin-top:2px; }

  .miss-list{ margin-bottom:20px; }
  .miss-list h3{ font-size:1rem; color:#c98a2b; margin-bottom:10px; }
  .miss-item{
    display:flex; justify-content:space-between; align-items:center; background:#fff9ec;
    border-radius:12px; padding:10px 14px; margin-bottom:6px; font-size:0.95rem;
  }
  .miss-item .miss-word{ font-weight:bold; color:var(--ink); }
  .miss-item .miss-meaning{ color:#888; font-size:0.85rem; }
  .miss-item .miss-tag{ font-size:0.72rem; padding:3px 10px; border-radius:10px; font-weight:bold; }
  .miss-item .miss-tag.wrong{ background:#fdeaea; color:#c94b4b; }
  .miss-item .miss-tag.hint{ background:#fff6da; color:#a3810a; }
  .miss-item .miss-tag.skip{ background:#f0f0f0; color:#888; }

  .result-btn-row{ display:flex; gap:10px; flex-wrap:wrap; }
  .result-btn-row .modal-btn{
    flex:1; min-width:140px; border:none; border-radius:16px; padding:14px; font-size:0.95rem; font-weight:bold;
    cursor:pointer; font-family:inherit;
  }
  .result-btn-row .primary{ background:var(--pink); color:#fff; box-shadow:0 4px 0 #d94f86; }
  .result-btn-row .secondary{ background:#f2f2f2; color:#777; box-shadow:0 4px 0 #d8d8d8; }
  .empty-miss{ text-align:center; color:#3a9a52; font-weight:bold; padding:14px; }

  .hidden{ display:none !important; }

  .speak-btn{
    border:none; background:var(--blue); color:#fff; width:64px; height:64px; border-radius:50%;
    font-size:1.8rem; cursor:pointer; box-shadow:0 4px 0 #2f9fd6; transition:background .15s;
    display:block; margin:0 auto 18px;
  }
  .speak-btn:hover{ background:#3fb6ea; }
  .speak-btn:active{ transform:translateY(3px); box-shadow:0 1px 0 #2f9fd6; }
  .speak-btn.playing{ animation:pulse 0.6s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.08); } }
  .tts-note{ text-align:center; font-size:0.75rem; color:#bbb; margin-top:-10px; margin-bottom:14px; }

  .quit-btn{
    background:none; border:none; color:#bbb; font-size:0.85rem; cursor:pointer; font-family:inherit;
    padding:6px 10px; border-radius:12px; transition:background .15s, color .15s;
  }
  .quit-btn:hover{ background:#fdeaea; color:#c94b4b; }

  @media (max-width:480px){
    h1.title{ font-size:1.4rem; }
    .prompt-main{ font-size:1.6rem; }
    .prompt-main.word-mode{ font-size:1.9rem; }
    .type-display{ font-size:1.7rem; }
    .card{ padding:24px 18px; }
  }
</style>
</head>
<body>
<div id="app">
  <h1 class="title">⌨️ えいたんご タイピング</h1>
  <div class="subtitle">おとを 聞いて、キーボードで うちこもう！</div>

  <!-- ================= START SCREEN ================= -->
  <div class="card" id="startScreen">
    <div class="field-block">
      <label class="group-label">🎯 どちらの もんだいで れんしゅうする？</label>
      <div class="option-row" id="modeRow">
        <button type="button" class="option-btn" data-mode="meaning">①意味と発音を聞いて うつ<span class="opt-sub">日本語の意味＋おと → えいご</span></button>
        <button type="button" class="option-btn" data-mode="word">②つづりと音声を聞いて うつ<span class="opt-sub">えいごを見ながら＋おと → うつ</span></button>
      </div>
    </div>

    <div class="field-block">
      <label class="group-label">📚 ジャンル</label>
      <select id="genreSelect"><option value="">ぜんぶ（すべてのジャンル）</option></select>
    </div>

    <div class="field-block">
      <label class="group-label">🔢 もんだい数</label>
      <div class="option-row" id="countRow">
        <button type="button" class="option-btn" data-count="10">10問</button>
        <button type="button" class="option-btn" data-count="20">20問</button>
        <button type="button" class="option-btn" data-count="30">30問</button>
        <button type="button" class="option-btn" data-count="0">ぜんぶ</button>
      </div>
      <div class="word-count-note" id="countNote"></div>
    </div>

    <button type="button" class="start-btn" id="startBtn" disabled>スタート！</button>
  </div>

  <!-- ================= PLAY SCREEN ================= -->
  <div class="card hidden" id="playScreen">
    <div class="play-top">
      <span class="progress-pill" id="progressPill">1 / 10</span>
      <div style="display:flex; align-items:center; gap:10px;">
        <span class="timer-pill" id="timerPill">⏱ 0:00</span>
        <button type="button" class="quit-btn" id="quitBtn">✕ やめる</button>
      </div>
    </div>

    <div class="prompt-box">
      <div class="prompt-genre" id="promptGenre"></div>
      <div class="prompt-main" id="promptMain"></div>
      <div class="prompt-kana" id="promptKana"></div>
    </div>

    <button type="button" class="speak-btn" id="speakBtn">🔊</button>
    <div class="tts-note">※ ブラウザの読み上げ機能を使っています</div>

    <div class="type-display" id="typeDisplay"></div>
    <input type="text" id="hiddenInput" autocomplete="off" autocapitalize="off" spellcheck="false">
    <div class="tap-hint" id="tapHint">画面をタップして、キーボードでうちはじめよう</div>

    <div class="hint-text" id="hintText"></div>

    <div class="feedback-banner" id="feedbackBanner"></div>

    <div class="play-btn-row">
      <button type="button" class="mini-btn hint" id="hintBtn">💡 ヒント</button>
      <button type="button" class="mini-btn skip" id="skipBtn">⏭ スキップ</button>
      <button type="button" class="mini-btn next hidden" id="nextBtn">つぎへ →</button>
    </div>
  </div>

  <!-- ================= RESULT SCREEN ================= -->
  <div class="card hidden" id="resultScreen">
    <h1 class="title" style="font-size:1.5rem;">🎉 けっか</h1>
    <div class="result-score-row">
      <div class="result-stat"><div class="num" id="resCorrect">0</div><div class="label">1かいで せいかい</div></div>
      <div class="result-stat"><div class="num" id="resTotal">0</div><div class="label">もんだい数</div></div>
      <div class="result-stat"><div class="num" id="resTime">0:00</div><div class="label">かかった時間</div></div>
    </div>

    <div class="miss-list" id="missListWrap">
      <h3>📖 もう一度 見ておきたい ことば</h3>
      <div id="missList"></div>
    </div>

    <div class="result-btn-row">
      <button type="button" class="modal-btn primary hidden" id="retryMissBtn">まちがえた語だけ もう一度</button>
      <button type="button" class="modal-btn secondary" id="restartSameBtn">同じ 設定で もう一度</button>
      <button type="button" class="modal-btn secondary" id="backToStartBtn">設定に もどる</button>
    </div>
  </div>
</div>

/* ================= Utility ================= */
function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function formatTime(sec){
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return `${m}:${String(s).padStart(2,'0')}`;
}

GENRES.forEach(g => {

  opt.value = g;

  genreSelect.appendChild(opt);
});

function poolForGenre(){

}

/* ================= Screens ================= */
const startScreen = document.getElementById('startScreen');
const playScreen = document.getElementById('playScreen');
const resultScreen = document.getElementById('resultScreen');
function showScreen(el){
  [startScreen, playScreen, resultScreen].forEach(s => s.classList.add('hidden'));
  el.classList.remove('hidden');
}

/* ================= Game state ================= */
let queue = [];       // words for this round
let qIndex = 0;
let typed = '';
let usedHintThisWord = false;
let hadWrongAttemptThisWord = false;
let results = [];     // {entry, status: 'correct'|'hint'|'wrong'|'skip'}
let startTime = null;
let timerHandle = null;
let currentMode = 'meaning';
let awaitingNext = false;

const progressPill = document.getElementById('progressPill');
const timerPill = document.getElementById('timerPill');
const promptGenre = document.getElementById('promptGenre');
const promptMain = document.getElementById('promptMain');
const promptKana = document.getElementById('promptKana');
const typeDisplay = document.getElementById('typeDisplay');
const hiddenInput = document.getElementById('hiddenInput');
const tapHint = document.getElementById('tapHint');
const hintText = document.getElementById('hintText');
const feedbackBanner = document.getElementById('feedbackBanner');
const hintBtn = document.getElementById('hintBtn');
const skipBtn = document.getElementById('skipBtn');
const nextBtn = document.getElementById('nextBtn');
const speakBtn = document.getElementById('speakBtn');

/* ================= Text-to-speech (no real audio files available) ================= */
let ttsVoice = null;
function pickVoice(){
  const voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
  ttsVoice = voices.find(v => v.lang === 'en-US') || voices.find(v => v.lang && v.lang.startsWith('en')) || null;
}
if(window.speechSynthesis){
  pickVoice();
  window.speechSynthesis.onvoiceschanged = pickVoice;
}

function speakCurrentWord(){
  if(!window.speechSynthesis) return;
  const entry = queue[qIndex];
  if(!entry) return;
  window.speechSynthesis.cancel();
  speakBtn.classList.add('playing');
  const stopPlaying = () => speakBtn.classList.remove('playing');
  const utter1 = new SpeechSynthesisUtterance(entry.w);
  utter1.lang = 'en-US';
  utter1.rate = 0.85;
  if(ttsVoice) utter1.voice = ttsVoice;
  utter1.onerror = stopPlaying;
  const utter2 = new SpeechSynthesisUtterance(entry.w);
  utter2.lang = 'en-US';
  utter2.rate = 0.85;
  if(ttsVoice) utter2.voice = ttsVoice;
  utter2.onend = stopPlaying;
  utter2.onerror = stopPlaying;
  window.speechSynthesis.speak(utter1);
  window.speechSynthesis.speak(utter2);
  setTimeout(stopPlaying, 3500); // 保険: onendが発火しない環境でもボタンのアニメーションを止める
}
speakBtn.addEventListener('click', speakCurrentWord);

/* ---- quit mid-round ---- */
const quitBtn = document.getElementById('quitBtn');
quitBtn.addEventListener('click', () => {
  if(confirm('とちゅうで やめますか？\n（ここまでの きろくは のこりません）')){
    if(window.speechSynthesis) window.speechSynthesis.cancel();
    stopTimer();
    showScreen(startScreen);
  }
});

startBtn.addEventListener('click', () => {
  const pool = poolForGenre();
  const n = selectedCount === 0 ? pool.length : Math.min(selectedCount, pool.length);
  queue = shuffle(pool).slice(0, n);
  currentMode = selectedMode;
  startRound();
});

function startRound(){
  qIndex = 0;
  results = [];
  startTime = Date.now();
  showScreen(playScreen);
  startTimer();
  loadQuestion();
}

function startTimer(){
  stopTimer();
  timerHandle = setInterval(() => {
    const sec = Math.floor((Date.now() - startTime) / 1000);
    timerPill.textContent = `⏱ ${formatTime(sec)}`;
  }, 500);
}
function stopTimer(){ if(timerHandle){ clearInterval(timerHandle); timerHandle = null; } }

function loadQuestion(){
  awaitingNext = false;
  typed = '';
  usedHintThisWord = false;
  hadWrongAttemptThisWord = false;
  hintText.textContent = '';
  feedbackBanner.className = 'feedback-banner';
  feedbackBanner.textContent = '';
  skipBtn.classList.remove('hidden');
  nextBtn.classList.add('hidden');

  const entry = queue[qIndex];
  progressPill.textContent = `${qIndex + 1} / ${queue.length}`;

  if(currentMode === 'meaning'){
    promptGenre.textContent = entry.g || '';
    promptMain.textContent = entry.m;
    promptMain.className = 'prompt-main';
    promptKana.textContent = '';
    hintBtn.classList.remove('hidden');
    hintBtn.disabled = false;
  } else {
    promptGenre.textContent = entry.g || '';
    promptMain.textContent = entry.w;
    promptMain.className = 'prompt-main word-mode';
    promptKana.textContent = entry.k ? `よみかた: ${entry.k}` : '';
    hintBtn.classList.add('hidden');
  }

  renderTypeDisplay();
  hiddenInput.value = '';
  speakCurrentWord();
  focusInput();
}

function focusInput(){
  hiddenInput.focus();
}

function currentTarget(){
  return queue[qIndex].w.toLowerCase();
}

function renderTypeDisplay(){
  const target = currentTarget();
  let html = '';
  for(let i = 0; i < target.length; i++){
    const tch = target[i];
    if(i < typed.length){
      const uch = typed[i].toLowerCase();
      if(uch === tch){ html += `<span class="ch-correct">${escapeHtml(target[i])}</span>`; }
      else{ html += `<span class="ch-wrong">${escapeHtml(target[i])}</span>`; }
    } else if(i === typed.length){
      html += `<span class="ch-pending cursor">${escapeHtml(target[i])}</span>`;
    } else {
      html += `<span class="ch-pending">${escapeHtml(target[i])}</span>`;
    }
  }
  typeDisplay.innerHTML = html;
}

hiddenInput.addEventListener('input', () => {
  if(awaitingNext) return;
  const raw = hiddenInput.value;
  // keep letters, spaces, hyphens and apostrophes (many words are compound: "hot dog", "twenty-one")
  const target = currentTarget();
  typed = raw.replace(/[^a-zA-Z \-']/g, '').slice(0, target.length + 5);
  renderTypeDisplay();

  if(typed.length >= target.length){
    if(typed.toLowerCase() === target){
      let status;
      if(usedHintThisWord) status = 'hint';
      else if(hadWrongAttemptThisWord) status = 'corrected';
      else status = 'correct';
      finishWord(status);
    } else {
      hadWrongAttemptThisWord = true;
    }
  }
});

tapHint.addEventListener('click', focusInput);
typeDisplay.addEventListener('click', focusInput);
document.getElementById('playScreen').addEventListener('click', (e) => {
  if(e.target.closest('button')) return;
  focusInput();
});

hintBtn.addEventListener('click', () => {
  if(awaitingNext) return;
  usedHintThisWord = true;
  hintText.textContent = `つづり: ${queue[qIndex].w}`;
  hintBtn.disabled = true;
});

skipBtn.addEventListener('click', () => {
  if(awaitingNext) return;
  finishWord('skip');
});

function finishWord(status){
  awaitingNext = true;
  const entry = queue[qIndex];
  results.push({ entry, status });

  skipBtn.classList.add('hidden');
  hintBtn.disabled = true;
  nextBtn.classList.remove('hidden');

  if(status === 'correct'){
    feedbackBanner.className = 'feedback-banner show-correct';
    feedbackBanner.textContent = '⭕ せいかい！';
  } else if(status === 'corrected'){
    feedbackBanner.className = 'feedback-banner show-correct';
    feedbackBanner.textContent = '⭕ せいかい！（うちなおしたね）';
  } else if(status === 'hint'){
    feedbackBanner.className = 'feedback-banner show-correct';
    feedbackBanner.innerHTML = '⭕ せいかい！（ヒントを見たよ）';
  } else if(status === 'skip'){
    feedbackBanner.className = 'feedback-banner show-wrong';
    feedbackBanner.innerHTML = `⏭ スキップ<div class="correct-answer">こたえ: <b>${escapeHtml(entry.w)}</b>（${escapeHtml(entry.m)}）</div>`;
  } else {
    feedbackBanner.className = 'feedback-banner show-wrong';
    feedbackBanner.innerHTML = `✕ おしい！<div class="correct-answer">こたえ: <b>${escapeHtml(entry.w)}</b>（${escapeHtml(entry.m)}）</div>`;
  }

  // small delay auto-advance for smooth correct-flow; manual button still available for hint/wrong/skip
  if(status === 'correct' || status === 'corrected'){
    setTimeout(() => { if(awaitingNext) advance(); }, 700);
  }
}

nextBtn.addEventListener('click', advance);

function advance(){
  qIndex++;
  if(qIndex >= queue.length){
    finishRound();
  } else {
    loadQuestion();
  }
}

function finishRound(){
  stopTimer();
  const totalSec = Math.floor((Date.now() - startTime) / 1000);
  const correctCount = results.filter(r => r.status === 'correct').length;

  document.getElementById('resCorrect').textContent = correctCount;
  document.getElementById('resTotal').textContent = results.length;
  document.getElementById('resTime').textContent = formatTime(totalSec);

  const missList = document.getElementById('missList');
  const misses = results.filter(r => r.status !== 'correct');
  const retryBtn = document.getElementById('retryMissBtn');

  if(misses.length === 0){
    missList.innerHTML = '<div class="empty-miss">パーフェクト！ぜんぶ 1かいで せいかいだったよ 🎉</div>';
    retryBtn.classList.add('hidden');
  } else {
    missList.innerHTML = '';
    const tagInfo = {
      hint:      { cls: 'hint', label: 'ヒント使用' },
      corrected: { cls: 'hint', label: 'うちなおし' },
      skip:      { cls: 'skip', label: 'スキップ' },
      wrong:     { cls: 'wrong', label: 'まちがい' }
    };
    misses.forEach(r => {
      const info = tagInfo[r.status] || tagInfo.wrong;
      const row = document.createElement('div');
      row.className = 'miss-item';
      row.innerHTML = `<span><span class="miss-word">${escapeHtml(r.entry.w)}</span> <span class="miss-meaning">${escapeHtml(r.entry.m)}</span></span><span class="miss-tag ${info.cls}">${info.label}</span>`;
      missList.appendChild(row);
    });
    retryBtn.classList.remove('hidden');
  }

  showScreen(resultScreen);
}

document.getElementById('retryMissBtn').addEventListener('click', () => {
  const misses = results.filter(r => r.status !== 'correct').map(r => r.entry);
  queue = shuffle(misses);
  startRound();
});
document.getElementById('restartSameBtn').addEventListener('click', () => {
  const pool = poolForGenre();
  const n = selectedCount === 0 ? pool.length : Math.min(selectedCount, pool.length);
  queue = shuffle(pool).slice(0, n);
  startRound();
});
document.getElementById('backToStartBtn').addEventListener('click', () => {
  showScreen(startScreen);
});

/* keep focus on hidden input while playing (helps mobile/tablet keyboards pop up) */
document.addEventListener('keydown', (e) => {
  if(!playScreen.classList.contains('hidden') && document.activeElement !== hiddenInput){
    if(e.key.length === 1 || e.key === 'Backspace'){ focusInput(); }
  }
});
</script>
</body>
</html>
