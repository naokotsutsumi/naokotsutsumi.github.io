<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>曜日（ようび）たんごミニテスト</title>
<style>
  :root {
    --blue: #4A90D9;
    --green: #4CAF50;
    --red: #E85555;
    --bg: #FAFBFC;
  }
  * { box-sizing: border-box; }
  body {
    font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
    background: var(--bg);
    margin: 0;
    padding: 0 0 60px 0;
    color: #333;
  }
  header {
    background: var(--blue);
    color: white;
    padding: 18px 16px;
    text-align: center;
  }
  header h1 {
    margin: 0;
    font-size: 1.3em;
  }
  .score-bar {
    position: sticky;
    top: 0;
    z-index: 100;
    background: white;
    border-bottom: 3px solid var(--blue);
    padding: 12px 16px;
    display: flex;
    justify-content: center;
    align-items: center;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
  }
  .score-bar .score-label {
    font-size: 1.1em;
    font-weight: bold;
  }
  .score-bar .score-value {
    color: var(--blue);
  }
  .result-message {
    text-align: center;
    font-size: 1.1em;
    font-weight: bold;
    padding: 12px 16px 0 16px;
    min-height: 1.6em;
  }
  .result-message.perfect { color: var(--green); }
  .result-message.retry { color: var(--red); }
  .grade-area {
    text-align: center;
    padding: 10px 16px 30px 16px;
  }
  #gradeBtn {
    background: var(--green);
    color: white;
    border: none;
    padding: 14px 40px;
    border-radius: 8px;
    font-size: 1.1em;
    font-weight: bold;
    cursor: pointer;
  }
  #gradeBtn:active { transform: scale(0.97); }
  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 16px;
  }
  .question {
    background: white;
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 18px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    border: 2px solid transparent;
  }
  .question.correct { border-color: var(--green); }
  .question.incorrect { border-color: var(--red); }
  .qhead {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
  }
  .qnum {
    font-weight: bold;
    font-size: 1.05em;
    color: var(--blue);
  }
  .playBtn {
    background: var(--blue);
    color: white;
    border: none;
    border-radius: 50%;
    width: 42px;
    height: 42px;
    font-size: 1.2em;
    cursor: pointer;
    flex-shrink: 0;
  }
  .playBtn:active { transform: scale(0.95); }
  .result-mark {
    font-size: 1.3em;
    margin-left: auto;
  }
  .choices {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
    gap: 10px;
  }
  .choice {
    border: 3px solid #ddd;
    border-radius: 10px;
    padding: 14px 8px;
    cursor: pointer;
    text-align: center;
    background: #fff;
    transition: border-color 0.15s;
    font-size: 1.1em;
    font-weight: bold;
    color: #333;
  }
  .choice.selected {
    border-color: var(--blue);
    background: #EAF3FC;
  }
  .choice.show-wrong {
    border-color: var(--red);
    background: #FCEAEA;
  }
  footer {
    text-align: center;
    padding: 20px;
    color: #999;
    font-size: 0.85em;
  }
</style>
</head>
<body>

<header>
  <h1>📅 曜日（ようび）たんごミニテスト 📅</h1>
</header>

<div class="score-bar">
  <div class="score-label">点数：<span class="score-value" id="scoreDisplay">-- / 7</span></div>
</div>
<div id="resultMessage" class="result-message"></div>

<main id="quiz"></main>

<div class="grade-area">
  <button id="gradeBtn" onclick="gradeTest()">採点する</button>
</div>

<footer>音声を聞いて、正しい曜日を選んでね</footer>

const QUESTIONS = [{"correct": "Sunday", "choices": ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"]}, {"correct": "Tuesday", "choices": ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"]}, {"correct": "Wednesday", "choices": ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"]}, {"correct": "Saturday", "choices": ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"]}, {"correct": "Friday", "choices": ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"]}, {"correct": "Thursday", "choices": ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"]}, {"correct": "Monday", "choices": ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"]}];

const quizEl = document.getElementById('quiz');
let graded = false;

function render() {
  quizEl.innerHTML = '';
  QUESTIONS.forEach((q, qi) => {
    const qDiv = document.createElement('div');
    qDiv.className = 'question';
    qDiv.id = 'q' + qi;

    const head = document.createElement('div');
    head.className = 'qhead';
    head.innerHTML = `
      <span class="qnum">もんだい ${qi + 1}</span>
      <button class="playBtn" onclick="playAudio('${q.correct}')">▶</button>
      <span class="result-mark" id="mark${qi}"></span>
    `;
    qDiv.appendChild(head);

    const choicesDiv = document.createElement('div');
    choicesDiv.className = 'choices';
    q.choices.forEach((name) => {
      const c = document.createElement('div');
      c.className = 'choice';
      c.dataset.name = name;
      c.onclick = () => selectChoice(qi, name);
      c.textContent = ASSETS[name].jp;
      choicesDiv.appendChild(c);
    });
    qDiv.appendChild(choicesDiv);
    quizEl.appendChild(qDiv);
  });
}

const selections = {};

function selectChoice(qi, name) {
  selections[qi] = name;
  const qDiv = document.getElementById('q' + qi);
  qDiv.querySelectorAll('.choice').forEach(c => {
    c.classList.remove('selected', 'show-wrong');
    if (c.dataset.name === name) c.classList.add('selected');
  });
  qDiv.classList.remove('correct', 'incorrect');
  document.getElementById('mark' + qi).textContent = '';
}

function playAudio(name) {
  const audio = new Audio(ASSETS[name].audio);
  let playCount = 0;
  audio.onended = () => {
    playCount++;
    if (playCount < 2) {
      setTimeout(() => { audio.currentTime = 0; audio.play(); }, 500);
    } else {
      audio.onended = null;
    }
  };
  audio.play();
  playCount++;
}

function gradeTest() {
  let score = 0;
  QUESTIONS.forEach((q, qi) => {
    const qDiv = document.getElementById('q' + qi);
    const sel = selections[qi];
    const mark = document.getElementById('mark' + qi);
    qDiv.querySelectorAll('.choice').forEach(c => {
      c.classList.remove('show-wrong');
    });
    if (sel === q.correct) {
      score++;
      qDiv.classList.add('correct');
      qDiv.classList.remove('incorrect');
      mark.textContent = '⭕';
    } else {
      qDiv.classList.add('incorrect');
      qDiv.classList.remove('correct');
      mark.textContent = sel ? '❌' : '❓';
      if (sel) {
        qDiv.querySelector(`.choice[data-name="${sel}"]`).classList.add('show-wrong');
      }
    }
  });
  document.getElementById('scoreDisplay').textContent = score + ' / ' + QUESTIONS.length;
  const msgEl = document.getElementById('resultMessage');
  if (score === QUESTIONS.length) {
    msgEl.textContent = '全問正解だよ。正しくおぼえたね';
    msgEl.className = 'result-message perfect';
  } else {
    msgEl.textContent = 'まちがえた問題をもう一度聞き直し、とき直そう';
    msgEl.className = 'result-message retry';
  }
  if (!graded) {
    document.getElementById('gradeBtn').textContent = 'もう一度 採点する';
    graded = true;
  }
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

render();
</script>
