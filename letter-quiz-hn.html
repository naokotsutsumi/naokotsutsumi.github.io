<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文字さがしクイズ - にんじん</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@400;500&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1:#fdf3e3;
    --bg-2:#f7e3d0;
    --card:#fffdf8;
    --ink:#3c2e22;
    --carrot:#e8833a;
    --carrot-deep:#c9631f;
    --leaf:#4f8b52;
    --leaf-deep:#31612f;
    --bunny:#efe7de;
    --bunny-ear:#f2c6c6;
    --miss:#d9705a;
    --line:#ecdcc6;
    --soil:#c99a63;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(circle at 12% 8%, #fff8ec 0%, transparent 45%),
      radial-gradient(circle at 92% 88%, var(--bg-2) 0%, transparent 55%),
      linear-gradient(160deg, var(--bg-1), var(--bg-2));
    font-family:'Zen Maru Gothic', sans-serif;
    color:var(--ink);
    padding:32px 16px;
  }
  .stage{width:100%;max-width:480px;}
  .card{
    background:var(--card);
    border-radius:28px;
    padding:36px 30px 30px;
    box-shadow:0 20px 50px -20px rgba(120,70,20,0.3), 0 2px 0 rgba(255,255,255,0.7) inset;
    position:relative;
    overflow:hidden;
  }
  .card::before{
    content:"";
    position:absolute;
    top:-60px; left:-60px;
    width:160px;height:160px;
    background:radial-gradient(circle, #fbe4c8, transparent 70%);
    opacity:0.8;
  }
  .eyebrow{
    font-size:12px;
    letter-spacing:0.14em;
    color:var(--carrot-deep);
    font-weight:700;
    margin:0 0 6px;
    position:relative;
  }
  h1{
    font-family:'Kiwi Maru', serif;
    font-size:26px;
    margin:0 0 4px;
    color:#4a3420;
    position:relative;
  }
  .hint{
    font-size:14px;
    color:#7a6650;
    margin:0 0 20px;
    position:relative;
  }
  .scene-wrap{
    display:flex;
    justify-content:center;
    margin-bottom:14px;
  }
  #scene{width:260px;height:130px;overflow:visible;}
  .bunny{
    transition:transform .55s cubic-bezier(.34,1.35,.64,1);
    transform:translateX(0px);
  }
  .bunny.chomp{
    animation:chomp .4s ease 2;
  }
  @keyframes chomp{
    0%,100%{transform:translateX(var(--bx)) scale(1);}
    50%{transform:translateX(var(--bx)) scale(1.08,0.92);}
  }
  .carrot-top{transition:opacity .4s ease, transform .4s ease;}
  .carrot-top.eaten{opacity:0; transform:translateY(6px) scale(0.7);}
  .sparkle{opacity:0; transition:opacity .4s ease;}
  .sparkle.show{opacity:1;}
  .blanks{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;
    margin:6px 0 22px;
  }
  .blank{
    width:30px;
    text-align:center;
    font-family:'Kiwi Maru', serif;
    font-size:24px;
    font-weight:500;
    color:#4a3420;
    border-bottom:3px solid var(--line);
    padding-bottom:4px;
    transition:border-color .3s ease, transform .3s ease;
  }
  .blank.filled{
    border-color:var(--carrot);
    animation:pop .35s ease;
  }
  @keyframes pop{
    0%{transform:scale(0.6);}
    60%{transform:scale(1.12);}
    100%{transform:scale(1);}
  }
  .letters{
    display:grid;
    grid-template-columns:repeat(7, 1fr);
    gap:8px;
    margin-bottom:18px;
  }
  .key{
    aspect-ratio:1/1;
    border-radius:14px;
    border:none;
    background:#fff;
    box-shadow:0 3px 0 var(--line), 0 6px 14px -8px rgba(120,70,20,0.25);
    font-family:'Zen Maru Gothic', sans-serif;
    font-weight:700;
    font-size:17px;
    color:#4a3420;
    cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease, background .2s ease, color .2s ease;
  }
  .key:hover:not(:disabled){transform:translateY(-2px);}
  .key:active:not(:disabled){transform:translateY(1px); box-shadow:0 1px 0 var(--line);}
  .key:disabled{cursor:default;}
  .key.correct{
    background:var(--leaf);
    color:#fff;
    box-shadow:0 3px 0 var(--leaf-deep);
  }
  .key.wrong{
    background:#fbe0da;
    color:var(--miss);
    box-shadow:0 3px 0 #f0bdb1;
    opacity:0.75;
  }
  .status{
    min-height:22px;
    text-align:center;
    font-size:14.5px;
    font-weight:700;
    color:var(--leaf-deep);
    margin:0 0 6px;
  }
  .status.lose{color:var(--miss);}
  .meta{
    text-align:center;
    font-size:12.5px;
    color:#9a8468;
    margin:0 0 4px;
  }
  .retry{
    display:block;
    margin:14px auto 0;
    padding:10px 22px;
    border:none;
    border-radius:999px;
    background:var(--carrot);
    color:#fff;
    font-family:'Zen Maru Gothic', sans-serif;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
    box-shadow:0 4px 0 var(--carrot-deep);
  }
  .retry:active{transform:translateY(2px); box-shadow:0 2px 0 var(--carrot-deep);}
  .hidden{display:none;}
  .answer-reveal{
    text-align:center;
    font-size:13px;
    color:#9a8468;
    margin-top:2px;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="card">
      <p class="eyebrow">H〜N の7文字だけで挑戦</p>
      <h1>文字さがしクイズ</h1>
      <p class="hint">ヒント: 畑でとれる野菜／ローマ字6文字の日本語</p>

      <div class="scene-wrap">
        <svg id="scene" viewBox="0 0 260 130">
          <!-- soil line -->
          <rect x="0" y="108" width="260" height="6" rx="3" fill="#c99a63" opacity="0.5"/>

          <!-- carrot (goal), fixed at right -->
          <g id="carrotGroup" transform="translate(212,70)">
            <path class="carrot-top" id="carrotTop" d="M0,0 C-10,-18 -4,-30 0,-34 C4,-30 10,-18 0,0 Z" fill="#4f8b52" transform="translate(0,-2)"/>
            <path class="carrot-top" d="M-6,-4 C-14,-16 -10,-26 -6,-28" stroke="#4f8b52" stroke-width="4" fill="none" stroke-linecap="round"/>
            <path class="carrot-top" d="M6,-4 C14,-16 10,-26 6,-28" stroke="#4f8b52" stroke-width="4" fill="none" stroke-linecap="round"/>
            <path d="M0,-2 L-13,38 C-13,44 13,44 13,38 Z" fill="#e8833a"/>
            <path d="M-4,10 h8 M-5,20 h10 M-4,30 h8" stroke="#c9631f" stroke-width="2" opacity="0.5"/>
            <g class="sparkle" id="sparkle1">
              <circle cx="-26" cy="-20" r="3" fill="#f2c14e"/>
              <circle cx="24" cy="-6" r="2.4" fill="#f2c14e"/>
              <circle cx="-20" cy="16" r="2" fill="#f2c14e"/>
            </g>
          </g>

          <!-- bunny, starts at left, hops right per mistake -->
          <g class="bunny" id="bunny" transform="translate(20,66)">
            <ellipse cx="0" cy="24" rx="17" ry="10" fill="#efe7de"/>
            <circle cx="0" cy="6" r="13" fill="#efe7de"/>
            <path d="M-8,-4 C-11,-22 -3,-24 -3,-8 Z" fill="#efe7de"/>
            <path d="M-8,-4 C-10,-18 -4,-20 -4,-8 Z" fill="#f2c6c6"/>
            <path d="M8,-4 C11,-22 3,-24 3,-8 Z" fill="#efe7de"/>
            <path d="M8,-4 C10,-18 4,-20 4,-8 Z" fill="#f2c6c6"/>
            <circle cx="-4.5" cy="4" r="1.6" fill="#3c2e22"/>
            <circle cx="4.5" cy="4" r="1.6" fill="#3c2e22"/>
            <circle cx="0" cy="9" r="1.4" fill="#e8833a"/>
          </g>
        </svg>
      </div>

      <div class="blanks" id="blanks"></div>
      <div class="letters" id="letters"></div>
      <p class="status" id="status">&nbsp;</p>
      <p class="meta" id="meta"></p>
      <p class="answer-reveal hidden" id="answerReveal"></p>
      <button class="retry hidden" id="retry">もう一度あそぶ</button>
    </div>
  </div>

<script>
  const WORD = ['n','i','n','j','i','n'];   // 答え: ninjin (にんじん / 人参)
  const ANSWER_LABEL = '人参（にんじん）＝ carrot';
  const ALL_LETTERS = ['h','i','j','k','l','m','n'];
  const DISTINCT_CORRECT = [...new Set(WORD)];               // n, i, j
  const MAX_MISTAKES = ALL_LETTERS.length - DISTINCT_CORRECT.length; // 4

  const blanksEl = document.getElementById('blanks');
  const lettersEl = document.getElementById('letters');
  const statusEl = document.getElementById('status');
  const metaEl = document.getElementById('meta');
  const retryEl = document.getElementById('retry');
  const answerRevealEl = document.getElementById('answerReveal');
  const bunnyEl = document.getElementById('bunny');
  const carrotTops = document.querySelectorAll('.carrot-top');
  const sparkleEl = document.getElementById('sparkle1');

  const START_X = 20;
  const END_X = 190; // just before carrot
  const STEP = (END_X - START_X) / MAX_MISTAKES;

  let correctSet, mistakes, over;

  function init(){
    correctSet = new Set();
    mistakes = 0;
    over = false;

    blanksEl.innerHTML = '';
    WORD.forEach((_, i) => {
      const d = document.createElement('div');
      d.className = 'blank';
      d.id = 'blank-' + i;
      blanksEl.appendChild(d);
    });

    lettersEl.innerHTML = '';
    ALL_LETTERS.forEach(letter => {
      const b = document.createElement('button');
      b.className = 'key';
      b.textContent = letter;
      b.addEventListener('click', () => guess(letter, b));
      lettersEl.appendChild(b);
    });

    bunnyEl.style.setProperty('--bx', '0px');
    bunnyEl.style.transform = 'translateX(0px)';
    bunnyEl.classList.remove('chomp');
    carrotTops.forEach(el => el.classList.remove('eaten'));
    sparkleEl.classList.remove('show');

    statusEl.textContent = '\u00A0';
    statusEl.classList.remove('lose');
    metaEl.textContent = 'のこりミス回数: ' + MAX_MISTAKES;
    answerRevealEl.classList.add('hidden');
    retryEl.classList.add('hidden');
  }

  function guess(letter, btn){
    if (over) return;
    btn.disabled = true;

    if (WORD.includes(letter)){
      btn.classList.add('correct');
      WORD.forEach((l, i) => {
        if (l === letter){
          correctSet.add(i);
          const blank = document.getElementById('blank-' + i);
          blank.textContent = l;
          blank.classList.add('filled');
        }
      });
      if (correctSet.size === WORD.length){
        win();
      }
    } else {
      btn.classList.add('wrong');
      mistakes++;
      const dx = STEP * mistakes;
      bunnyEl.style.setProperty('--bx', dx + 'px');
      bunnyEl.style.transform = 'translateX(' + dx + 'px)';
      metaEl.textContent = 'のこりミス回数: ' + (MAX_MISTAKES - mistakes);
      if (mistakes >= MAX_MISTAKES){
        lose();
      }
    }
  }

  function win(){
    over = true;
    statusEl.textContent = 'せいかい！ 🥕 「にんじん」でした';
    metaEl.textContent = '';
    sparkleEl.classList.add('show');
    disableAll();
  }

  function lose(){
    over = true;
    statusEl.textContent = 'うさぎに先に見つかっちゃいました';
    statusEl.classList.add('lose');
    bunnyEl.classList.add('chomp');
    setTimeout(() => carrotTops.forEach(el => el.classList.add('eaten')), 300);
    answerRevealEl.textContent = '答え: ' + ANSWER_LABEL;
    answerRevealEl.classList.remove('hidden');
    disableAll();
  }

  function disableAll(){
    document.querySelectorAll('.key').forEach(b => b.disabled = true);
    retryEl.classList.remove('hidden');
  }

  retryEl.addEventListener('click', init);

  init();
</script>
</body>
</html>
