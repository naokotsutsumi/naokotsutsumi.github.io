<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自然環境たんごミニテスト</title>
<style>
  body {
    font-family: "UD Digi Kyokasho NP-R", "Meiryo", sans-serif;
    background: #eef7f0;
    margin: 0;
    padding: 20px;
    color: #2d4a34;
  }
  h1 {
    text-align: center;
    color: #2f9e5c;
    margin-bottom: 10px;
  }
  #scoreResult {
    max-width: 700px;
    margin: 0 auto 20px auto;
    padding: 15px;
    background: #e3f5e9;
    border: 3px solid #6cc48a;
    border-radius: 12px;
    text-align: center;
    font-size: 1.2em;
    font-weight: bold;
    min-height: 1.5em;
  }
  .quiz-container {
    max-width: 700px;
    margin: 0 auto;
  }
  .question-card {
    background: white;
    border-radius: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    padding: 20px;
    margin-bottom: 20px;
    border: 4px solid transparent;
  }
  .question-card.incorrect {
    border-color: #e74c3c;
  }
  .question-header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
    margin-bottom: 15px;
  }
  .q-number {
    font-size: 1.3em;
    font-weight: bold;
    color: #2f9e5c;
  }
  .play-btn {
    background: #45b378;
    color: white;
    border: none;
    border-radius: 50%;
    width: 55px;
    height: 55px;
    font-size: 1.5em;
    cursor: pointer;
    box-shadow: 0 2px 5px rgba(0,0,0,0.2);
  }
  .play-btn:active {
    transform: scale(0.95);
  }
  .choices {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 12px;
  }
  .choice-card {
    position: relative;
    border: 3px solid #ddd;
    border-radius: 12px;
    padding: 8px;
    cursor: pointer;
    text-align: center;
    background: #fafafa;
    transition: all 0.15s;
  }
  .choice-card:hover {
    border-color: #6cc48a;
  }
  .choice-card.selected {
    border-color: #45b378;
    background: #e3f5e9;
  }
  .choice-card img {
    width: 100%;
    height: 90px;
    object-fit: contain;
  }
  #gradeBtn {
    display: block;
    margin: 30px auto;
    padding: 15px 40px;
    font-size: 1.2em;
    font-weight: bold;
    background: #2f9e5c;
    color: white;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    box-shadow: 0 3px 8px rgba(0,0,0,0.2);
  }
  #gradeBtn:active {
    transform: scale(0.97);
  }
</style>
</head>

const LOCATION_WORDS = ["in_mountains", "in_rivers", "in_forests", "in_lakes", "in_the_desert", "in_the_rainforest", "in_the_savanna", "in_the_sea"];
const ACTION_WORDS = ["forest_loss", "global_warming", "plant_trees", "plastic", "save_energy", "use_eco-friendly_bags"];

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

const questionOrder = shuffle(WORDS);
const userAnswers = {};

function buildChoices(correctWord) {
  const pool = LOCATION_WORDS.includes(correctWord) ? LOCATION_WORDS : ACTION_WORDS;
  const others = pool.filter(w => w !== correctWord);
  const dummies = shuffle(others).slice(0, 4);
  return shuffle([correctWord, ...dummies]);
}

const container = document.getElementById('quizContainer');

questionOrder.forEach((word, idx) => {
  const qNum = idx + 1;
  const choices = buildChoices(word);

  const card = document.createElement('div');
  card.className = 'question-card';
  card.id = 'card-' + qNum;

  const header = document.createElement('div');
  header.className = 'question-header';

  const qLabel = document.createElement('div');
  qLabel.className = 'q-number';
  qLabel.textContent = '問題 ' + qNum;
  header.appendChild(qLabel);

  const playBtn = document.createElement('button');
  playBtn.className = 'play-btn';
  playBtn.textContent = '🔊';
  playBtn.onclick = () => playAudio(word);
  header.appendChild(playBtn);

  card.appendChild(header);

  const choicesDiv = document.createElement('div');
  choicesDiv.className = 'choices';

  choices.forEach(choiceWord => {
    const choiceCard = document.createElement('div');
    choiceCard.className = 'choice-card';
    choiceCard.id = 'choice-' + qNum + '-' + choiceWord;

    const img = document.createElement('img');
    img.src = 'data:' + DATA[choiceWord].mime + ';base64,' + DATA[choiceWord].img;
    choiceCard.appendChild(img);

    choiceCard.onclick = () => selectChoice(qNum, word, choiceWord);
    choicesDiv.appendChild(choiceCard);
  });

  card.appendChild(choicesDiv);
  container.appendChild(card);
});

function selectChoice(qNum, correctWord, choiceWord) {
  userAnswers[qNum] = { correctWord, choiceWord };
  document.querySelectorAll('#card-' + qNum + ' .choice-card').forEach(el => {
    el.classList.remove('selected');
  });
  document.getElementById('choice-' + qNum + '-' + choiceWord).classList.add('selected');
}

function playAudio(word) {
  const audio = new Audio('data:audio/mp3;base64,' + DATA[word].audio);
  let playCount = 0;
  audio.onended = () => {
    playCount++;
    if (playCount < 2) {
      setTimeout(() => {
        audio.currentTime = 0;
        audio.play();
      }, 500);
    } else {
      audio.onended = null;
    }
  };
  audio.play();
}

let graded = false;

document.getElementById('gradeBtn').onclick = () => {
  let correctCount = 0;
  const total = questionOrder.length;

  questionOrder.forEach((word, idx) => {
    const qNum = idx + 1;
    const card = document.getElementById('card-' + qNum);
    const answer = userAnswers[qNum];
    card.classList.remove('incorrect');
    if (!answer || answer.choiceWord !== answer.correctWord) {
      card.classList.add('incorrect');
    } else {
      correctCount++;
    }
  });

  const scoreDiv = document.getElementById('scoreResult');
  const msg = correctCount === total
    ? '全問正解だよ。正しくおぼえたね (' + correctCount + '/' + total + ')'
    : 'まちがえた問題をもう一度聞き直し、とき直そう (' + correctCount + '/' + total + ')';
  scoreDiv.textContent = msg;

  window.scrollTo({ top: 0, behavior: 'smooth' });

  graded = true;
  document.getElementById('gradeBtn').textContent = 'もう一度 採点する';
};
</script>

</body>
</html>
