:root{
  --blue:#4a90d9; --blue-dark:#2f6bb0; --yellow:#ffcb3d; --green:#3fae5a;
  --red:#e05c5c; --orange:#e08a2c; --bg:#f3f8fe; --card:#ffffff; --gray:#6b7280; --line:#d6e3f3;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);font-family:"Andika","BIZ UDPGothic","Hiragino Kaku Gothic ProN","Noto Sans JP","Meiryo",sans-serif;color:#222;font-size:18px;line-height:1.6}
header{background:linear-gradient(135deg,var(--blue),var(--blue-dark));color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
header h1{font-size:19px;margin:0}
#progress{margin-left:auto;font-size:14px;background:rgba(255,255,255,.22);padding:3px 12px;border-radius:999px;display:none}
main{max-width:920px;margin:0 auto;padding:16px 16px 110px}
.screen{display:none}
.screen.active{display:block}
.card{background:var(--card);border-radius:16px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.06);margin-bottom:16px}
.sec-badge{display:inline-block;font-size:14px;font-weight:bold;padding:2px 14px;border-radius:999px;color:#fff;background:var(--blue)}
.sec-badge.t{background:var(--orange)}
.q-title{font-size:20px;font-weight:bold;margin:10px 0 6px}
.q-no{display:inline-block;background:var(--blue-dark);color:#fff;border-radius:8px;padding:0 10px;margin-right:6px}
.sec-badge.t + .q-title .q-no{background:var(--orange)}
.key{color:var(--orange)}
.btn{border:none;border-radius:12px;padding:10px 20px;font-size:18px;font-weight:bold;cursor:pointer;font-family:inherit}
.btn-audio{background:var(--yellow);color:#333}
.btn-stop{background:#e9edf2;color:#333}
.btn-main{background:var(--blue);color:#fff}
.btn-sub{background:#fff;color:var(--blue-dark);border:2px solid var(--blue)}
.btn-green{background:var(--green);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.audio-bar{display:flex;gap:10px;align-items:center;margin:10px 0 14px;flex-wrap:wrap}
.audio-status{font-size:15px;color:var(--gray)}
.audio-status.on{color:var(--blue-dark);font-weight:bold}
.item{margin:18px 0 0;padding-top:14px;border-top:2px dashed var(--line)}
.item.first{border-top:none;padding-top:0}
.item-label{font-weight:bold;margin-bottom:8px}
.prompt-pic{text-align:center;margin:6px 0 12px}
.prompt-pic .emoji{font-size:96px;line-height:1.15;display:block}
.prompt-pic .jp{font-size:15px;color:#555}
.choices{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.choices.two{grid-template-columns:repeat(2,minmax(120px,220px))}
.choices.wide{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.choice{background:#fff;border:3px solid var(--line);border-radius:14px;padding:10px;cursor:pointer;text-align:center;font-family:inherit;font-size:18px;color:#222;transition:.1s}
.choice:hover{border-color:var(--blue)}
.choice.selected{border-color:var(--blue);background:#e6f0fc;box-shadow:0 0 0 3px rgba(74,144,217,.25)}
.choice .mark{font-weight:bold;color:var(--blue-dark);display:block;font-size:20px}
.choice .emoji{font-size:58px;line-height:1.2;display:block}
.choice .txt{font-size:22px;font-weight:bold;display:block}
.choice .letters{font-size:42px;font-weight:bold;font-family:"Andika","BIZ UDPGothic",sans-serif;display:block;letter-spacing:2px}
.choice .jp{font-size:15px;color:#555;display:block}
.memo{border:2px solid #b9cde6;border-radius:10px;text-align:left;font-size:16px;overflow:hidden;margin-top:4px}
.memo .h{background:#fff4c2;font-weight:bold;padding:2px 8px;font-size:14px}
.memo .v{padding:2px 8px 6px}
.poster{border:2px solid #b9cde6;border-radius:10px;font-size:15px;margin-top:4px;overflow:hidden}
.poster .row{display:flex;align-items:center;gap:6px;padding:4px 8px;border-top:1px solid #e3ebf5}
.poster .row:first-child{border-top:none}
.poster .row b{width:5.2em;font-size:13px;color:#555;text-align:left}
.poster .row span.e{font-size:32px}
.type-model{background:#f6f9fd;border:2px solid var(--line);border-radius:12px;padding:10px 14px;margin:8px 0;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.type-model .emoji{font-size:60px}
.type-model .en{font-size:26px;font-family:"Andika","BIZ UDPGothic",sans-serif}
.type-line{font-size:26px;font-family:"Andika","BIZ UDPGothic",sans-serif;display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px}
.type-input{font-size:26px;font-family:"Andika","BIZ UDPGothic",sans-serif;padding:4px 10px;border:3px solid var(--blue);border-radius:10px;width:260px;max-width:100%;background:#fffdf0}
.type-input.long{width:600px}
.order-row{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.order-card{border:3px solid var(--line);border-radius:14px;padding:10px;text-align:center;background:#fff}
.order-card .emoji{font-size:64px;line-height:1.2;display:block}
.order-card .jp{font-size:15px;color:#555;display:block;margin-bottom:6px}
.order-btns{display:flex;justify-content:center;gap:8px}
.obtn{width:48px;height:48px;border-radius:50%;border:3px solid var(--line);background:#fff;font-size:22px;font-weight:bold;cursor:pointer;font-family:inherit;color:#333}
.obtn.selected{background:var(--blue);border-color:var(--blue);color:#fff}
.read-list{background:#f6f9fd;border:2px solid var(--line);border-radius:12px;padding:8px 16px;margin:8px 0 12px;font-family:"Andika","BIZ UDPGothic",sans-serif;font-size:22px}
.read-list div{margin:4px 0}
.type-input:focus{outline:none;box-shadow:0 0 0 4px rgba(74,144,217,.3)}
.hint{font-size:15px;color:var(--gray);margin-top:6px}
.bubble{display:flex;align-items:center;gap:10px;margin:8px 0}

.bubble .talk{background:#fff7e0;border:2px solid #f1d58a;border-radius:14px;padding:8px 14px;font-size:17px}

.ref-card .ttl{display:inline-block;background:#e6f0fc;border-radius:8px;padding:0 10px;font-weight:bold;font-size:15px}

.pick-box{display:flex;gap:16px;flex-wrap:wrap;background:#fff8d6;border-radius:12px;padding:10px 16px;margin:8px 0;font-family:"Andika","BIZ UDPGothic",sans-serif;font-size:22px}

#navbar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:2px solid var(--line);padding:10px 16px;display:none;justify-content:center;gap:16px;z-index:5}
#navbar .btn{min-width:150px}
.start-box label{display:block;font-weight:bold;margin:12px 0 4px}
.start-box input{font-size:22px;padding:6px 12px;border:2px solid var(--line);border-radius:10px;width:100%;max-width:320px;font-family:inherit}

.score-box.t{background:var(--orange)}

<body>
<header>
  <h1 id="hdr"></h1>
  <span id="progress"></span>
</header>
<main>
  <!-- スタート画面 -->
  <section class="screen active" id="start">
    <div class="card start-box">
      <h2 style="margin-top:0">単元テスト</h2>
      <p>🎧 イヤホンをつけてから、「音のテスト」をおしてみましょう。</p>
      <button class="btn btn-audio" id="soundTest">🔊 音のテスト</button>
      <label for="num">番号</label>
      <input id="num" inputmode="numeric" autocomplete="off">
      <label for="nm">名前</label>
      <input id="nm" autocomplete="off">
      <label for="pass">パスコード</label>
      <input id="pass" inputmode="numeric" autocomplete="off" type="password">
      <p class="err" id="startErr"></p>
      <button class="btn btn-main" id="startBtn">はじめる</button>
    </div>
  </section>
  <!-- 問題ページはここに入ります -->
  <div id="pages"></div>
  <!-- 結果画面 -->
  <section class="screen" id="result">
    <div class="card">
      <h2 style="margin-top:0" id="resName"></h2>
      <div class="score-big">
        <div class="score-box k"><div>知識・技能</div><div class="n" id="scK"></div></div>
        <div class="score-box t"><div>思考・判断・表現</div><div class="n" id="scT"></div></div>
      </div>
      <p>📷 下の「結果を画像で保存」をおして、ロイロノートの提出箱に出しましょう。</p>
      <button class="btn btn-green" id="saveImg">結果を画像で保存</button>
      <img id="resultImg" alt="結果の画像">
    </div>
    <div class="card">
      <h3 style="margin-top:0">ふりかえり</h3>
      <table class="review"><thead><tr><th>問題</th><th></th><th>答え</th></tr></thead><tbody id="reviewBody"></tbody></table>
    </div>
  </section>
</main>
<div id="navbar">
  <button class="btn btn-sub" id="prevBtn">◀ もどる</button>
  <button class="btn btn-main" id="nextBtn">つぎへ ▶</button>
</div>

<script>
/* ================= 設定 ================= */
const CONFIG = {
  passcode: '1234',
  autoPlayTimes: 2,   // ページを開いたときに自動で読む回数
  rate: 0.85,         // 読む速さ（1が標準）
  repeatGap: 1500     // 1回目と2回目の間（ミリ秒）
};

/* ============ 問題データ（ここを書きかえると別の単元になる） ============ */
const ORDER = [{v:'1',text:'1番目'},{v:'2',text:'2番目'},{v:'3',text:'3番目'}];
const L = (ch,p)=>({t:ch,p:p??700});
const town = (a,b)=>`<div class="memo"><div class="v">🌳 公園　<b>${a}</b></div><div class="v">🦁 動物園　<b>${b}</b></div></div>`;

const TEST = {
  file: 'G5-U5',
  header: "5年 Unit 5　Let's go to the zoo.",
  pages: [
    /* ---------- 知識・技能（100点） ---------- */
    { sec:'k', no:'1', title:'3つの単語を聞いて、絵を表す単語が何番目に聞こえたか選びましょう。',
      audio:[{t:'park',p:1500},{t:'library',p:1500},{t:'hospital',p:800}],
      items:[{id:'k1-1', label:'(1)', pic:'🏥', picJp:'病院', type:'choice', options:ORDER, answer:'3', pts:10}] },
    { sec:'k', no:'1', title:'3つの単語を聞いて、絵を表す単語が何番目に聞こえたか選びましょう。',
      audio:[{t:'station',p:1500},{t:'school',p:1500},{t:'zoo',p:800}],
      items:[{id:'k1-2', label:'(2)', pic:'🏫', picJp:'学校', type:'choice', options:ORDER, answer:'2', pts:10}] },

    { sec:'k', no:'2', title:'文を聞いて、合う絵を1つ選びましょう。',
      audio:[{t:'Where is the post office?'}],
      items:[{id:'k2-1', label:'(1)', type:'choice', answer:'a', pts:10,
        options:[{v:'a',emoji:'🏤',jp:'郵便局'},{v:'b',emoji:'🏦',jp:'銀行'},{v:'c',emoji:'🏪',jp:'コンビニ'}]}] },
    { sec:'k', no:'2', title:'文を聞いて、合う絵を1つ選びましょう。',
      audio:[{t:'Turn right.'}],
      items:[{id:'k2-2', label:'(2)', type:'choice', answer:'c', pts:10,
        options:[{v:'a',emoji:'⬆️',jp:'まっすぐ進む'},{v:'b',emoji:'⬅️',jp:'左に曲がる'},{v:'c',emoji:'➡️',jp:'右に曲がる'}]}] },
    { sec:'k', no:'2', title:'文を聞いて、合う絵を1つ選びましょう。',
      audio:[{t:'We have a nice aquarium.'}],
      items:[{id:'k2-3', label:'(3)', type:'choice', answer:'b', pts:10,
        options:[{v:'a',emoji:'🏟️',jp:'スタジアム'},{v:'b',emoji:'🐬',jp:'水族館'},{v:'c',emoji:'⛩️',jp:'神社'}]}] },

    { sec:'k', no:'3', title:'やり取りを聞いて、男の子の町にあるもの（○）・ないもの（×）に合うものを1つ選びましょう。',
      audio:[{t:'What do you have in your town?',g:'f'},{t:'We have a big park.',g:'m'},{t:'Oh, really? How about a zoo?',g:'f'},{t:"No. We don't have a zoo.",g:'m'},{t:'I see.',g:'f'}],
      items:[{id:'k3', label:'', type:'choice', cls:'wide', answer:'c', pts:10,
        options:[{v:'a',mark:'㋐',html:town('○','○')},{v:'b',mark:'㋑',html:town('×','○')},{v:'c',mark:'㋒',html:town('○','×')},{v:'d',mark:'㋓',html:town('×','×')}]}] },

    { sec:'k', no:'4', title:'3つの文字の読み方を聞いて、合う小文字の組み合わせを1つ選びましょう。',
      audio:[L('G'),L('K'),L('T',800)],
      items:[{id:'k4-1', label:'(1)', type:'choice', answer:'b', pts:10,
        options:[{v:'a',text:'q k t',letters:true},{v:'b',text:'g k t',letters:true},{v:'c',text:'g k f',letters:true}]}] },
    { sec:'k', no:'4', title:'3つの文字の読み方を聞いて、合う小文字の組み合わせを1つ選びましょう。',
      audio:[L('H'),L('N'),L('U',800)],
      items:[{id:'k4-2', label:'(2)', type:'choice', answer:'a', pts:10,
        options:[{v:'a',text:'h n u',letters:true},{v:'b',text:'n h u',letters:true},{v:'c',text:'h m u',letters:true}]}] },

    { sec:'k', no:'5', title:'文字の読み方を聞いて、その文字を小文字で入力しましょう。',
      audio:[L('Q',800)],
      items:[{id:'k5-1', label:'(1)', type:'type', exact:true, before:'', after:'', answers:['q'], pts:10, hint:'小文字で入力しましょう。'}] },
    { sec:'k', no:'5', title:'文字の読み方を聞いて、その文字を小文字で入力しましょう。',
      audio:[L('J',800)],
      items:[{id:'k5-2', label:'(2)', type:'type', exact:true, before:'', after:'', answers:['j'], pts:10, hint:'小文字で入力しましょう。'}] },

    /* ---------- 思考・判断・表現（50点） ---------- */
    { sec:'t', no:'1', title:'Yukiさんが、外国から観光に来た人に道をたずねられています。話を聞いて、次の問題に答えましょう。',
      audio:[
        {t:'Excuse me. Where is a bookstore? I want a book about Japan.',g:'m'},
        {t:'A bookstore? Umm... Sun Bookstore is big. Moon Bookstore has many comic books.',g:'f'},
        {t:'Oh, I like Japanese comic books! Moon Bookstore is nice!',g:'m'},
        {t:'I see. Moon Bookstore is by the park. Go straight for three blocks. Turn left.',g:'f'},
        {t:'OK. Thank you.',g:'m'}],
      items:[
        {id:'t1-1', label:'(1) 観光に来た人がさがしている場所はどこですか。', type:'choice', answer:'a', pts:10,
          options:[{v:'a',emoji:'📚',jp:'本屋'},{v:'b',emoji:'🍜',jp:'レストラン'},{v:'c',emoji:'🏤',jp:'郵便局'}]},
        {id:'t1-2', label:'(2) Yukiさんの道案内に合うものを1つ選びましょう。', type:'choice', cls:'wide', answer:'c', pts:10,
          options:[{v:'a',mark:'㋐',text:'2区画まっすぐ → 左',},{v:'b',mark:'㋑',text:'3区画まっすぐ → 右'},{v:'c',mark:'㋒',text:'3区画まっすぐ → 左'},{v:'d',mark:'㋓',text:'2区画まっすぐ → 右'}]},
        {id:'t1-3', key:true, label:'(3) Yukiさんが案内した場所はどれだと考えられますか。', type:'choice', cls:'wide', answer:'b', pts:10,
          options:[
            {v:'a',mark:'㋐',emoji:'📚🚉',jp:'大きな本屋（駅のそば）'},
            {v:'b',mark:'㋑',emoji:'📗🌳',jp:'まんがが多い本屋（公園のそば）'},
            {v:'c',mark:'㋒',emoji:'📗🚉',jp:'まんがが多い本屋（駅のそば）'},
            {v:'d',mark:'㋓',emoji:'📚🌳',jp:'大きな本屋（公園のそば）'}]}
      ] },

    { sec:'t', no:'2', title:'Harutoさんは、オーストラリアに住んでいるEmilyさんと、自分の町について紹介し合うために、テレビ電話で話をしています。話を聞いて、次の問題に答えましょう。',
      audio:[
        {t:'Hi, Emily. What do you have in your town?',g:'m'},
        {t:'Hi, Haruto. We have a nice beach. We can swim there. We have a big aquarium, too. What do you have in your town?',g:'f'},
        {t:'We have a nice shrine. And we have a big library.',g:'m'},
        {t:"That's great.",g:'f'}],
      items:[
        {id:'t2-1', label:'(1) Emilyさんの町にあるものを2つ選びましょう。', type:'choice', multi:true, answer:['a','b'], pts:10,
          options:[{v:'a',mark:'㋐',emoji:'🏖️',jp:'浜辺'},{v:'b',mark:'㋑',emoji:'🐬',jp:'水族館'},{v:'c',mark:'㋒',emoji:'⛩️',jp:'神社'},{v:'d',mark:'㋓',emoji:'📚',jp:'図書館'}]},
        {id:'t2-2', key:true, label:'(2) Harutoさんは、自分の町についてくわしく説明するために、町紹介カードを作ることにしました。カードの写真に合うように、★にあてはまる単語を下の黄色いわくから1つ選んで入力しましょう。', type:'type',
          html:`<div class="ref-card"><span class="ttl">町紹介カード</span><div style="font-size:56px">⛩️</div><div class="ln">We have a nice ★ .</div></div>`,
          pick:['📚 library','⛩️ shrine'],
          before:'★', after:'', answers:['shrine'], pts:10}
      ] }
  ]
};

/* ================= ここから下はしくみ（ふつうは変えなくてよい） ================= */
const $ = id => document.getElementById(id);
const state = { page:-1, answers:{}, played:{}, graded:false, num:'', name:'' };
const secName = {k:'知識・技能', t:'思考・判断・表現'};

/* ---------- 音声 ---------- */
let voices = [];
function loadVoices(){ voices = speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang)); }
if('speechSynthesis' in window){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function pickVoice(g){
  const us = voices.filter(v=>/en[-_]US/i.test(v.lang));
  const pool = us.length ? us : voices;
  if(g==='m'){
    return pool.find(v=>/(^|\s)male|david|daniel|alex|fred|guy|mark|tom/i.test(v.name) && !/female/i.test(v.name))
        || voices.find(v=>/UK English Male/i.test(v.name)) || null;
  }
  return pool.find(v=>/google us english/i.test(v.name)) || pool.find(v=>/female|samantha|zira|aria|jenny/i.test(v.name)) || pool[0] || null;
}
let playToken = 0;
const wait = ms => new Promise(r=>setTimeout(r,ms));
function speakOne(line, token){
  return new Promise(res=>{
    if(token!==playToken) return res();
    const u = new SpeechSynthesisUtterance(line.t);
    u.lang = 'en-US'; u.rate = CONFIG.rate;
    const g = line.g || 'f';
    const v = pickVoice(g);
    if(v) u.voice = v;
    u.pitch = (g==='m') ? (v ? 1 : 0.7) : 1.1;
    if(g==='m' && !v){ const f = pickVoice('f'); if(f) u.voice = f; }
    u.onend = u.onerror = ()=>res();
    speechSynthesis.speak(u);
  });
}
async function playAudio(lines, times, statusEl){
  stopAudio();
  const t = ++playToken;
  for(let i=0;i<times;i++){
    if(statusEl){ statusEl.textContent = `🔊 きこえています（${i+1}回目）`; statusEl.classList.add('on'); }
    for(const ln of lines){
      if(t!==playToken) return;
      await speakOne(ln, t);
      await wait(ln.p ?? 600);
    }
    if(i<times-1) await wait(CONFIG.repeatGap);
  }
  if(t===playToken && statusEl){ statusEl.textContent = '聞き終わりました。もう一度聞くときは「もう一度きく」をおしましょう。'; statusEl.classList.remove('on'); }
}
function stopAudio(){
  playToken++;
  if('speechSynthesis' in window) speechSynthesis.cancel();
  document.querySelectorAll('.audio-status.on').forEach(e=>{e.textContent='とめました。';e.classList.remove('on');});
}

/* ---------- 画面づくり ---------- */
function optHTML(o){
  let h = '';
  if(o.mark) h += `<span class="mark">${o.mark}</span>`;
  if(o.emoji) h += `<span class="emoji">${o.emoji}</span>`;
  if(o.text) h += `<span class="${o.letters?'letters':'txt'}">${o.text}</span>`;
  if(o.jp) h += `<span class="jp">${o.jp}</span>`;
  if(o.html) h += o.html;
  return h;
}
function buildPages(){
  const wrap = $('pages');
  TEST.pages.forEach((pg, pi)=>{
    const s = document.createElement('section');
    s.className = 'screen'; s.id = 'page'+pi;
    let h = `<div class="card"><span class="sec-badge ${pg.sec}">${secName[pg.sec]}</span>
      <div class="q-title"><span class="q-no">${pg.no}</span>${pg.title}</div>`;
    if(pg.audio){
      h += `<div class="audio-bar">
        <button class="btn btn-audio" data-play="${pi}">🔊 ${pg.autoplay===false ? (pg.audioLabel||'聞く') : 'もう一度きく'}</button>
        <button class="btn btn-stop" data-stop="1">■ とめる</button>
        <span class="audio-status" id="st${pi}"></span></div>`;
    }
    if(pg.html) h += pg.html;
    pg.items.forEach((it, ii)=>{
      h += `<div class="item ${ii===0?'first':''}">`;
      if(it.label) h += `<div class="item-label">${it.key?'<span class="key">🔑</span>':''}${it.label}</div>`;
      if(it.html) h += it.html;
      if(it.pic) h += `<div class="prompt-pic"><span class="emoji">${it.pic}</span><span class="jp">${it.picJp||''}</span></div>`;
      if(it.type==='choice'){
        h += `<div class="choices ${it.cls||''}" data-item="${it.id}" ${it.multi?'data-multi="1"':''}>`;
        if(it.multi) h += `<div class="hint" style="grid-column:1/-1;margin:0">あてはまるものを <b>${it.answer.length}つ</b> 選びましょう。</div>`;
        it.options.forEach(o=>{ h += `<button class="choice" data-v="${o.v}">${optHTML(o)}</button>`; });
        h += `</div>`;
      } else if(it.type==='type'){
        if(it.model) h += `<div class="type-model"><span class="emoji">${it.modelPic||''}</span><span class="en">${it.model}</span></div>`;
        if(it.pick) h += `<div class="pick-box">${it.pick.map(x=>`<span>${x}</span>`).join('<span>・</span>')}</div>`;
        h += `<div class="type-line"><span>${it.before||''}</span>
          <input class="type-input ${it.long?'long':''}" data-item="${it.id}" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" lang="en">
          <span>${it.after||''}</span></div>
          <div class="hint">${it.hint||'半角の英字で入力しましょう。'}${it.long?'単語と単語の間はスペースを1つ空けます。':''}</div>`;
      } else if(it.type==='order'){
        h += `<div class="order-row">`;
        it.cards.forEach((c,ci)=>{
          h += `<div class="order-card"><span class="emoji">${c.emoji}</span><span class="jp">${c.jp||''}</span>
            <div class="order-btns" data-item="${it.id}" data-ci="${ci}">${[1,2,3].map(n=>`<button class="obtn" data-n="${n}">${n}</button>`).join('')}</div></div>`;
        });
        h += `</div>`;
      }
      h += `</div>`;
    });
    h += `</div>`;
    s.innerHTML = h;
    wrap.appendChild(s);
  });
  // 選択肢
  document.querySelectorAll('.choices').forEach(box=>{
    box.addEventListener('click', e=>{
      const b = e.target.closest('.choice'); if(!b || state.graded) return;
      if(box.dataset.multi){
        b.classList.toggle('selected');
        state.answers[box.dataset.item] = [...box.querySelectorAll('.choice.selected')].map(x=>x.dataset.v);
        return;
      }
      box.querySelectorAll('.choice').forEach(x=>x.classList.remove('selected'));
      b.classList.add('selected');
      state.answers[box.dataset.item] = b.dataset.v;
    });
  });
  // 順番
  document.querySelectorAll('.order-btns').forEach(box=>{
    box.addEventListener('click', e=>{
      const b = e.target.closest('.obtn'); if(!b || state.graded) return;
      box.querySelectorAll('.obtn').forEach(x=>x.classList.remove('selected'));
      b.classList.add('selected');
      const id = box.dataset.item;
      const arr = (state.answers[id] || []).slice();
      arr[+box.dataset.ci] = b.dataset.n;
      state.answers[id] = arr;
    });
  });
  // 入力
  document.querySelectorAll('.type-input').forEach(inp=>{
    inp.addEventListener('input', ()=>{ state.answers[inp.dataset.item] = inp.value; });
    inp.addEventListener('keydown', e=>{ if(e.key==='Enter') e.preventDefault(); });
  });
  // 音声ボタン
  document.querySelectorAll('[data-play]').forEach(b=>{
    b.addEventListener('click', ()=>{ const pi=+b.dataset.play; playAudio(TEST.pages[pi].audio, 1, $('st'+pi)); });
  });
  document.querySelectorAll('[data-stop]').forEach(b=>b.addEventListener('click', stopAudio));
}

function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  $(id).classList.add('active');
  window.scrollTo(0,0);
}
function goPage(i){
  stopAudio();
  state.page = i;
  show('page'+i);
  const n = TEST.pages.length;
  $('progress').textContent = `${i+1} / ${n}`;
  $('prevBtn').disabled = (i===0);
  $('nextBtn').textContent = (i===n-1) ? '採点する ✔' : 'つぎへ ▶';
  $('nextBtn').className = 'btn ' + (i===n-1 ? 'btn-green' : 'btn-main');
  const pg = TEST.pages[i];
  if(pg.audio && pg.autoplay!==false && !state.played[i]){
    state.played[i] = true;
    setTimeout(()=>playAudio(pg.audio, CONFIG.autoPlayTimes, $('st'+i)), 400);
  }
}

/* ---------- 採点 ---------- */
function norm(s){
  return String(s||'').toLowerCase().replace(/[’‘`]/g,"'").replace(/\s+/g,' ').trim().replace(/[.!?。]+$/,'').trim();
}
function allItems(){
  const list = [];
  TEST.pages.forEach(pg=>pg.items.forEach(it=>list.push({pg, it})));
  return list;
}
function itemName(pg, it){
  const lbl = (it.label||'').match(/^\(\d+\)/);
  return `${pg.sec==='k'?'知':'思'} ${pg.no}${lbl?lbl[0]:''}`;
}
function isAnswered(it){
  const v = state.answers[it.id];
  if(it.type==='order') return Array.isArray(v) && it.cards.every((_,i)=>v[i]);
  if(it.multi) return Array.isArray(v) && v.length>0;
  return !!norm(v);
}
function answerText(it, v){
  if(it.type==='type') return v || '';
  if(it.type==='order') return it.cards.map((c,i)=>`${c.jp}→${(v||[])[i]||'?'}`).join('、');
  if(Array.isArray(v)) return v.map(x=>answerText(it,x)).join('・');
  const o = it.options.find(x=>x.v===v);
  if(!o) return '';
  return [o.mark, o.text, o.jp].filter(Boolean).join(' ') || o.v;
}
function correctText(it){
  if(it.type==='type') return it.answers[0];
  if(it.type==='order') return answerText(it, it.answer);
  if(it.multi) return it.answer.map(x=>correctText({...it, multi:false, answer:x})).join('・');
  if(it.options.length && it.options[0].html){
    return it.options.find(x=>x.v===it.answer).mark;
  }
  return answerText(it, it.answer);
}
function grade(){
  const unanswered = allItems().filter(({it})=>!isAnswered(it)).length;
  if(unanswered && !confirm(`まだ答えていない問題が ${unanswered} こあります。\nこのまま採点しますか？`)) return;
  stopAudio();
  state.graded = true;
  const sc = {k:0, t:0}, max = {k:0, t:0};
  const rows = [];
  allItems().forEach(({pg, it})=>{
    const v = state.answers[it.id];
    const ok = (it.type==='type' && it.exact) ? it.answers.includes(String(v||'').trim().replace(/\.$/,''))
             : it.type==='type' ? it.answers.map(norm).includes(norm(v))
             : it.multi ? (Array.isArray(v) && v.length===it.answer.length && it.answer.every(x=>v.includes(x)))
             : it.type==='order' ? (Array.isArray(v) && it.answer.every((n,i)=>v[i]===n))
             : v===it.answer;
    max[pg.sec] += it.pts;
    if(ok) sc[pg.sec] += it.pts;
    rows.push({name:itemName(pg,it), sec:pg.sec, ok, type:it.type, your:answerText(it, v), right:correctText(it)});
  });
  state.result = {sc, max, rows};
  $('resName').textContent = `${state.num}番　${state.name}`;
  $('scK').textContent = `${sc.k} / ${max.k}`;
  $('scT').textContent = `${sc.t} / ${max.t}`;
  $('reviewBody').innerHTML = rows.map(r=>`<tr><td>${secName[r.sec]} ${r.name.slice(2)}</td>
    <td class="${r.ok?'ok':'ng'}">${r.ok?'○':'×'}</td>
    <td>${r.ok ? r.right : (r.type==='type'
        ? `あなた：<span class="your">${esc(r.your)||'（入力なし）'}</span><br>正しいつづり：<b>${r.right}</b>`
        : `正しい答え：<b>${r.right}</b>`)}</td></tr>`).join('');
  $('navbar').style.display = 'none';
  $('progress').style.display = 'none';
  show('result');
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(drawImage);
}
function esc(s){ return String(s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ---------- 結果画像（ロイロノート提出用） ---------- */
function drawImage(){
  const {sc, max, rows} = state.result;
  const W = 900, rowH = 38, top = 250;
  const H = top + rows.length*rowH + 40;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d');
  const F = '"Andika","BIZ UDPGothic","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif';
  x.fillStyle = '#fff'; x.fillRect(0,0,W,H);
  x.fillStyle = '#2f6bb0'; x.fillRect(0,0,W,64);
  x.fillStyle = '#fff'; x.font = `bold 26px ${F}`; x.fillText(TEST.header + '　単元テスト', 24, 42);
  x.fillStyle = '#222'; x.font = `bold 26px ${F}`;
  x.fillText(`${state.num}番　${state.name}`, 24, 108);
  const d = new Date();
  x.font = `18px ${F}`; x.fillStyle = '#666';
  x.fillText(`${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`, W-200, 108);
  const box = (bx, color, label, val)=>{
    x.fillStyle = color; x.fillRect(bx, 128, 410, 96);
    x.fillStyle = '#fff'; x.font = `bold 20px ${F}`; x.fillText(label, bx+16, 158);
    x.font = `bold 44px ${F}`; x.fillText(val, bx+16, 210);
  };
  box(24, '#4a90d9', '知識・技能', `${sc.k} / ${max.k}`);
  box(466, '#e08a2c', '思考・判断・表現', `${sc.t} / ${max.t}`);
  rows.forEach((r,i)=>{
    const y = top + i*rowH;
    if(i%2===0){ x.fillStyle = '#f3f8fe'; x.fillRect(24, y, W-48, rowH); }
    x.fillStyle = '#222'; x.font = `18px ${F}`;
    x.fillText(`${secName[r.sec]} ${r.name.slice(2)}`, 36, y+26);
    x.fillStyle = r.ok ? '#3fae5a' : '#e05c5c'; x.font = `bold 24px ${F}`;
    x.fillText(r.ok?'○':'×', 300, y+27);
    x.fillStyle = '#333'; x.font = `18px ${F}`;
    let t = r.type==='type' ? `入力：${r.your||'（なし）'}` + (r.ok?'':`　→ ${r.right}`) : (r.ok ? '' : `正しい答え：${r.right}`);
    x.fillText(t, 340, y+26);
  });
  const url = c.toDataURL('image/png');
  $('resultImg').src = url;
  state.imgUrl = url;
}

/* ---------- スタート ---------- */
$('hdr').textContent = TEST.header;
document.title = TEST.header + ' 単元テスト';
buildPages();
$('soundTest').addEventListener('click', ()=>playAudio([{t:'Hello! Can you hear me?'}], 1, null));
$('startBtn').addEventListener('click', ()=>{
  const num = $('num').value.trim(), nm = $('nm').value.trim(), ps = $('pass').value.trim();
  if(!num || !nm){ $('startErr').textContent = '番号と名前を入れましょう。'; return; }
  if(ps !== CONFIG.passcode){ $('startErr').textContent = 'パスコードがちがいます。'; return; }
  state.num = num; state.name = nm;
  $('navbar').style.display = 'flex';
  $('progress').style.display = 'inline-block';
  goPage(0);
});
$('prevBtn').addEventListener('click', ()=>{ if(state.page>0) goPage(state.page-1); });
$('nextBtn').addEventListener('click', ()=>{
  if(state.page < TEST.pages.length-1) goPage(state.page+1); else grade();
});
$('saveImg').addEventListener('click', ()=>{
  const a = document.createElement('a');
  a.href = state.imgUrl;
  a.download = `${TEST.file}_${state.num}_${state.name}.png`;
  document.body.appendChild(a); a.click(); a.remove();
});
</script>
